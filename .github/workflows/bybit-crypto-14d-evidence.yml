name: bybit-crypto-14d-evidence

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - '.github/workflows/bybit-crypto-14d-evidence.yml'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Completed Bybit UTC archive days; minimum 14'
        required: false
        default: '14'
      symbols:
        description: 'Comma-separated USDT perpetual symbols'
        required: false
        default: 'BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-14d-evidence-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Verify crypto evidence boundary
        run: |
          ruff check --output-format=github \
            app/marketdata/bybit_public_archive.py \
            app/strategy/crypto_perp.py \
            app/strategy/crypto_profit_runner.py \
            app/strategy/crypto_runner_admission.py \
            app/strategy/crypto_evidence.py \
            app/strategy/crypto_replay_quality.py \
            app/strategy/crypto_protection_quality.py \
            tools/replay_bybit_crypto.py \
            tools/replay_bybit_crypto_runner.py \
            tools/replay_bybit_crypto_archive.py \
            tools/normalize_bybit_crypto_replay.py \
            tools/evaluate_bybit_crypto_replay.py \
            tests/test_bybit_crypto_runner_replay.py \
            tests/test_crypto_evidence.py
          pytest -q \
            tests/test_bybit_crypto_runner_replay.py \
            tests/test_crypto_evidence.py \
            tests/test_crypto_replay_quality.py \
            tests/test_crypto_protection_quality.py \
            tests/test_evaluate_bybit_crypto_replay.py
          python -m compileall -q \
            app/strategy/crypto_perp.py \
            app/strategy/crypto_profit_runner.py \
            app/strategy/crypto_runner_admission.py \
            app/strategy/crypto_evidence.py \
            tools/replay_bybit_crypto_runner.py \
            tools/replay_bybit_crypto_archive.py

  replay-14d:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Enforce evidence window
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          if ! [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]]; then
            echo 'lookback_days must be an integer' >&2
            exit 1
          fi
          if [ "$LOOKBACK_DAYS" -lt 14 ]; then
            echo '14-day evidence workflow refuses windows shorter than 14 completed UTC days' >&2
            exit 1
          fi

      - name: Replay official completed Bybit archives
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
          SYMBOLS: ${{ inputs.symbols || 'BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/bybit-crypto-14d/trades
          PYTHONPATH=. python tools/replay_bybit_crypto_archive.py \
            --symbols "$SYMBOLS" \
            --lookback-days "$LOOKBACK_DAYS" \
            --opening-equity 1000 \
            --targets 15,20,25 \
            --output artifacts/bybit-crypto-14d/report-raw.json \
            --trades-dir artifacts/bybit-crypto-14d/trades

      - name: Normalize and score evidence
        run: |
          PYTHONPATH=. python tools/normalize_bybit_crypto_replay.py \
            --input artifacts/bybit-crypto-14d/report-raw.json \
            --output artifacts/bybit-crypto-14d/report.json
          PYTHONPATH=. python tools/evaluate_bybit_crypto_replay.py \
            --input artifacts/bybit-crypto-14d/report.json \
            --output artifacts/bybit-crypto-14d/evidence-scorecard.json

      - name: Enforce 14-day research contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/bybit-crypto-14d/report.json').read_text())
          scorecard = json.loads(Path('artifacts/bybit-crypto-14d/evidence-scorecard.json').read_text())

          assert report['qualification'] == 'PASS_CRYPTO_HISTORICAL_REPLAY'
          assert len(report['archive_dates']) >= 14
          assert report['archive_completed_utc_days_only'] is True
          assert report['current_incomplete_bar_excluded'] is True
          assert report['raw_trade_archive_committed_to_repository'] is False
          assert report['strategy_promotion_allowed'] is False
          assert report['bybit_demo_order_writes_enabled'] is False
          assert report['bybit_live_order_routing_allowed'] is False
          assert scorecard['strategy_promotion_allowed'] is False
          assert scorecard['live_promotion_allowed'] is False

          conditional = report['strategy_shadow_candidates'][
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X'
          ]
          assert conditional['minimum_entry_net_profit_usd'] == 20.0
          assert conditional['runner_minimum_expected_edge_multiple'] == 1.5
          assert conditional['unconditional_runner_shadow_explicitly_enabled'] is False
          assert conditional['strategy_promotion_allowed'] is False
          assert conditional['bybit_live_order_routing_allowed'] is False

          unconditional = report['strategy_shadow_candidates'][
              'MIN_20_NET_EDGE_OPEN_ENDED_RUNNER'
          ]
          assert unconditional['unconditional_runner_shadow_explicitly_enabled'] is True
          assert unconditional['strategy_promotion_allowed'] is False
          assert unconditional['bybit_live_order_routing_allowed'] is False
          PY

      - name: Write compact decision summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/bybit-crypto-14d/report.json').read_text())
          scorecard = json.loads(Path('artifacts/bybit-crypto-14d/evidence-scorecard.json').read_text())
          conditional = report['strategy_shadow_candidates'][
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X'
          ]
          summary = {
              'archive_dates': report['archive_dates'],
              'symbols': report['symbols'],
              'conditional_runner_metrics': conditional['metrics'],
              'runner_selected_trade_count': conditional['runner_selected_trade_count'],
              'fixed_target_selected_trade_count': conditional['fixed_target_selected_trade_count'],
              'runner_activation_event_count': conditional['runner_activation_event_count'],
              'trade_plan_block_reason_counts': conditional['trade_plan_block_reason_counts'],
              'scorecard': scorecard['strategy_shadow_candidates'][
                  'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X'
              ],
              'strategy_promotion_allowed': False,
              'live_promotion_allowed': False,
          }
          Path('artifacts/bybit-crypto-14d/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('BYBIT_CRYPTO_14D_SUMMARY=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload 14-day evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-14d-evidence-${{ github.run_id }}
          path: artifacts/bybit-crypto-14d
          if-no-files-found: warn
          retention-days: 30