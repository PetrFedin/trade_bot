  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bybit-trading-v2-integration-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integrated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint Bybit trading v2 surface
        run: >-
          ruff check --output-format=github
          app/execution/bybit_demo.py
          app/execution/bybit_demo_controller.py
          app/execution/bybit_demo_cycle.py
          app/execution/bybit_demo_strategy_selector.py
