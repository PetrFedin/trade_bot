name: intraday-5m-execution-reconstruction

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/intraday_five_minute_order.py'
      - 'tools/intraday_trade_execution_order.py'
      - 'tools/intraday_evidence_admission.py'
      - 'tests/test_intraday_five_minute_order.py'
      - 'research/snapshots/bybit_intraday_trade_cases_5m/**'
      - 'research/snapshots/bybit_intraday_trade_cases_60m/**'
      - 'docs/ASTRA_INTEGRATION_MASTER_PLAN_2026-10-01.md'
      - 'docs/STRATEGY_EVIDENCE_LEARNING_LOG.md'
      - '.github/workflows/intraday-5m-execution-reconstruction.yml'

permissions:
  contents: read

concurrency:
  group: intraday-five-minute-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-execution-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Static and real-provider data qualification
        run: |
          ruff check tools/intraday_five_minute_order.py tests/test_intraday_five_minute_order.py
          python -m compileall -q tools/intraday_five_minute_order.py
          pytest -q tests/test_intraday_five_minute_order.py

      - name: Reconstruct four real five-minute stop/target examples
        run: |
          mkdir -p five-minute-evidence
          python -m tools.intraday_five_minute_order \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --hourly-cases-dir research/snapshots/bybit_intraday_trade_cases_60m \
            --five-minute-cases-dir research/snapshots/bybit_intraday_trade_cases_5m \
            --output five-minute-evidence/strategy-a-5m-case-order.json

      - name: Fail closed on research-promotion confusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("five-minute-evidence/strategy-a-5m-case-order.json").read_text())
          assert p["research_only"] is True
          assert p["strategy_promotion_allowed"] is False
          assert p["live_trading_allowed"] is False
          assert p["untouched_holdout"] is False
          assert p["full_portfolio_pnl_recomputed"] is False
          assert p["provider_authenticity_independently_verified"] is False
          assert p["summary"]["cases"] == 4
          assert p["summary"]["complete_five_minute_candles"] == 1152
          assert p["summary"]["five_minute_unresolved"] == 0
          assert p["summary"]["five_minute_protective_first"] == 1
          assert p["summary"]["five_minute_target_first"] == 3
          assert len(p["evidence_sha256"]) == 64
          PY

      - name: Upload hash-bound five-minute research evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-five-minute-research-${{ github.run_id }}
          path: five-minute-evidence/strategy-a-5m-case-order.json
          if-no-files-found: error
          retention-days: 30
