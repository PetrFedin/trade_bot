name: schema108-asymmetric-signing-authority

on:
  pull_request:
    branches:
      - agent/schema107-production-rollout-actuator
    types: [opened, reopened, synchronize]
    paths:
      - app/runtime/**v108.py
      - app/platform_assets/v108/**
      - migrations/v108/**
      - tests/**v108.py
      - tools/**v108.py
      - tools/platform_v107.py
      - RELEASE_IDENTITY_V107.json
      - RELEASE_IDENTITY_V108.json
      - pyproject.toml
      - ENGINEERING_REPORT_V108.md
      - OPERATOR_RUNBOOK_V108.md
      - INTEGRATION_V108.md
      - LIVE_EXECUTION_STATUS_V108.json
      - QUALIFICATION_SUMMARY_V108.md
      - RELEASE_NOTES_V108.md
      - .github/workflows/schema99-external-paper-roundtrip.yml
      - .github/workflows/schema108-asymmetric-signing-authority.yml

permissions:
  contents: read

concurrency:
  group: schema108-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra-ci
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check ".[test,postgresql]"

      - name: Focused Schema 108 tests
        run: pytest -q tests/*v108.py

      - name: Complete stacked test suite
        run: pytest -q

      - name: Exact branch-aware Schema 108 coverage
        shell: bash
        run: |
          coverage erase
          coverage run --branch --include='app/runtime/*_v108.py' -m pytest -q tests/*v108.py
          coverage json -o coverage-v108.json
          python - <<'PYCODE'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage-v108.json").read_text(encoding="utf-8"))
          total = float(report["totals"]["percent_covered"])
          print(f"exact V108 branch-aware coverage: {total:.6f}%")
          if total < 98.0:
              raise SystemExit(f"coverage {total:.6f}% is below 98.0%")
          PYCODE

      - name: Architecture audit
        run: python tools/architecture_audit_v108.py .

      - name: Static security audit
        run: python tools/static_audit_v108.py .

      - name: Compile all Python sources
        run: python -m compileall -q app tools tests

      - name: Verify predecessor and release identities
        run: |
          python tools/platform_v107.py --root . verify-release
          python tools/platform_v108.py --root . verify-release

      - name: Concurrent replay stress
        run: python -m tools.stress_v108 --iterations 1000 --workers 8

      - name: Verify canonical migration packaging
        run: cmp migrations/v108/001_asymmetric_signing_authority.sql app/platform_assets/v108/migrations/001_asymmetric_signing_authority.sql

      - name: Apply migration twice to real PostgreSQL
        shell: bash
        env:
          PGPASSWORD: astra-ci
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          for pass in 1 2; do
            psql --host=127.0.0.1 --port=5432 --username=astra --dbname=astra \
              --set=ON_ERROR_STOP=1 --file=migrations/v108/001_asymmetric_signing_authority.sql
          done
          psql --host=127.0.0.1 --port=5432 --username=astra --dbname=astra \
            --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.table_constraints
              WHERE table_schema = 'public'
                AND table_name = 'astra_signature_replay_v108'
                AND constraint_type = 'UNIQUE'
            ) THEN
              RAISE EXCEPTION 'signature replay uniqueness contract missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'astra_signing_keyring_v108'
                AND column_name = 'generation'
                AND is_nullable = 'NO'
            ) THEN
              RAISE EXCEPTION 'monotonic keyring generation contract missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.table_constraints
              WHERE table_schema = 'public'
                AND table_name = 'astra_receipt_authorization_v108'
                AND constraint_type = 'FOREIGN KEY'
            ) THEN
              RAISE EXCEPTION 'durable receipt authorization binding missing';
            END IF;
          END
          $$;
          SQL

      - name: Verify runtime has no private-key implementation
        shell: bash
        run: |
          if grep -R -n -E 'Ed25519PrivateKey|private_key_(bytes|b64)|hmac\.new' app/runtime/*_v108.py; then
            echo "forbidden private or symmetric signing material in V108 runtime" >&2
            exit 1
          fi

      - name: Verify production safety remains disabled
        shell: bash
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          state = json.loads(Path("LIVE_EXECUTION_STATUS_V108.json").read_text(encoding="utf-8"))
          assert state["schema"] == 108
          assert state["production_signing_authority_verified"] is False
          assert state["production_kubernetes_mutation_authorized"] is False
          assert state["external_order_routing_allowed"] is False
          assert state["live_trading_allowed"] is False
          assert state["private_key_material_persisted_by_runtime"] is False
          PYCODE
