name: bybit-entry-recovery

on:
  pull_request:
    paths:
      - 'app/execution/bybit_entry_recovery.py'
      - 'app/execution/bybit_postgres_entry_recovery.py'
      - 'app/execution/bybit_demo_cycle.py'
      - 'app/execution/bybit_oms_entry_client.py'
      - 'migrations/product/008_bybit_entry_recovery.sql'
      - 'tests/test_bybit_entry_recovery.py'
      - 'tests/test_bybit_entry_recovery_cycle.py'
      - 'tests/test_bybit_postgres_entry_recovery.py'
      - 'tests/test_bybit_demo_cycle.py'
      - 'tests/test_bybit_oms_entry_client.py'
      - '.github/workflows/bybit-entry-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_entry_recovery.py'
      - 'app/execution/bybit_postgres_entry_recovery.py'
      - 'app/execution/bybit_demo_cycle.py'
      - 'app/execution/bybit_oms_entry_client.py'
      - 'migrations/product/008_bybit_entry_recovery.sql'
      - 'tests/test_bybit_entry_recovery.py'
      - 'tests/test_bybit_entry_recovery_cycle.py'
      - 'tests/test_bybit_postgres_entry_recovery.py'
      - 'tests/test_bybit_demo_cycle.py'
      - 'tests/test_bybit_oms_entry_client.py'
      - '.github/workflows/bybit-entry-recovery.yml'

permissions:
  contents: read

concurrency:
  group: bybit-entry-recovery-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRA_TEST_POSTGRES_DSN: postgresql://astra:astra@127.0.0.1:5432/astra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recovery qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[test,postgresql]'
          python -m pip check
      - name: Entry recovery envelope and mutation-order contract
        run: >-
          pytest -q
          tests/test_bybit_entry_recovery.py
          tests/test_bybit_entry_recovery_cycle.py
          tests/test_bybit_demo_cycle.py
          tests/test_bybit_oms_entry_client.py
      - name: PostgreSQL immutable recovery state
        run: pytest -q tests/test_bybit_postgres_entry_recovery.py
      - name: Compile recovery boundary
        run: >-
          python -m compileall -q
          app/execution/bybit_entry_recovery.py
          app/execution/bybit_postgres_entry_recovery.py
          app/execution/bybit_demo_cycle.py
          app/execution/bybit_oms_entry_client.py
