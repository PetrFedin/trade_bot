name: schema109-ruff-diagnostic

on:
  push:
    branches:
      - agent/schema109-clean-materialize-20260809
    paths:
      - .github/workflows/schema109-ruff-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Reconstruct exact overlay
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, gzip, hashlib, io, json, tarfile
          payload = Path('_schema109_final_payload')
          manifest = json.loads((payload / 'manifest.json').read_text(encoding='utf-8'))
          encoded_parts = []
          for name, expected in manifest['chunks'].items():
              data = (payload / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected, name
              encoded_parts.append(data.decode('ascii'))
          encoded = ''.join(encoded_parts)
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == manifest['combined_base64_sha256']
          archive = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(archive).hexdigest() == manifest['archive_sha256']
          overlay = Path('schema109-ruff-overlay')
          overlay.mkdir()
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(archive)), mode='r:') as tf:
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  assert member.isfile() and not member.issym() and not member.islnk()
                  assert not path.is_absolute() and '..' not in path.parts and str(path) == member.name
                  source = tf.extractfile(member)
                  assert source is not None
                  body = source.read()
                  assert hashlib.sha256(body).hexdigest() == manifest['files'][member.name]
                  dst = overlay / Path(*path.parts)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(body)
          PY
          git worktree add --detach /tmp/schema109-ruff-target f9d2f693437b3b8e9994fa02adeb13059ed6f7cb
          cp -a schema109-ruff-overlay/. /tmp/schema109-ruff-target/
      - name: Install lint surface
        working-directory: /tmp/schema109-ruff-target
        run: python -m pip install --disable-pip-version-check ".[test,postgresql,dev]"
      - name: Capture exact Ruff diagnostics
        working-directory: /tmp/schema109-ruff-target
        run: |
          set +e
          ruff check \
            app/runtime/*_v109.py \
            tools/*v109.py \
            tools/platform_v108.py \
            tools/architecture_audit_v108.py \
            tools/product_identity.py \
            tests/*v109.py \
            tests/test_product_identity.py > "$GITHUB_WORKSPACE/ruff-v109.txt" 2>&1
          status=$?
          cat "$GITHUB_WORKSPACE/ruff-v109.txt"
          echo "ruff_exit=$status" > "$GITHUB_WORKSPACE/ruff-exit.txt"
          exit 0
      - name: Upload exact diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema109-ruff-diagnostics
          path: |
            ruff-v109.txt
            ruff-exit.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
