name: schema99-external-paper-roundtrip

on:
  push:
    branches: [main, agent/schema99-external-paper-roundtrip]
  pull_request:

permissions:
  contents: read

concurrency:
  group: schema99-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification dependency graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Complete stacked test suite
        run: python -m pytest -q

      - name: Branch-aware stacked coverage
        run: |
          coverage erase
          coverage run --branch -m pytest -q
          coverage report --fail-under=80
