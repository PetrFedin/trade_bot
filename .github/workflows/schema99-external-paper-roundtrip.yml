name: schema99-external-paper-roundtrip

on:
  push:
    branches: [main, agent/schema99-external-paper-roundtrip]
  pull_request:

permissions:
  contents: read

concurrency:
  group: schema99-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install current project and qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check ".[test,postgresql]"
          python -m pip check

      - name: Complete stacked test suite
        run: python -m pytest -q

      - name: Branch-aware stacked coverage
        run: |
          coverage erase
          coverage run --branch -m pytest -q
          coverage report --fail-under=80
