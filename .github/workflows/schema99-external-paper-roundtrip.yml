name: schema99-external-paper-roundtrip

on:
  push:
    branches: [main, agent/schema99-external-paper-roundtrip]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'pytest>=8,<10' 'coverage>=7,<8'
      - run: python -m pytest -q
      - run: coverage run --branch -m pytest -q
      - run: coverage report --fail-under=80
