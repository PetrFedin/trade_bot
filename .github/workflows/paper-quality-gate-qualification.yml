name: paper-quality-gate-qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/application/paper_quality_gate.py'
      - 'app/application/paper_quality_cycle.py'
      - 'app/application/paper_decision_audit.py'
      - 'app/application/paper_decision_cycle.py'
      - 'app/application/paper_execution_quality.py'
      - 'app/application/paper_reaction_quality.py'
      - 'app/application/portfolio_paper_planner.py'
      - 'app/strategy/quality_monitor.py'
      - 'tests/test_paper_quality_gate.py'
      - 'tests/test_paper_quality_cycle.py'
      - 'tests/test_paper_decision_audit.py'
      - 'tests/test_portfolio_paper_planner.py'
      - '.github/workflows/paper-quality-gate-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'app/application/paper_quality_gate.py'
      - 'app/application/paper_quality_cycle.py'
      - 'app/application/paper_decision_audit.py'
      - 'app/application/paper_decision_cycle.py'
      - 'app/application/paper_execution_quality.py'
      - 'app/application/paper_reaction_quality.py'
      - 'app/application/portfolio_paper_planner.py'
      - 'app/strategy/quality_monitor.py'
      - 'tests/test_paper_quality_gate.py'
      - 'tests/test_paper_quality_cycle.py'
      - 'tests/test_paper_decision_audit.py'
      - 'tests/test_portfolio_paper_planner.py'
      - '.github/workflows/paper-quality-gate-qualification.yml'

permissions:
  contents: read

concurrency:
  group: paper-quality-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint composite paper quality gate
        run: >-
          ruff check --output-format=github
          app/application/paper_quality_gate.py
          app/application/paper_quality_cycle.py
          app/application/paper_decision_audit.py
          app/application/paper_decision_cycle.py
          app/application/paper_execution_quality.py
          app/application/paper_reaction_quality.py
          app/application/portfolio_paper_planner.py
          tests/test_paper_quality_gate.py
          tests/test_paper_quality_cycle.py
          tests/test_paper_decision_audit.py
          tests/test_portfolio_paper_planner.py

      - name: Composite paper quality gate regressions
        shell: bash
        run: |
          set -o pipefail
          pytest -vv \
            tests/test_paper_quality_gate.py \
            tests/test_paper_quality_cycle.py \
            tests/test_paper_decision_audit.py \
            tests/test_portfolio_paper_planner.py \
            2>&1 | tee paper-quality-gate-pytest.txt

      - name: Upload composite gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paper-quality-gate-${{ github.run_id }}
          path: paper-quality-gate-pytest.txt
          if-no-files-found: warn
          retention-days: 30
