name: portfolio-durability

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths:
      - 'app/portfolio/**'
      - 'app/domain/**'
      - 'tests/test_portfolio_durability.py'
      - 'tests/test_durable_oms_e2e.py'
      - '.github/workflows/portfolio-durability.yml'
  pull_request:
    paths:
      - 'app/portfolio/**'
      - 'app/domain/**'
      - 'tests/test_portfolio_durability.py'
      - 'tests/test_durable_oms_e2e.py'
      - '.github/workflows/portfolio-durability.yml'

permissions:
  contents: read

concurrency:
  group: portfolio-durability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Portfolio replay and corporate actions
        run: pytest -q tests/test_portfolio_durability.py
      - name: Portfolio and broker reconciliation regression
        run: pytest -q tests/test_durable_oms_e2e.py
      - name: Compile portfolio boundary
        run: python -m compileall -q app/portfolio app/domain
