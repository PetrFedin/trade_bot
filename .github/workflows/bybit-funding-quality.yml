name: bybit-funding-quality

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/marketdata/bybit_funding.py'
      - 'app/strategy/crypto_funding_impact.py'
      - 'tests/test_bybit_funding.py'
      - 'tests/test_crypto_funding_impact.py'
      - '.github/workflows/bybit-funding-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/marketdata/bybit_funding.py'
      - 'app/strategy/crypto_funding_impact.py'
      - 'tests/test_bybit_funding.py'
      - 'tests/test_crypto_funding_impact.py'
      - '.github/workflows/bybit-funding-quality.yml'

permissions:
  contents: read

concurrency:
  group: bybit-funding-quality-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  funding-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint funding surface
        run: >-
          ruff check --output-format=github
          app/marketdata/bybit_funding.py
          app/strategy/crypto_funding_impact.py
          tests/test_bybit_funding.py
          tests/test_crypto_funding_impact.py

      - name: Test funding acquisition and accounting contract
        run: >-
          pytest -vv
          tests/test_bybit_funding.py
          tests/test_crypto_funding_impact.py

      - name: Compile funding boundary
        run: >-
          python -m compileall -q
          app/marketdata/bybit_funding.py
          app/strategy/crypto_funding_impact.py
