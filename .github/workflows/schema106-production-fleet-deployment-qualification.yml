name: schema106-production-fleet-deployment-qualification

on:
  pull_request:
    branches:
      - agent/schema105-production-worker-fleet-operations
    types: [opened, reopened, synchronize]
    paths:
      - app/runtime/**v106.py
      - app/platform_assets/v106/**
      - migrations/v106/**
      - tests/**v106.py
      - tools/**v106.py
      - tools/platform_v105.py
      - RELEASE_IDENTITY_V105.json
      - pyproject.toml
      - README.md
      - ENGINEERING_REPORT_V106.md
      - OPERATOR_RUNBOOK_V106.md
      - INTEGRATION_V106.md
      - LIVE_EXECUTION_STATUS_V106.json
      - QUALIFICATION_SUMMARY_V106.md
      - RELEASE_IDENTITY_V106.json
      - RELEASE_NOTES_V106.md
      - .github/workflows/schema106-production-fleet-deployment-qualification.yml

permissions:
  contents: read

concurrency:
  group: schema106-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install qualification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8,<10' 'coverage>=7,<8'

      - name: Schema 105 successor compatibility
        run: |
          python -m pytest -q tests/test_tools_v105.py
          python -m tools.platform_v105 --root . verify-release

      - name: Focused Schema 106 tests
        run: |
          python -m pytest -q \
            tests/test_deployment_qualification_v106.py \
            tests/test_kubernetes_qualification_adapter_v106.py \
            tests/test_postgres_deployment_qualification_v106.py \
            tests/test_tools_v106.py

      - name: Branch-aware coverage
        run: |
          coverage erase
          coverage run --branch -m pytest -q \
            tests/test_deployment_qualification_v106.py \
            tests/test_kubernetes_qualification_adapter_v106.py \
            tests/test_postgres_deployment_qualification_v106.py \
            tests/test_tools_v106.py
          coverage report --include='app/runtime/*v106.py' --fail-under=98

      - name: Architecture audit
        run: python -m tools.architecture_audit_v106 .

      - name: Static security audit
        run: python -m tools.static_audit_v106 .

      - name: Compile all Python sources
        run: python -m compileall -q app tools tests

      - name: Verify release identity
        run: python -m tools.platform_v106 --root . verify-release

      - name: Concurrent deterministic stress
        run: python -m tools.stress_v106 --iterations 1000 --workers 8
