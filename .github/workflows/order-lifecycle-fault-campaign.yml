name: order-lifecycle-fault-campaign

on:
  push:
    branches: [main]
    paths:
      - 'app/application/order_lifecycle.py'
      - 'app/execution/paper_executor.py'
      - 'app/execution/order_mutation_executor.py'
      - 'app/oms/store.py'
      - 'app/oms/postgres.py'
      - 'app/oms/order_mutations.py'
      - 'app/oms/order_mutations_postgres.py'
      - 'migrations/v107/**'
      - 'migrations/v108/**'
      - 'migrations/v109/**'
      - 'app/platform_assets/v107/migrations/**'
      - 'app/platform_assets/v108/migrations/**'
      - 'app/platform_assets/v109/migrations/**'
      - 'tests/test_paper_executor_e2e.py'
      - 'tests/test_order_mutation_e2e.py'
      - 'tests/test_postgres_order_mutation_e2e.py'
      - 'tests/test_postgres_remote_signer_repository_v109.py'
      - 'requirements.lock'
      - '.github/workflows/order-lifecycle-fault-campaign.yml'
  pull_request:
    paths:
      - 'app/application/order_lifecycle.py'
      - 'app/execution/paper_executor.py'
      - 'app/execution/order_mutation_executor.py'
      - 'app/oms/store.py'
      - 'app/oms/postgres.py'
      - 'app/oms/order_mutations.py'
      - 'app/oms/order_mutations_postgres.py'
      - 'migrations/v107/**'
      - 'migrations/v108/**'
      - 'migrations/v109/**'
      - 'app/platform_assets/v107/migrations/**'
      - 'app/platform_assets/v108/migrations/**'
      - 'app/platform_assets/v109/migrations/**'
      - 'tests/test_paper_executor_e2e.py'
      - 'tests/test_order_mutation_e2e.py'
      - 'tests/test_postgres_order_mutation_e2e.py'
      - 'tests/test_postgres_remote_signer_repository_v109.py'
      - 'requirements.lock'
      - '.github/workflows/order-lifecycle-fault-campaign.yml'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-lifecycle-fault-campaign-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra-ci
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASTRA_TEST_POSTGRES_DSN: postgresql://astra:astra-ci@127.0.0.1:5432/astra
      PGPASSWORD: astra-ci

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Repeated SQLite submit and mutation fault campaign
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            CYCLES=100
          else
            CYCLES=25
          fi
          for cycle in $(seq 1 "$CYCLES"); do
            echo "SQLite fault cycle ${cycle}/${CYCLES}"
            pytest -q \
              tests/test_paper_executor_e2e.py \
              tests/test_order_mutation_e2e.py
          done
          echo "SQLITE_CYCLES=$CYCLES" >> "$GITHUB_ENV"

      - name: Repeated PostgreSQL mutation durability and fencing campaign
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            CYCLES=25
          else
            CYCLES=8
          fi
          for cycle in $(seq 1 "$CYCLES"); do
            echo "PostgreSQL fault cycle ${cycle}/${CYCLES}"
            pytest -q tests/test_postgres_order_mutation_e2e.py
          done
          echo "POSTGRES_CYCLES=$CYCLES" >> "$GITHUB_ENV"

      - name: Verify and apply security migration lineage twice
        shell: bash
        run: |
          set -euo pipefail
          cmp migrations/v107/001_production_rollout_actuator.sql app/platform_assets/v107/migrations/001_production_rollout_actuator.sql
          cmp migrations/v108/001_asymmetric_signing_authority.sql app/platform_assets/v108/migrations/001_asymmetric_signing_authority.sql
          cmp migrations/v109/001_remote_signer_attestation.sql app/platform_assets/v109/migrations/001_remote_signer_attestation.sql
          migrations=(
            migrations/v107/001_production_rollout_actuator.sql
            migrations/v108/001_asymmetric_signing_authority.sql
            migrations/v109/001_remote_signer_attestation.sql
          )
          for pass in 1 2; do
            echo "Security migration lineage pass ${pass}/2"
            for migration in "${migrations[@]}"; do
              psql -h 127.0.0.1 -p 5432 -U astra -d astra -v ON_ERROR_STOP=1 -f "$migration"
            done
          done

      - name: Write and validate campaign evidence
        run: |
          mkdir -p fault-campaign-evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              'status': 'PASS',
              'sqlite_cycles': int(os.environ['SQLITE_CYCLES']),
              'postgres_cycles': int(os.environ['POSTGRES_CYCLES']),
              'postgres_full_regression_enabled': bool(os.environ.get('ASTRA_TEST_POSTGRES_DSN')),
              'security_migration_lineage_applied': ['v107', 'v108', 'v109'],
              'security_migration_idempotency_passes': 2,
              'submit_fault_suite': 'tests/test_paper_executor_e2e.py',
              'mutation_fault_suite': 'tests/test_order_mutation_e2e.py',
              'postgres_mutation_suite': 'tests/test_postgres_order_mutation_e2e.py',
              'invariants': [
                  'at-most-one submit attempt',
                  'at-most-one cancel/replace attempt',
                  'GET-only ambiguity/restart recovery',
                  'monotonic partial/full fill adoption',
                  'durable mutation fencing and restart truth',
              ],
          }
          assert evidence['sqlite_cycles'] >= 25
          assert evidence['postgres_cycles'] >= 8
          assert evidence['postgres_full_regression_enabled'] is True
          assert evidence['security_migration_idempotency_passes'] == 2
          Path('fault-campaign-evidence/summary.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Complete deterministic regression with PostgreSQL enabled
        run: pytest -q

      - name: Verify fail-closed live state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('LIVE_EXECUTION_STATUS_V109.json').read_text(encoding='utf-8'))
          for key in (
              'external_order_routing_allowed',
              'live_trading_allowed',
              'production_remote_signer_verified',
              'production_signing_authority_verified',
              'production_kubernetes_mutation_authorized',
          ):
              assert state[key] is False, key
          PY

      - name: Upload fault campaign evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: order-lifecycle-fault-campaign-${{ github.run_id }}
          path: fault-campaign-evidence/summary.json
          if-no-files-found: error
          retention-days: 30
