name: risk-marketdata

on:
  push:
    branches: [main]
    paths:
      - 'app/marketdata/**'
      - 'app/risk/**'
      - 'app/domain/**'
      - 'tests/test_risk_marketdata.py'
      - '.github/workflows/risk-marketdata.yml'
  pull_request:
    paths:
      - 'app/marketdata/**'
      - 'app/risk/**'
      - 'app/domain/**'
      - 'tests/test_risk_marketdata.py'
      - '.github/workflows/risk-marketdata.yml'

permissions:
  contents: read

concurrency:
  group: risk-marketdata-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Market data and risk guardrail tests
        run: pytest -q tests/test_risk_marketdata.py
      - name: Product E2E regression
        run: pytest -q tests/test_trading_core_e2e.py tests/test_durable_oms_e2e.py
      - name: Full regression
        run: pytest -q
      - name: Compile risk and data boundary
        run: python -m compileall -q app/marketdata app/risk app/domain
