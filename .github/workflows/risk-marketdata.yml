name: risk-marketdata

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
  pull_request:
    paths:
      - 'app/marketdata/**'
      - 'app/risk/**'
      - 'app/domain/**'
      - 'tests/test_risk_marketdata.py'
      - '.github/workflows/risk-marketdata.yml'

permissions:
  contents: read

concurrency:
  group: risk-marketdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Market data and risk guardrail tests
        run: pytest -q tests/test_risk_marketdata.py
      - name: Product E2E regression
        run: pytest -q tests/test_trading_core_e2e.py tests/test_durable_oms_e2e.py
      - name: Full regression
        run: pytest -q
      - name: Compile risk and data boundary
        run: python -m compileall -q app/marketdata app/risk app/domain
