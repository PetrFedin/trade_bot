name: risk-marketdata

on:
  push:
    branches: [main]
    paths:
      - 'app/application/paper_pipeline.py'
      - 'app/application/paper_cycle.py'
      - 'app/application/composition.py'
      - 'app/application/risk_checked_mutations.py'
      - 'app/marketdata/**'
      - 'app/risk/**'
      - 'app/domain/**'
      - 'tests/test_operational_marketdata_admission.py'
      - 'tests/test_operational_risk_observations.py'
      - 'tests/test_portfolio_valuation_context.py'
      - 'tests/test_risk_marketdata.py'
      - 'tests/test_pipeline_risk_evidence.py'
      - 'tests/test_paper_cycle_e2e.py'
      - 'tests/test_trading_core_e2e.py'
      - '.github/workflows/risk-marketdata.yml'
  pull_request:
    paths:
      - 'app/application/paper_pipeline.py'
      - 'app/application/paper_cycle.py'
      - 'app/application/composition.py'
      - 'app/application/risk_checked_mutations.py'
      - 'app/marketdata/**'
      - 'app/risk/**'
      - 'app/domain/**'
      - 'tests/test_operational_marketdata_admission.py'
      - 'tests/test_operational_risk_observations.py'
      - 'tests/test_portfolio_valuation_context.py'
      - 'tests/test_risk_marketdata.py'
      - 'tests/test_pipeline_risk_evidence.py'
      - 'tests/test_paper_cycle_e2e.py'
      - 'tests/test_trading_core_e2e.py'
      - '.github/workflows/risk-marketdata.yml'

permissions:
  contents: read

concurrency:
  group: risk-marketdata-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Operational market-data, risk and portfolio valuation qualification
        run: |
          pytest -q \
            tests/test_operational_marketdata_admission.py \
            tests/test_operational_risk_observations.py \
            tests/test_portfolio_valuation_context.py \
            tests/test_risk_marketdata.py
      - name: Pipeline clock and evidence regression
        run: pytest -q tests/test_pipeline_risk_evidence.py tests/test_paper_cycle_e2e.py
      - name: Product E2E regression
        run: pytest -q tests/test_trading_core_e2e.py tests/test_durable_oms_e2e.py
      - name: Full regression
        run: pytest -q
      - name: Compile risk, data and operational planning boundary
        run: python -m compileall -q app/application app/marketdata app/risk app/domain
