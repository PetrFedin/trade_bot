name: bybit-crypto-trade-quality

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - '.github/workflows/bybit-crypto-trade-quality.yml'
      - 'app/strategy/crypto_trade_quality_diagnostics.py'
      - 'tools/report_bybit_crypto_trade_quality.py'
      - 'tests/test_crypto_trade_quality_diagnostics.py'
      - 'tests/test_report_bybit_crypto_trade_quality.py'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Completed UTC Bybit archive days; minimum 14'
        required: false
        default: '14'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-trade-quality-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint trade-quality surface
        run: >-
          ruff check --output-format=github
          app/strategy/crypto_trade_quality_diagnostics.py
          tools/report_bybit_crypto_trade_quality.py
          tests/test_crypto_trade_quality_diagnostics.py
          tests/test_report_bybit_crypto_trade_quality.py

      - name: Test trade-quality diagnostics
        run: >-
          pytest -vv
          tests/test_crypto_trade_quality_diagnostics.py
          tests/test_report_bybit_crypto_trade_quality.py

      - name: Compile diagnostics boundary
        run: >-
          python -m compileall -q
          app/strategy/crypto_trade_quality_diagnostics.py
          tools/report_bybit_crypto_trade_quality.py

  archive-quality-14d:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Enforce evidence window
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          if ! [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]]; then
            echo 'lookback_days must be an integer' >&2
            exit 1
          fi
          if [ "$LOOKBACK_DAYS" -lt 14 ]; then
            echo 'trade-quality evidence requires at least 14 completed UTC days' >&2
            exit 1
          fi

      - name: Replay official Bybit archive
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          mkdir -p artifacts/bybit-crypto-trade-quality
          PYTHONPATH=. python tools/replay_bybit_crypto_archive.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT \
            --lookback-days "$LOOKBACK_DAYS" \
            --opening-equity 1000 \
            --targets 15,20,25 \
            --output artifacts/bybit-crypto-trade-quality/replay.json

      - name: Build trade-quality diagnostics
        run: |
          PYTHONPATH=. python tools/report_bybit_crypto_trade_quality.py \
            --input artifacts/bybit-crypto-trade-quality/replay.json \
            --output artifacts/bybit-crypto-trade-quality/quality.json

      - name: Enforce diagnostic-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          quality = json.loads(Path('artifacts/bybit-crypto-trade-quality/quality.json').read_text())
          assert quality['qualification'] == 'BYBIT_CRYPTO_TRADE_QUALITY_REPORTED'
          assert quality['diagnostic_only'] is True
          assert quality['strategy_selection_allowed'] is False
          assert quality['threshold_retuning_allowed'] is False
          assert quality['strategy_promotion_allowed'] is False
          assert quality['demo_activation_allowed'] is False
          assert quality['live_activation_allowed'] is False
          assert 'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X' in quality['strategy_shadow_candidates']
          PY

      - name: Upload trade-quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-trade-quality-${{ github.run_id }}
          path: artifacts/bybit-crypto-trade-quality
          if-no-files-found: warn
          retention-days: 30
