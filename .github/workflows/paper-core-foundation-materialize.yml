name: paper-core-foundation-materialize

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths: [.github/workflows/paper-core-foundation-materialize.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply deterministic P0 source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roundtrip = Path('app/runtime/paper_broker_roundtrip_v99.py')
          text = roundtrip.read_text(encoding='utf-8')
          anchor = 'from app.runtime.platform_common_v90 import canonical_json, require_aware, sha256_digest\n'
          addition = '''from app.runtime.paper_execution_guard import (\n    PaperExecutionGuardError,\n    PaperExecutionLimits,\n    validate_paper_order_plan,\n)\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('roundtrip import anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          old = '''        if self.plan.quantity > self.policy.maximum_quantity:\n            reasons.append("QUANTITY_LIMIT_EXCEEDED")\n        if self.plan.quantity * self.plan.limit_price > self.policy.maximum_notional:\n            reasons.append("NOTIONAL_LIMIT_EXCEEDED")\n'''
          new = '''        try:\n            validate_paper_order_plan(\n                quantity=self.plan.quantity,\n                initial_limit_price=self.plan.limit_price,\n                replacement_limit_price=self.plan.replacement_limit_price,\n                limits=PaperExecutionLimits(\n                    maximum_quantity=self.policy.maximum_quantity,\n                    maximum_notional=self.policy.maximum_notional,\n                ),\n            )\n        except PaperExecutionGuardError as exc:\n            reasons.append(str(exc))\n'''
          if old not in text and new not in text:
              raise SystemExit('roundtrip preflight anchor missing')
          text = text.replace(old, new, 1)
          roundtrip.write_text(text, encoding='utf-8')

          adapter = Path('app/runtime/alpaca_paper_adapter_v100.py')
          text = adapter.read_text(encoding='utf-8')
          if 'from urllib.parse import quote\n' not in text:
              text = text.replace('import time\n', 'import time\nfrom urllib.parse import quote\n', 1)
          text = text.replace(
              '    timeout_seconds: float = 10.0\n',
              '    timeout_seconds: float = 10.0\n    maximum_response_bytes: int = 1_048_576\n',
              1,
          )
          text = text.replace(
              '        if self.timeout_seconds <= 0:\n            raise ValueError("timeout_seconds must be positive")\n',
              '        if self.timeout_seconds <= 0:\n            raise ValueError("timeout_seconds must be positive")\n        if self.maximum_response_bytes < 1:\n            raise ValueError("maximum_response_bytes must be positive")\n',
              1,
          )
          text = text.replace(
              '"GET", f"/v2/orders:by_client_order_id?client_order_id={client_order_id}"',
              '"GET", f"/v2/orders:by_client_order_id?client_order_id={quote(client_order_id, safe=\'\')}"',
          )
          text = text.replace('f"/v2/orders/{broker_order_id}"', 'f"/v2/orders/{quote(broker_order_id, safe=\'\')}"')
          old_read = '''    def _read(self, method: str, path: str) -> object:\n        if not self._read_limiter.try_acquire():\n            raise AlpacaPaperRateLimitExceeded("local paper read rate limit exceeded")\n        delay = self.policy.initial_backoff_seconds\n        for attempt in range(1, self.policy.maximum_read_attempts + 1):\n            try:\n                return self._request(method, path, None)\n'''
          new_read = '''    def _read(self, method: str, path: str) -> object:\n        delay = self.policy.initial_backoff_seconds\n        for attempt in range(1, self.policy.maximum_read_attempts + 1):\n            if not self._read_limiter.try_acquire():\n                raise AlpacaPaperRateLimitExceeded("local paper read rate limit exceeded")\n            try:\n                return self._request(method, path, None)\n'''
          if old_read not in text and new_read not in text:
              raise SystemExit('adapter read limiter anchor missing')
          text = text.replace(old_read, new_read, 1)
          response_anchor = '''        if response.status == 204 and allow_empty:\n            return {}\n'''
          response_new = '''        if len(response.body) > self.policy.maximum_response_bytes:\n            raise AlpacaPaperProtocolError("broker response exceeds configured size limit")\n        if response.status == 204 and allow_empty:\n            return {}\n'''
          if response_new not in text:
              if response_anchor not in text:
                  raise SystemExit('adapter response anchor missing')
              text = text.replace(response_anchor, response_new, 1)
          adapter.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check '.[test,marketdata]'
      - name: Run focused safety tests
        run: |
          pytest -q tests/test_paper_execution_guard.py tests/test_paper_roundtrip_safety_regression.py tests/test_roundtrip_v99.py tests/test_alpaca_paper_adapter_v100.py
          python -m compileall -q app tests
      - name: Commit qualified source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/runtime/paper_broker_roundtrip_v99.py app/runtime/alpaca_paper_adapter_v100.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Harden paper execution safety boundary'
            git push origin HEAD:agent/schema108-paper-core-foundation
          fi
