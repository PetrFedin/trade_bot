name: schema101-external-sandbox-qualification

on:
  push:
    branches: [agent/schema101-external-sandbox-qualification]
  pull_request:
    paths:
      - 'app/runtime/*v101.py'
      - 'app/platform_assets/v101/**'
      - 'migrations/v101/**'
      - 'tools/*v101.py'
      - 'tests/*v101.py'
      - 'pyproject.toml'
      - 'requirements.lock'
      - '.github/workflows/schema101-external-sandbox-qualification.yml'

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked qualification dependency graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - run: python -m pytest -q tests/test_sandbox_qualification_v101.py tests/test_alpaca_external_probe_v101.py tests/test_sandbox_chaos_v101.py tests/test_tools_v101.py
      - run: coverage run --branch -m pytest -q tests/test_sandbox_qualification_v101.py tests/test_alpaca_external_probe_v101.py tests/test_sandbox_chaos_v101.py tests/test_tools_v101.py
      - run: coverage report --include='app/runtime/*v101.py' --fail-under=80
      - run: python -m tools.architecture_audit_v101 .
      - run: python -m tools.static_audit_v101 .
      - run: python -m tools.stress_v101 --iterations 1000 --workers 8
