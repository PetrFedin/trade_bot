name: bybit-demo-activation-readiness

on:
  pull_request:
    paths:
      - 'app/execution/bybit_demo_activation_readiness.py'
      - 'app/execution/bybit_demo_same_account.py'
      - 'app/execution/bybit_demo_postgres_bootstrap.py'
      - 'app/execution/bybit_demo_postgres_session_risk_store.py'
      - 'migrations/v122/**'
      - 'migrations/v123/**'
      - 'tools/assemble_bybit_demo_activation_readiness.py'
      - 'tools/probe_bybit_demo_same_account.py'
      - 'tests/test_bybit_demo_activation_readiness.py'
      - 'tests/test_bybit_demo_same_account.py'
      - 'tests/test_bybit_demo_postgres_session_risk_store.py'
      - 'docs/BYBIT_DEMO_ACTIVATION_READINESS.md'
      - 'docs/BYBIT_DEMO_POSTGRES_SESSION_RISK.md'
      - '.github/workflows/bybit-demo-activation-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_activation_readiness.py'
      - 'app/execution/bybit_demo_same_account.py'
      - 'app/execution/bybit_demo_postgres_bootstrap.py'
      - 'app/execution/bybit_demo_postgres_session_risk_store.py'
      - 'migrations/v122/**'
      - 'migrations/v123/**'
      - 'tools/assemble_bybit_demo_activation_readiness.py'
      - 'tools/probe_bybit_demo_same_account.py'
      - 'tests/test_bybit_demo_activation_readiness.py'
      - 'tests/test_bybit_demo_same_account.py'
      - 'tests/test_bybit_demo_postgres_session_risk_store.py'
      - 'docs/BYBIT_DEMO_ACTIVATION_READINESS.md'
      - 'docs/BYBIT_DEMO_POSTGRES_SESSION_RISK.md'
      - '.github/workflows/bybit-demo-activation-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-demo-activation-readiness-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: Activation readiness and same-account tests
        run: |
          pytest -q \
            tests/test_bybit_demo_activation_readiness.py \
            tests/test_bybit_demo_same_account.py
      - name: Ruff activation readiness
        run: |
          ruff check \
            app/execution/bybit_demo_activation_readiness.py \
            app/execution/bybit_demo_same_account.py \
            tools/assemble_bybit_demo_activation_readiness.py \
            tools/probe_bybit_demo_same_account.py \
            tests/test_bybit_demo_activation_readiness.py \
            tests/test_bybit_demo_same_account.py
      - name: Bandit activation readiness
        run: |
          bandit -q \
            app/execution/bybit_demo_activation_readiness.py \
            app/execution/bybit_demo_same_account.py \
            tools/assemble_bybit_demo_activation_readiness.py \
            tools/probe_bybit_demo_same_account.py
      - name: Compile activation readiness
        run: |
          python -m compileall -q \
            app/execution/bybit_demo_activation_readiness.py \
            app/execution/bybit_demo_same_account.py \
            tools/assemble_bybit_demo_activation_readiness.py \
            tools/probe_bybit_demo_same_account.py

  operational-readiness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, bybit-demo]
    environment: bybit-demo
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install operational read-only dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[postgresql]'
          python -m pip check
          mkdir -p artifacts

      - name: Verify PostgreSQL v119-v123 without DDL
        continue-on-error: true
        env:
          BYBIT_DEMO_DATABASE_DSN: ${{ secrets.BYBIT_DEMO_DATABASE_DSN }}
        run: |
          python -m tools.bootstrap_bybit_demo_postgres \
            --mode verify \
            --output artifacts/bybit-demo-postgres-bootstrap.json

      - name: Run fixed-egress connected read-only preflight
        continue-on-error: true
        env:
          BYBIT_DEMO_DATABASE_DSN: ${{ secrets.BYBIT_DEMO_DATABASE_DSN }}
          BYBIT_DEMO_READONLY_API_KEY: ${{ secrets.BYBIT_DEMO_READONLY_API_KEY }}
          BYBIT_DEMO_READONLY_API_SECRET: ${{ secrets.BYBIT_DEMO_READONLY_API_SECRET }}
        run: |
          python -m tools.probe_bybit_demo_connected_preflight \
            --output artifacts/bybit-demo-connected-preflight.json

      - name: Verify dedicated Demo trading credential through GET only
        continue-on-error: true
        env:
          BYBIT_DEMO_TRADING_API_KEY: ${{ secrets.BYBIT_DEMO_TRADING_API_KEY }}
          BYBIT_DEMO_TRADING_API_SECRET: ${{ secrets.BYBIT_DEMO_TRADING_API_SECRET }}
          BYBIT_DEMO_READONLY_API_KEY_SHA256: ${{ vars.BYBIT_DEMO_READONLY_API_KEY_SHA256 }}
          BYBIT_MAINNET_READONLY_API_KEY_SHA256: ${{ vars.BYBIT_MAINNET_READONLY_API_KEY_SHA256 }}
        run: |
          python -m tools.probe_bybit_demo_trading_credential_preflight \
            --output artifacts/bybit-demo-trading-credential-preflight.json

      - name: Prove Demo read-only and trading keys belong to one account
        continue-on-error: true
        env:
          BYBIT_DEMO_READONLY_API_KEY: ${{ secrets.BYBIT_DEMO_READONLY_API_KEY }}
          BYBIT_DEMO_READONLY_API_SECRET: ${{ secrets.BYBIT_DEMO_READONLY_API_SECRET }}
          BYBIT_DEMO_TRADING_API_KEY: ${{ secrets.BYBIT_DEMO_TRADING_API_KEY }}
          BYBIT_DEMO_TRADING_API_SECRET: ${{ secrets.BYBIT_DEMO_TRADING_API_SECRET }}
        run: |
          python -m tools.probe_bybit_demo_same_account \
            --git-sha "$GITHUB_SHA" \
            --output artifacts/bybit-demo-same-account-preflight.json

      - name: Read v121 control status without ARM or HALT mutation
        continue-on-error: true
        env:
          BYBIT_DEMO_DATABASE_DSN: ${{ secrets.BYBIT_DEMO_DATABASE_DSN }}
        run: |
          python -m tools.control_bybit_demo_entries \
            --mode status \
            --output artifacts/bybit-demo-control-status.json

      - name: Assemble fail-closed activation readiness manifest
        run: |
          python -m tools.assemble_bybit_demo_activation_readiness \
            --git-sha "$GITHUB_SHA" \
            --postgres artifacts/bybit-demo-postgres-bootstrap.json \
            --connected-preflight artifacts/bybit-demo-connected-preflight.json \
            --trading-credential artifacts/bybit-demo-trading-credential-preflight.json \
            --same-account artifacts/bybit-demo-same-account-preflight.json \
            --control-status artifacts/bybit-demo-control-status.json \
            --output artifacts/bybit-demo-activation-readiness.json

      - name: Bind readiness to protected operational DB and Demo account
        env:
          BYBIT_DEMO_ZONE_BINDING_SECRET: ${{ secrets.BYBIT_DEMO_ZONE_BINDING_SECRET }}
          BYBIT_DEMO_DATABASE_DSN: ${{ secrets.BYBIT_DEMO_DATABASE_DSN }}
          BYBIT_DEMO_READONLY_API_KEY: ${{ secrets.BYBIT_DEMO_READONLY_API_KEY }}
          BYBIT_DEMO_READONLY_API_SECRET: ${{ secrets.BYBIT_DEMO_READONLY_API_SECRET }}
        run: |
          python -m tools.probe_bybit_demo_operational_zone_binding \
            --producer activation_readiness \
            --git-sha "$GITHUB_SHA" \
            --include-demo-account \
            --output artifacts/bybit-demo-operational-zone-binding.json

      - name: Upload sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-demo-activation-readiness-${{ github.run_id }}
          path: |
            artifacts/bybit-demo-postgres-bootstrap.json
            artifacts/bybit-demo-connected-preflight.json
            artifacts/bybit-demo-trading-credential-preflight.json
            artifacts/bybit-demo-same-account-preflight.json
            artifacts/bybit-demo-control-status.json
            artifacts/bybit-demo-activation-readiness.json
            artifacts/bybit-demo-operational-zone-binding.json
          if-no-files-found: error
          retention-days: 30
