name: trading-core-e2e

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
  pull_request:
    paths:
      - 'app/domain/**'
      - 'app/strategy/**'
      - 'app/risk/**'
      - 'app/portfolio/**'
      - 'app/application/**'
      - 'tests/test_trading_core_e2e.py'
      - '.github/workflows/trading-core-e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Deterministic trading vertical slice
        run: pytest -q tests/test_trading_core_e2e.py
      - name: Full regression
        run: pytest -q
      - name: Compile stable core
        run: python -m compileall -q app/domain app/strategy app/risk app/portfolio app/application
