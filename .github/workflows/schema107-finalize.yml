name: schema107-finalize

on:
  push:
    branches:
      - agent/schema107-materialize-20260805
    paths:
      - ".github/workflows/schema107-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: b8172ce79b5623a12a4f6ed2a7278f4acb7b9219
      TARGET_BRANCH: agent/schema107-production-rollout-actuator
      STAGING_BRANCH: agent/schema107-materialize-20260805
    steps:
      - name: Checkout qualified staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/schema107-materialize-20260805
          fetch-depth: 0

      - name: Assert clean materialized product tree
        shell: bash
        run: |
          test ! -e _schema107_payload
          test ! -e .github/workflows/schema107-materialize.yml
          test ! -e .github/workflows/schema107-materialize-fix.yml
          test -f .github/workflows/schema107-production-rollout-actuator.yml
          test -f RELEASE_IDENTITY_V107.json
          test -f app/runtime/rollout_service_v107.py
          grep -F "coverage run --branch --include='app/runtime/*_v107.py'" .github/workflows/schema107-production-rollout-actuator.yml
          grep -F 'Schema 107' README.md
          python - <<'PY'
          import json
          identity=json.load(open('RELEASE_IDENTITY_V107.json',encoding='utf-8'))
          assert identity['schema']==107
          assert identity['version']=='7.37.0'
          assert len(identity['files'])==32
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"

      - name: Requalify exact staging tree
        shell: bash
        run: |
          pytest -q tests/*v107.py
          pytest -q
          coverage erase
          coverage run --branch --include='app/runtime/*_v107.py' -m pytest -q tests/*v107.py
          coverage json -o coverage-finalize-v107.json
          python - <<'PY'
          import json
          totals=json.load(open('coverage-finalize-v107.json',encoding='utf-8'))['totals']
          exact=totals['percent_covered']
          print(f"exact V107 branch-aware coverage: {exact:.6f}%")
          if exact < 93.0:
              raise SystemExit(f"coverage {exact:.6f}% is below 93.0%")
          PY
          python tools/architecture_audit_v107.py .
          python tools/static_audit_v107.py .
          python -m compileall -q app tools tests
          python tools/platform_v106.py --root . verify-release
          python tools/platform_v107.py --root . verify-release
          python -m tools.stress_v107 --iterations 1000 --workers 8
          cmp migrations/v107/001_production_rollout_actuator.sql app/platform_assets/v107/migrations/001_production_rollout_actuator.sql

      - name: Build clean squash commit and publish target
        shell: bash
        run: |
          rm -f .github/workflows/schema107-finalize.yml
          rm -rf .pytest_cache build dist .wheel-venv htmlcov
          rm -f .coverage coverage-finalize-v107.json coverage.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove Schema 107 finalizer"
          git push origin HEAD:"${STAGING_BRANCH}"

          TARGET_SHA="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "${TARGET_SHA}" != "${BASE_SHA}" ]; then
            echo "target branch moved: expected ${BASE_SHA}, got ${TARGET_SHA}" >&2
            exit 1
          fi
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          FINAL_SHA="$(printf '%s\n' 'Add Schema 107 production rollout actuator' | git commit-tree "${TREE_SHA}" -p "${BASE_SHA}")"
          git show --stat --oneline "${FINAL_SHA}"
          git push origin "${FINAL_SHA}:refs/heads/${TARGET_BRANCH}"
