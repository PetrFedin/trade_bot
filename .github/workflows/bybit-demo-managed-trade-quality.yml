name: bybit-demo-managed-trade-quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_entry_provenance.py'
      - 'app/execution/bybit_demo_entry_provenance_store.py'
      - 'app/execution/bybit_demo_trade_attribution.py'
      - 'app/execution/bybit_demo_attributed_runtime.py'
      - 'app/execution/bybit_demo_managed_trade_poll.py'
      - 'app/execution/bybit_demo_terminal_evidence_store.py'
      - 'app/execution/bybit_demo_terminal_handoff.py'
      - 'app/execution/bybit_demo_runtime_lease.py'
      - 'app/execution/bybit_demo_trading_runtime.py'
      - 'app/execution/bybit_demo_excursion_runtime.py'
      - 'app/execution/bybit_demo_excursion_store.py'
      - 'app/execution/bybit_demo_trade_management_runtime.py'
      - 'app/execution/bybit_demo_max_hold_close.py'
      - 'app/execution/bybit_demo_post_trade_accounting.py'
      - 'app/execution/bybit_demo_profit_preservation_evidence.py'
      - 'tests/test_bybit_demo_entry_provenance.py'
      - 'tests/test_bybit_demo_entry_provenance_store.py'
      - 'tests/test_bybit_demo_trade_attribution.py'
      - 'tests/test_bybit_demo_attributed_runtime.py'
      - 'tests/test_bybit_demo_managed_trade_poll.py'
      - 'tests/test_bybit_demo_terminal_evidence_store.py'
      - 'tests/test_bybit_demo_terminal_handoff.py'
      - 'tests/test_bybit_demo_runtime_lease.py'
      - 'tests/test_bybit_demo_trading_runtime.py'
      - 'tests/test_bybit_demo_trading_runtime_provenance.py'
      - '.github/workflows/bybit-demo-managed-trade-quality.yml'
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/execution/bybit_demo_entry_provenance.py'
      - 'app/execution/bybit_demo_entry_provenance_store.py'
      - 'app/execution/bybit_demo_trade_attribution.py'
      - 'app/execution/bybit_demo_attributed_runtime.py'
      - 'app/execution/bybit_demo_managed_trade_poll.py'
      - 'app/execution/bybit_demo_terminal_evidence_store.py'
      - 'app/execution/bybit_demo_terminal_handoff.py'
      - 'app/execution/bybit_demo_runtime_lease.py'
      - 'app/execution/bybit_demo_trading_runtime.py'
      - 'app/execution/bybit_demo_excursion_runtime.py'
      - 'app/execution/bybit_demo_excursion_store.py'
      - 'app/execution/bybit_demo_trade_management_runtime.py'
      - 'app/execution/bybit_demo_max_hold_close.py'
      - 'app/execution/bybit_demo_post_trade_accounting.py'
      - 'app/execution/bybit_demo_profit_preservation_evidence.py'
      - 'tests/test_bybit_demo_entry_provenance.py'
      - 'tests/test_bybit_demo_entry_provenance_store.py'
      - 'tests/test_bybit_demo_trade_attribution.py'
      - 'tests/test_bybit_demo_attributed_runtime.py'
      - 'tests/test_bybit_demo_managed_trade_poll.py'
      - 'tests/test_bybit_demo_terminal_evidence_store.py'
      - 'tests/test_bybit_demo_terminal_handoff.py'
      - 'tests/test_bybit_demo_runtime_lease.py'
      - 'tests/test_bybit_demo_trading_runtime.py'
      - 'tests/test_bybit_demo_trading_runtime_provenance.py'
      - '.github/workflows/bybit-demo-managed-trade-quality.yml'

permissions:
  contents: read

concurrency:
  group: bybit-demo-managed-trade-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  managed-trade-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint managed trade lifecycle
        run: >-
          ruff check --output-format=github
          app/execution/bybit_demo_entry_provenance.py
          app/execution/bybit_demo_entry_provenance_store.py
          app/execution/bybit_demo_trade_attribution.py
          app/execution/bybit_demo_attributed_runtime.py
          app/execution/bybit_demo_managed_trade_poll.py
          app/execution/bybit_demo_terminal_evidence_store.py
          app/execution/bybit_demo_terminal_handoff.py
          app/execution/bybit_demo_runtime_lease.py
          app/execution/bybit_demo_trading_runtime.py
          tests/test_bybit_demo_entry_provenance.py
          tests/test_bybit_demo_entry_provenance_store.py
          tests/test_bybit_demo_trade_attribution.py
          tests/test_bybit_demo_attributed_runtime.py
          tests/test_bybit_demo_managed_trade_poll.py
          tests/test_bybit_demo_terminal_evidence_store.py
          tests/test_bybit_demo_terminal_handoff.py
          tests/test_bybit_demo_runtime_lease.py
          tests/test_bybit_demo_trading_runtime.py
          tests/test_bybit_demo_trading_runtime_provenance.py

      - name: Test managed trade lifecycle
        run: >-
          pytest -vv
          tests/test_bybit_demo_entry_provenance.py
          tests/test_bybit_demo_entry_provenance_store.py
          tests/test_bybit_demo_trade_attribution.py
          tests/test_bybit_demo_attributed_runtime.py
          tests/test_bybit_demo_managed_trade_poll.py
          tests/test_bybit_demo_terminal_evidence_store.py
          tests/test_bybit_demo_terminal_handoff.py
          tests/test_bybit_demo_runtime_lease.py
          tests/test_bybit_demo_trading_runtime.py
          tests/test_bybit_demo_trading_runtime_provenance.py
          tests/test_bybit_demo_trade_management_runtime.py
          tests/test_bybit_demo_max_hold_close.py
          tests/test_bybit_demo_excursion_runtime.py
          tests/test_bybit_demo_post_trade_accounting.py
          tests/test_bybit_demo_profit_preservation_evidence.py

      - name: Compile managed trade lifecycle
        run: >-
          python -m compileall -q
          app/execution/bybit_demo_entry_provenance.py
          app/execution/bybit_demo_entry_provenance_store.py
          app/execution/bybit_demo_trade_attribution.py
          app/execution/bybit_demo_attributed_runtime.py
          app/execution/bybit_demo_managed_trade_poll.py
          app/execution/bybit_demo_terminal_evidence_store.py
          app/execution/bybit_demo_terminal_handoff.py
          app/execution/bybit_demo_runtime_lease.py
          app/execution/bybit_demo_trading_runtime.py
