name: bybit-crypto-strategy-quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo.py'
      - 'app/execution/bybit_demo_controller.py'
      - 'app/execution/bybit_demo_cycle.py'
      - 'app/marketdata/bybit_instruments.py'
      - 'app/strategy/crypto_perp.py'
      - 'app/strategy/crypto_trade_management.py'
      - 'app/strategy/crypto_evidence.py'
      - 'app/strategy/crypto_session_risk.py'
      - 'app/strategy/crypto_replay_quality.py'
      - 'app/strategy/crypto_protection_quality.py'
      - 'app/strategy/crypto_entry_economics.py'
      - 'app/strategy/crypto_target_selection.py'
      - 'app/strategy/crypto_profit_runner.py'
      - 'tools/replay_bybit_crypto_runner.py'
      - 'tools/replay_bybit_crypto_archive.py'
      - 'tests/test_bybit_crypto_core.py'
      - 'tests/test_bybit_crypto_replay.py'
      - 'tests/test_bybit_crypto_runner_replay.py'
      - 'tests/test_bybit_demo_protection.py'
      - 'tests/test_bybit_demo_controller.py'
      - 'tests/test_bybit_demo_cycle.py'
      - 'tests/test_bybit_instruments.py'
      - 'tests/test_crypto_evidence.py'
      - 'tests/test_crypto_session_risk.py'
      - 'tests/test_crypto_replay_quality.py'
      - 'tests/test_crypto_protection_quality.py'
      - 'tests/test_crypto_entry_economics.py'
      - 'tests/test_crypto_target_selection.py'
      - 'tests/test_crypto_profit_runner.py'
      - 'tests/test_evaluate_bybit_crypto_replay.py'
      - '.github/workflows/bybit-crypto-strategy-quality.yml'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-strategy-quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked quality graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint crypto strategy and demo cycle
        run: >-
          ruff check --output-format=github
          app/execution/bybit_demo.py
          app/execution/bybit_demo_controller.py
          app/execution/bybit_demo_cycle.py
          app/marketdata/bybit_instruments.py
          app/strategy/crypto_perp.py
          app/strategy/crypto_trade_management.py
          app/strategy/crypto_evidence.py
          app/strategy/crypto_session_risk.py
          app/strategy/crypto_replay_quality.py
          app/strategy/crypto_protection_quality.py
          app/strategy/crypto_entry_economics.py
          app/strategy/crypto_target_selection.py
          app/strategy/crypto_profit_runner.py
          tools/replay_bybit_crypto_runner.py
          tools/replay_bybit_crypto_archive.py
          tests/test_bybit_crypto_core.py
          tests/test_bybit_crypto_replay.py
          tests/test_bybit_crypto_runner_replay.py
          tests/test_bybit_demo_protection.py
          tests/test_bybit_demo_controller.py
          tests/test_bybit_demo_cycle.py
          tests/test_bybit_instruments.py
          tests/test_crypto_evidence.py
          tests/test_crypto_session_risk.py
          tests/test_crypto_replay_quality.py
          tests/test_crypto_protection_quality.py
          tests/test_crypto_entry_economics.py
          tests/test_crypto_target_selection.py
          tests/test_crypto_profit_runner.py
          tests/test_evaluate_bybit_crypto_replay.py

      - name: Run crypto strategy invariants
        shell: bash
        run: |
          set -o pipefail
          pytest -vv \
            tests/test_bybit_crypto_core.py \
            tests/test_bybit_crypto_replay.py \
            tests/test_bybit_crypto_runner_replay.py \
            tests/test_bybit_demo_protection.py \
            tests/test_bybit_demo_controller.py \
            tests/test_bybit_demo_cycle.py \
            tests/test_bybit_instruments.py \
            tests/test_crypto_evidence.py \
            tests/test_crypto_session_risk.py \
            tests/test_crypto_replay_quality.py \
            tests/test_crypto_protection_quality.py \
            tests/test_crypto_entry_economics.py \
            tests/test_crypto_target_selection.py \
            tests/test_crypto_profit_runner.py \
            tests/test_evaluate_bybit_crypto_replay.py \
            2>&1 | tee bybit-crypto-strategy-pytest.txt

      - name: Compile crypto strategy boundary
        run: >-
          python -m compileall -q
          app/execution/bybit_demo.py
          app/execution/bybit_demo_controller.py
          app/execution/bybit_demo_cycle.py
          app/marketdata/bybit_instruments.py
          app/strategy/crypto_perp.py
          app/strategy/crypto_trade_management.py
          app/strategy/crypto_evidence.py
          app/strategy/crypto_session_risk.py
          app/strategy/crypto_replay_quality.py
          app/strategy/crypto_protection_quality.py
          app/strategy/crypto_entry_economics.py
          app/strategy/crypto_target_selection.py
          app/strategy/crypto_profit_runner.py
          tools/replay_bybit_crypto_runner.py
          tools/replay_bybit_crypto_archive.py

      - name: Upload strategy diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-strategy-quality-${{ github.run_id }}
          path: bybit-crypto-strategy-pytest.txt
          if-no-files-found: warn
          retention-days: 30
