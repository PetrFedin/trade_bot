name: historical-trade-attribution

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/historical_trade_attribution.py'
      - 'tests/test_historical_trade_attribution.py'
      - '.github/workflows/historical-trade-attribution.yml'

permissions:
  contents: read

jobs:
  trade-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Lint and test diagnostic invariants
        run: |
          ruff check tools/historical_trade_attribution.py tests/test_historical_trade_attribution.py
          pytest -q tests/test_historical_trade_attribution.py
      - name: Run six-major trade attribution
        run: |
          mkdir -p trade-attribution
          python -m tools.historical_trade_attribution \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --symbols BNBUSDT BTCUSDT DOGEUSDT ETHUSDT SOLUSDT XRPUSDT \
            --fee-bps-per-fill 8 --slippage-bps 5 \
            --output trade-attribution/six-major.json
      - name: Run broad-21 trade attribution
        run: |
          python -m tools.historical_trade_attribution \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --symbols ADAUSDT APTUSDT ARBUSDT ATOMUSDT AVAXUSDT BNBUSDT BTCUSDT DOGEUSDT DOTUSDT ETHUSDT FILUSDT INJUSDT LINKUSDT LTCUSDT NEARUSDT OPUSDT SOLUSDT SUIUSDT TONUSDT TRXUSDT XRPUSDT \
            --fee-bps-per-fill 8 --slippage-bps 5 \
            --output trade-attribution/broad21.json
      - name: Fail closed on inconsistent results
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          for path in sorted(Path('trade-attribution').glob('*.json')):
              data = json.loads(path.read_text())
              total = data['closed_trade_attribution']['total']
              assert data['research_only'] is True
              assert data['strategy_promotion_allowed'] is False
              assert data['funding_modelled'] is False
              discrepancy = abs(
                  Decimal(total['gross_pnl'])
                  - Decimal(total['fees'])
                  - Decimal(total['slippage_cost'])
                  - Decimal(total['net_pnl_before_funding'])
              )
              assert discrepancy <= Decimal('0.00000001') * max(1, total['trades'])
              assert total['trades'] == data['portfolio']['closed_trade_count']
              print(path.name, total, data['portfolio'])
          PY
      - name: Publish inspection artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trade-attribution-${{ github.run_id }}
          path: trade-attribution/*.json
          if-no-files-found: error
          retention-days: 30
