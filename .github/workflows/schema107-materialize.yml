name: schema107-materialize

on:
  push:
    branches:
      - agent/schema107-materialize-20260805
    paths:
      - ".github/workflows/schema107-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/schema107-materialize-20260805
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify and materialize payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import tarfile

          root = Path.cwd().resolve()
          payload_root = root / "_schema107_payload"
          chunk_hashes = {
              "chunk-000.txt": "3d6f1d4cdf4d3d7caa2905735f20edb61fa2bec7fc7a2fcb548df690dda5a1d2",
              "chunk-001.txt": "26a9371b3088eb6ae89868866baeb6eea364479926354c54fec82ee949198ab3",
              "chunk-002.txt": "03df649bfc2d5ced3d7c35f8b6df6d2c02e2e351ca1c70857c4e181da6300345",
              "chunk-003.txt": "48fe173cda1efe658d922f18e554c772f250fa26493b9571dc1477f517a26c2e",
              "chunk-004.txt": "0dfa4d382814d5b8f04775097be3a311dad3509cc2dd8ee4954ab0a3b60610c4",
              "chunk-005.txt": "352932f3b2b36c3f487a3863b614cc655a17cb48c17410858f1369e50d56ae0b",
              "chunk-006a.txt": "51282e347f9748697568235c0e012c433d15fbefeb6f643c1b01cca0a885a345",
              "chunk-006b.txt": "10370e1f199b313359254f4c04d8fb26b5de3acf5ec0564aed75124c3ab68462",
              "chunk-006c.txt": "ea081bf0396836ac1790d36f0037b772d43315ef49971b223dc6980508c4e2dd",
              "chunk-006d.txt": "024313b78f0d73b4359dcaec34a32add9e9c17330740e896c90ec0118db803a6",
              "chunk-007.txt": "1c6792c4a4f09befe16ccdb6f34a25d23181402dee616300beae5575eef691a3",
          }
          expected_base64_sha256 = "e7ee47feb60eb8447047a140d708326ee029d44f0b2240477aa8766df16f7b8b"
          expected_tar_sha256 = "71435aee826e2c4f71571291f2f35514f0538698d5d012c1192de7bc21ff893e"
          expected_members = {
              ".github/workflows/schema107-production-rollout-actuator.yml",
              "ENGINEERING_REPORT_V107.md",
              "INTEGRATION_V107.md",
              "LIVE_EXECUTION_STATUS_V107.json",
              "OPERATOR_RUNBOOK_V107.md",
              "QUALIFICATION_SUMMARY_V107.md",
              "README.md",
              "RELEASE_IDENTITY_V106.json",
              "RELEASE_IDENTITY_V107.json",
              "RELEASE_NOTES_V107.md",
              "app/platform_assets/v107/__init__.py",
              "app/platform_assets/v107/migrations/001_production_rollout_actuator.sql",
              "app/runtime/kubernetes_rollout_adapter_v107.py",
              "app/runtime/postgres_rollout_repository_v107.py",
              "app/runtime/qualification_bridge_v107.py",
              "app/runtime/rollout_execution_v107.py",
              "app/runtime/rollout_service_v107.py",
              "migrations/v107/001_production_rollout_actuator.sql",
              "pyproject.toml",
              "tests/__init__.py",
              "tests/conftest.py",
              "tests/test_kubernetes_rollout_adapter_v107.py",
              "tests/test_postgres_rollout_repository_v107.py",
              "tests/test_qualification_bridge_v107.py",
              "tests/test_rollout_execution_v107.py",
              "tests/test_rollout_service_v107.py",
              "tests/test_tools_v107.py",
              "tests/test_validation_edges_v107.py",
              "tools/architecture_audit_v107.py",
              "tools/platform_v106.py",
              "tools/platform_v107.py",
              "tools/static_audit_v107.py",
              "tools/stress_v107.py",
          }

          encoded_parts: list[str] = []
          actual_chunk_names = {path.name for path in payload_root.glob("chunk-*.txt")}
          if actual_chunk_names != set(chunk_hashes):
              raise SystemExit(
                  f"payload chunk set mismatch: expected={sorted(chunk_hashes)} actual={sorted(actual_chunk_names)}"
              )
          for name, expected in chunk_hashes.items():
              path = payload_root / name
              data = path.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"chunk digest mismatch for {name}: {actual}")
              encoded_parts.append(data.decode("ascii"))

          encoded = "".join(encoded_parts)
          encoded_digest = hashlib.sha256(encoded.encode("ascii")).hexdigest()
          if encoded_digest != expected_base64_sha256:
              raise SystemExit(f"combined base64 digest mismatch: {encoded_digest}")
          archive = base64.b64decode(encoded, validate=True)
          archive_digest = hashlib.sha256(archive).hexdigest()
          if archive_digest != expected_tar_sha256:
              raise SystemExit(f"archive digest mismatch: {archive_digest}")

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate archive member")
              if set(names) != expected_members:
                  raise SystemExit(
                      f"archive member mismatch: missing={sorted(expected_members - set(names))} "
                      f"unexpected={sorted(set(names) - expected_members)}"
                  )
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or str(path) != member.name:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"unsupported archive member type: {member.name}")
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"archive member cannot be read: {member.name}")
                  destination = (root / Path(*path.parts)).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f"archive path escaped repository: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())

          identity_path = root / "RELEASE_IDENTITY_V107.json"
          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          if identity.get("schema") != 107 or identity.get("version") != "7.37.0":
              raise SystemExit("release identity metadata mismatch")
          identity_files = identity.get("files")
          if not isinstance(identity_files, dict) or len(identity_files) != 32:
              raise SystemExit("release identity file set mismatch")
          for relative, expected in sorted(identity_files.items()):
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f"release identity missing file: {relative}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"release identity digest mismatch: {relative}: {actual}")

          canonical = root / "migrations/v107/001_production_rollout_actuator.sql"
          packaged = root / "app/platform_assets/v107/migrations/001_production_rollout_actuator.sql"
          if canonical.read_bytes() != packaged.read_bytes():
              raise SystemExit("canonical and packaged migrations differ")

          print(
              json.dumps(
                  {
                      "status": "PASS",
                      "parts": len(chunk_hashes),
                      "base64_sha256": encoded_digest,
                      "tar_sha256": archive_digest,
                      "members": len(expected_members),
                      "identity_files": len(identity_files),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"

      - name: Qualify materialized source
        shell: bash
        run: |
          pytest -q tests/*v107.py
          pytest -q
          coverage erase
          coverage run --branch --source=app/runtime -m pytest -q tests/*v107.py
          coverage json -o coverage-materialize-v107.json
          python - <<'PY'
          import json
          total = json.load(open("coverage-materialize-v107.json", encoding="utf-8"))["totals"]["percent_covered"]
          print(f"exact branch-aware coverage: {total:.6f}%")
          if total < 93.0:
              raise SystemExit(f"coverage {total:.6f}% is below 93.0%")
          PY
          python tools/architecture_audit_v107.py .
          python tools/static_audit_v107.py .
          python -m compileall -q app tools tests
          python tools/platform_v106.py --root . verify-release
          python tools/platform_v107.py --root . verify-release
          python -m tools.stress_v107 --iterations 1000 --workers 8
          cmp migrations/v107/001_production_rollout_actuator.sql app/platform_assets/v107/migrations/001_production_rollout_actuator.sql

      - name: Commit materialized source
        shell: bash
        run: |
          rm -rf _schema107_payload
          rm -f .github/workflows/schema107-materialize.yml
          rm -rf .pytest_cache build dist .wheel-venv htmlcov
          rm -f .coverage coverage-materialize-v107.json coverage.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Materialize Schema 107 rollout actuator"
          git push origin HEAD:agent/schema107-materialize-20260805
