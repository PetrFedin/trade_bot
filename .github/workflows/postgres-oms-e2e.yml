name: postgres-oms-e2e

on:
  push:
    branches:
      - agent/schema108-paper-core-foundation
      - agent/trading-quality-profit-protection
    paths:
      - 'app/oms/**'
      - 'app/application/order_lifecycle.py'
      - 'app/application/bybit_operator_control.py'
      - 'app/execution/bybit_postgres_runtime_state.py'
      - 'app/execution/bybit_postgres_evidence_state.py'
      - 'app/execution/bybit_startup_reconciliation.py'
      - 'migrations/product/**'
      - 'tests/test_postgres_oms_e2e.py'
      - 'tests/test_postgres_bybit_entry_recovery_e2e.py'
      - 'tests/test_postgres_bybit_operator_control_e2e.py'
      - 'tests/test_bybit_postgres_runtime_state.py'
      - 'tests/test_bybit_postgres_evidence_state.py'
      - 'pyproject.toml'
      - '.github/workflows/postgres-oms-e2e.yml'
  pull_request:
    paths:
      - 'app/oms/**'
      - 'app/application/order_lifecycle.py'
      - 'app/application/bybit_operator_control.py'
      - 'app/execution/bybit_postgres_runtime_state.py'
      - 'app/execution/bybit_postgres_evidence_state.py'
      - 'app/execution/bybit_startup_reconciliation.py'
      - 'migrations/product/**'
      - 'tests/test_postgres_oms_e2e.py'
      - 'tests/test_postgres_bybit_entry_recovery_e2e.py'
      - 'tests/test_postgres_bybit_operator_control_e2e.py'
      - 'tests/test_bybit_postgres_runtime_state.py'
      - 'tests/test_bybit_postgres_evidence_state.py'
      - 'pyproject.toml'
      - '.github/workflows/postgres-oms-e2e.yml'

permissions:
  contents: read

concurrency:
  group: postgres-oms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRA_TEST_POSTGRES_DSN: postgresql://astra:astra@127.0.0.1:5432/astra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[test,postgresql]'
          python -m pip check
      - name: PostgreSQL durable OMS E2E
        run: pytest -q tests/test_postgres_oms_e2e.py
      - name: PostgreSQL Bybit entry recovery E2E
        run: pytest -q tests/test_postgres_bybit_entry_recovery_e2e.py
      - name: PostgreSQL Bybit operator control E2E
        run: pytest -q tests/test_postgres_bybit_operator_control_e2e.py
      - name: PostgreSQL Bybit runtime state and fencing E2E
        run: pytest -q tests/test_bybit_postgres_runtime_state.py
      - name: PostgreSQL Bybit evidence and session-risk E2E
        run: pytest -q tests/test_bybit_postgres_evidence_state.py
      - name: SQLite OMS parity regression
        run: pytest -q tests/test_durable_oms_e2e.py
      - name: Compile OMS and Bybit PostgreSQL boundaries
        run: >-
          python -m compileall -q
          app/oms
          app/application
          app/execution/bybit_postgres_runtime_state.py
          app/execution/bybit_postgres_evidence_state.py
          app/execution/bybit_startup_reconciliation.py
