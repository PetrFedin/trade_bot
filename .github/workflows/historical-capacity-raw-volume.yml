name: historical-capacity-raw-volume

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/historical_capacity_raw_volume.py'
      - 'tools/historical_trade_attribution.py'
      - 'tests/test_historical_capacity_raw_volume.py'
      - 'research/snapshots/bybit_3y_2023-10-09_2026-10-08/**'
      - 'docs/ASTRA_INTEGRATION_MASTER_PLAN_2026-10-01.md'
      - '.github/workflows/historical-capacity-raw-volume.yml'

permissions:
  contents: read

concurrency:
  group: historical-capacity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  six-major-source-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Static checks and real-source unit/integration tests
        run: |
          ruff check tools/historical_capacity_raw_volume.py tests/test_historical_capacity_raw_volume.py
          python -m compileall -q tools/historical_capacity_raw_volume.py
          pytest -q tests/test_historical_capacity_raw_volume.py

      - name: Run six-major capacity proxy
        run: |
          mkdir -p capacity-evidence
          python -m tools.historical_capacity_raw_volume \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --symbols BNBUSDT BTCUSDT DOGEUSDT ETHUSDT SOLUSDT XRPUSDT \
            --output capacity-evidence/six-major-raw-volume.json

      - name: Verify capacity is never promoted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("capacity-evidence/six-major-raw-volume.json").read_text())
          assert p["research_only"] is True
          assert p["strategy_promotion_allowed"] is False
          assert p["live_trading_allowed"] is False
          assert p["actual_execution_capacity_proven"] is False
          assert p["historical_market_impact_modelled"] is False
          assert p["raw_volume_integrity"]["decimal_base_volume_used_not_legacy_truncated_int"] is True
          assert p["base_replay"]["closed_trades"] == 256
          assert len(p["source_sha256"]) == 6
          PY

      - name: Upload six-major capacity research evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: capacity-raw-six-${{ github.run_id }}
          path: capacity-evidence/six-major-raw-volume.json
          if-no-files-found: error
          retention-days: 30

  broad-21-capacity-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Run broad-21 capacity proxy on unchanged shipped policy
        run: |
          mkdir -p capacity-evidence
          python -m tools.historical_capacity_raw_volume \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --symbols ADAUSDT APTUSDT ARBUSDT ATOMUSDT AVAXUSDT BNBUSDT BTCUSDT DOGEUSDT DOTUSDT ETHUSDT FILUSDT INJUSDT LINKUSDT LTCUSDT NEARUSDT OPUSDT SOLUSDT SUIUSDT TONUSDT TRXUSDT XRPUSDT \
            --output capacity-evidence/broad-21-raw-volume.json

      - name: Verify broad adverse-case retention
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("capacity-evidence/broad-21-raw-volume.json").read_text())
          assert p["research_only"] is True
          assert p["strategy_promotion_allowed"] is False
          assert p["actual_execution_capacity_proven"] is False
          assert p["base_replay"]["closed_trades"] == 276
          assert len(p["source_sha256"]) == 21
          assert len(p["hypothetical_capital_scenarios"]) == 4
          assert p["raw_volume_integrity"]["fractional_raw_volume_rows"] > 0
          PY

      - name: Upload broad-21 capacity research evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: capacity-raw-broad-${{ github.run_id }}
          path: capacity-evidence/broad-21-raw-volume.json
          if-no-files-found: error
          retention-days: 30
