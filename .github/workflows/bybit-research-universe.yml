name: bybit-research-universe

on:
  push:
    branches: [main]
    paths:
      - 'app/marketdata/bybit_research_universe.py'
      - 'app/strategy/crypto_historical_diagnostics.py'
      - 'app/strategy/crypto_market_history_profile.py'
      - 'tools/research_bybit_dynamic_top10.py'
      - 'tests/test_bybit_research_universe.py'
      - 'tests/test_crypto_historical_diagnostics.py'
      - 'tests/test_crypto_market_history_profile.py'
      - 'tests/test_research_bybit_dynamic_top10.py'
      - 'docs/BYBIT_DYNAMIC_RESEARCH_UNIVERSE.md'
      - '.github/workflows/bybit-research-universe.yml'
  pull_request:
    paths:
      - 'app/marketdata/bybit_research_universe.py'
      - 'app/strategy/crypto_historical_diagnostics.py'
      - 'app/strategy/crypto_market_history_profile.py'
      - 'tools/research_bybit_dynamic_top10.py'
      - 'tests/test_bybit_research_universe.py'
      - 'tests/test_crypto_historical_diagnostics.py'
      - 'tests/test_crypto_market_history_profile.py'
      - 'tests/test_research_bybit_dynamic_top10.py'
      - 'docs/BYBIT_DYNAMIC_RESEARCH_UNIVERSE.md'
      - '.github/workflows/bybit-research-universe.yml'

permissions:
  contents: read

concurrency:
  group: bybit-research-universe-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: Dynamic universe and historical diagnostics tests
        run: |
          pytest -q \
            tests/test_bybit_research_universe.py \
            tests/test_crypto_historical_diagnostics.py \
            tests/test_crypto_market_history_profile.py
      - name: Ruff research boundary
        run: |
          ruff check \
            app/marketdata/bybit_research_universe.py \
            app/strategy/crypto_historical_diagnostics.py \
            app/strategy/crypto_market_history_profile.py \
            tests/test_bybit_research_universe.py \
            tests/test_crypto_historical_diagnostics.py \
            tests/test_crypto_market_history_profile.py
      - name: Bandit research boundary
        run: |
          bandit -q \
            app/marketdata/bybit_research_universe.py \
            app/strategy/crypto_historical_diagnostics.py \
            app/strategy/crypto_market_history_profile.py
      - name: Compile research boundary
        run: |
          python -m compileall -q \
            app/marketdata/bybit_research_universe.py \
            app/strategy/crypto_historical_diagnostics.py \
            app/strategy/crypto_market_history_profile.py
