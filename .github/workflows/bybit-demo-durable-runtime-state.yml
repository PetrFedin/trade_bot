name: bybit-demo-durable-runtime-state

on:
  pull_request:
    paths:
      - 'app/execution/bybit_demo_postgres_runtime_lease.py'
      - 'app/execution/bybit_demo_postgres_excursion_store.py'
      - 'migrations/v119/001_bybit_demo_durable_runtime.sql'
      - 'tests/test_bybit_demo_postgres_runtime_state.py'
      - 'docs/BYBIT_DEMO_DURABLE_RUNTIME_STATE.md'
      - '.github/workflows/bybit-demo-durable-runtime-state.yml'
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_postgres_runtime_lease.py'
      - 'app/execution/bybit_demo_postgres_excursion_store.py'
      - 'migrations/v119/001_bybit_demo_durable_runtime.sql'
      - 'tests/test_bybit_demo_postgres_runtime_state.py'
      - 'docs/BYBIT_DEMO_DURABLE_RUNTIME_STATE.md'
      - '.github/workflows/bybit-demo-durable-runtime-state.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-demo-durable-runtime-state-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra_demo_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_demo_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRA_DEMO_RUNTIME_TEST_DSN: postgresql://astra:astra@localhost:5432/astra_demo_runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev,postgresql]'
          python -m pip check
      - name: Durable runtime state PostgreSQL regression tests
        run: |
          pytest -q \
            tests/test_bybit_demo_postgres_runtime_state.py \
            tests/test_bybit_demo_runtime_lease.py \
            tests/test_bybit_demo_excursion_store.py \
            tests/test_bybit_demo_trading_runtime.py \
            tests/test_bybit_demo_approved_runtime.py
      - name: Ruff durable runtime state
        run: |
          ruff check \
            app/execution/bybit_demo_postgres_runtime_lease.py \
            app/execution/bybit_demo_postgres_excursion_store.py \
            tests/test_bybit_demo_postgres_runtime_state.py
      - name: Bandit durable runtime state
        run: |
          bandit -q \
            app/execution/bybit_demo_postgres_runtime_lease.py \
            app/execution/bybit_demo_postgres_excursion_store.py
      - name: Compile durable runtime state
        run: |
          python -m compileall -q \
            app/execution/bybit_demo_postgres_runtime_lease.py \
            app/execution/bybit_demo_postgres_excursion_store.py
