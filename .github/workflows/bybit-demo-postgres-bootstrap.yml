name: bybit-demo-postgres-bootstrap

on:
  pull_request:
    paths:
      - 'app/execution/bybit_demo_postgres_bootstrap.py'
      - 'tools/bootstrap_bybit_demo_postgres.py'
      - 'tests/test_bybit_demo_postgres_bootstrap.py'
      - 'docs/BYBIT_DEMO_POSTGRES_BOOTSTRAP.md'
      - '.github/workflows/bybit-demo-postgres-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_postgres_bootstrap.py'
      - 'tools/bootstrap_bybit_demo_postgres.py'
      - 'tests/test_bybit_demo_postgres_bootstrap.py'
      - 'docs/BYBIT_DEMO_POSTGRES_BOOTSTRAP.md'
      - '.github/workflows/bybit-demo-postgres-bootstrap.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify performs no DDL; apply runs exactly v119 then v120'
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply
      confirmation:
        description: 'Required for apply: APPLY_BYBIT_DEMO_V119_V120'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bybit-demo-postgres-bootstrap-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra_demo_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_demo_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRA_DEMO_BOOTSTRAP_TEST_DSN: postgresql://astra:astra@localhost:5432/astra_demo_bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev,postgresql]'
          python -m pip check
      - name: Demo PostgreSQL bootstrap lifecycle on isolated PostgreSQL 16
        run: |
          pytest -q tests/test_bybit_demo_postgres_bootstrap.py
      - name: Ruff Demo PostgreSQL bootstrap
        run: |
          ruff check \
            app/execution/bybit_demo_postgres_bootstrap.py \
            tools/bootstrap_bybit_demo_postgres.py \
            tests/test_bybit_demo_postgres_bootstrap.py
      - name: Bandit Demo PostgreSQL bootstrap
        run: |
          bandit -q \
            app/execution/bybit_demo_postgres_bootstrap.py \
            tools/bootstrap_bybit_demo_postgres.py
      - name: Compile Demo PostgreSQL bootstrap
        run: |
          python -m compileall -q \
            app/execution/bybit_demo_postgres_bootstrap.py \
            tools/bootstrap_bybit_demo_postgres.py

  operational:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BYBIT_DEMO_DATABASE_DSN: ${{ secrets.BYBIT_DEMO_DATABASE_DSN }}
      BOOTSTRAP_MODE: ${{ inputs.mode }}
      BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PostgreSQL bootstrap dependency
        run: |
          python -m pip install --disable-pip-version-check '.[postgresql]'
          python -m pip check
      - name: Verify or explicitly bootstrap v119/v120
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python -m tools.bootstrap_bybit_demo_postgres \
            --mode "$BOOTSTRAP_MODE" \
            --confirmation "$BOOTSTRAP_CONFIRMATION" \
            --output artifacts/bybit-demo-postgres-bootstrap.json
          BOOTSTRAP_STATUS=$?
          set -e
          cat artifacts/bybit-demo-postgres-bootstrap.json
          exit "$BOOTSTRAP_STATUS"
      - name: Upload sanitized bootstrap artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-demo-postgres-bootstrap-${{ github.run_id }}
          path: artifacts/bybit-demo-postgres-bootstrap.json
          if-no-files-found: warn
          retention-days: 7
