name: bybit-crypto-strategy-v2-policy

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'research/bybit_crypto_strategy_v2_policy.json'
      - 'tools/validate_bybit_crypto_strategy_v2_policy.py'
      - 'tests/test_validate_bybit_crypto_strategy_v2_policy.py'
      - 'app/strategy/crypto_correlation.py'
      - 'app/strategy/crypto_execution_risk.py'
      - 'app/strategy/crypto_perp.py'
      - 'app/strategy/crypto_profit_runner.py'
      - 'app/strategy/crypto_runner_admission.py'
      - 'app/strategy/crypto_session_risk.py'
      - 'tools/qualify_bybit_crypto_walk_forward.py'
      - '.github/workflows/bybit-crypto-strategy-v2-policy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/bybit_crypto_strategy_v2_policy.json'
      - 'tools/validate_bybit_crypto_strategy_v2_policy.py'
      - 'tests/test_validate_bybit_crypto_strategy_v2_policy.py'
      - 'app/strategy/crypto_correlation.py'
      - 'app/strategy/crypto_execution_risk.py'
      - 'app/strategy/crypto_perp.py'
      - 'app/strategy/crypto_profit_runner.py'
      - 'app/strategy/crypto_runner_admission.py'
      - 'app/strategy/crypto_session_risk.py'
      - 'tools/qualify_bybit_crypto_walk_forward.py'
      - '.github/workflows/bybit-crypto-strategy-v2-policy.yml'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-strategy-v2-policy-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint policy validator
        run: >-
          ruff check --output-format=github
          tools/validate_bybit_crypto_strategy_v2_policy.py
          tests/test_validate_bybit_crypto_strategy_v2_policy.py

      - name: Validate committed policy against code defaults
        run: |
          pytest -vv tests/test_validate_bybit_crypto_strategy_v2_policy.py
          PYTHONPATH=. python tools/validate_bybit_crypto_strategy_v2_policy.py

      - name: Compile policy boundary
        run: python -m compileall -q tools/validate_bybit_crypto_strategy_v2_policy.py
