name: research-signed-signal-contract

on:
  push:
    branches: [research/signed-signal-capability-gates-20261020]
    paths:
      - 'tools/research_signal_gate.py'
      - 'tools/research_capability_register.py'
      - 'tests/test_research_signal_gate.py'
      - 'tests/test_research_capability_register.py'
      - 'research/competitive_capability_register_v1.json'
      - 'docs/ASTRA_COMPETITIVE_SIGNAL_TRUST_2026-10-22.md'
      - '.github/workflows/research-signed-signal-contract.yml'
  pull_request:
    branches: [fix/atomic-mark-evidence-publication-20261019]
    paths:
      - 'tools/research_signal_gate.py'
      - 'tools/research_capability_register.py'
      - 'tests/test_research_signal_gate.py'
      - 'tests/test_research_capability_register.py'
      - 'research/competitive_capability_register_v1.json'
      - 'docs/ASTRA_COMPETITIVE_SIGNAL_TRUST_2026-10-22.md'
      - '.github/workflows/research-signed-signal-contract.yml'

permissions:
  contents: read

concurrency:
  group: research-signal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-contract-and-capability-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Verify static, negative and concurrency contracts
        run: |
          set -euo pipefail
          ruff check tools/research_signal_gate.py tools/research_capability_register.py tests/test_research_signal_gate.py tests/test_research_capability_register.py
          pytest -q tests/test_research_signal_gate.py tests/test_research_capability_register.py
          python -m tools.research_capability_register --check
      - name: Prove research gate cannot import exchange or trading authority
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          names = []
          for path in ("tools/research_signal_gate.py", "tools/research_capability_register.py"):
              for node in ast.walk(ast.parse(Path(path).read_text())):
                  if isinstance(node, ast.Import):
                      names.extend(item.name for item in node.names)
                  if isinstance(node, ast.ImportFrom) and node.module:
                      names.append(node.module)
          forbidden = ("app.oms", "app.execution", "app.risk", "app.strategy")
          assert not any(name.startswith(forbidden) for name in names)
          print("RESEARCH_ONLY_NO_BROKER_IMPORTS")
          PY
