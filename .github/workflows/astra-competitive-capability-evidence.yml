name: astra-competitive-capability-evidence

on:
  push:
    branches: [research/competitive-capability-ledger-20261020]
  pull_request:
    branches: [fix/atomic-mark-evidence-publication-20261019]
    paths:
      - 'research/competitive_capabilities_2026-10-20.json'
      - 'tools/verify_competitive_capabilities.py'
      - 'tools/inspect_signal_lookahead.py'
      - 'tests/test_verify_competitive_capabilities.py'
      - 'tests/test_inspect_signal_lookahead.py'
      - 'tests/test_competitive_capability_dashboard.py'
      - 'docs/astra_capability_matrix_2026-10-20.html'
      - 'docs/ASTRA_COMPETITIVE_PRODUCT_ROADMAP_2026-10-20.md'
      - '.github/workflows/astra-competitive-capability-evidence.yml'

permissions:
  contents: read

concurrency:
  group: astra-capabilities-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-attribution-and-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install audited dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Validate feature source attribution, inventory and trading authority
        run: |
          ruff check tools/verify_competitive_capabilities.py tests/test_verify_competitive_capabilities.py tools/inspect_signal_lookahead.py tests/test_inspect_signal_lookahead.py tests/test_competitive_capability_dashboard.py
          pytest -q tests/test_verify_competitive_capabilities.py tests/test_inspect_signal_lookahead.py tests/test_competitive_capability_dashboard.py
          python -m tools.verify_competitive_capabilities --root .
