name: schema109-payload-diagnostic

on:
  push:
    branches:
      - agent/schema109-materialize-20260806
    paths:
      - _schema109_payload/**
      - tools/schema109_payload_forensics.py
      - .github/workflows/schema109-payload-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema109-payload-diagnostic
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Compile forensic tool
        run: python -m compileall -q tools/schema109_payload_forensics.py

      - name: Inspect, recover and safely extract payload
        id: payload
        run: |
          python -m tools.schema109_payload_forensics \
            --payload-dir _schema109_payload \
            --report schema109-payload-report.json \
            --extract-root . \
            --salvage-root schema109-salvage

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema109-payload-forensics
          path: |
            schema109-payload-report.json
            schema109-salvage/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Install project dependencies
        if: steps.payload.outputs.recovered == 'true'
        run: python -m pip install --disable-pip-version-check ".[test,postgresql]"

      - name: Compile extracted overlay
        if: steps.payload.outputs.recovered == 'true'
        run: python -m compileall -q app tools tests

      - name: Run focused Schema 109 tests
        if: steps.payload.outputs.recovered == 'true'
        run: pytest -q tests/*v109.py

      - name: Verify migration packaging
        if: steps.payload.outputs.recovered == 'true'
        run: cmp migrations/v109/001_remote_signer_attestation.sql app/platform_assets/v109/migrations/001_remote_signer_attestation.sql

      - name: Fail closed when payload is unrecoverable
        if: steps.payload.outputs.recovered != 'true'
        run: |
          echo "Schema 109 payload remains unrecoverable; see the persisted forensic evidence." >&2
          exit 1
