name: schema109-payload-diagnostic

on:
  push:
    branches:
      - agent/schema109-materialize-20260806
    paths:
      - _schema109_payload/**
      - .github/workflows/schema109-payload-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema109-payload-diagnostic
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Inspect, recover and safely extract payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import tarfile

          root = Path.cwd().resolve()
          payload_root = root / "_schema109_payload"
          parts = sorted(payload_root.glob("chunk-*.txt"))
          if not parts:
              raise SystemExit("no payload chunks")
          expected_names = [f"chunk-{index:03d}.txt" for index in range(len(parts))]
          actual_names = [path.name for path in parts]
          if actual_names != expected_names:
              raise SystemExit(f"non-contiguous payload chunks: {actual_names}")

          encoded_parts: list[str] = []
          chunk_sha256: dict[str, str] = {}
          chunk_lengths: dict[str, int] = {}
          for path in parts:
              data = path.read_bytes()
              try:
                  text = data.decode("ascii")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"non-ASCII payload chunk: {path.name}") from exc
              if any(character.isspace() for character in text):
                  raise SystemExit(f"whitespace in payload chunk: {path.name}")
              chunk_sha256[path.name] = hashlib.sha256(data).hexdigest()
              chunk_lengths[path.name] = len(text)
              encoded_parts.append(text)

          original_encoded = "".join(encoded_parts)
          original_encoded_sha256 = hashlib.sha256(original_encoded.encode("ascii")).hexdigest()

          def inspect_archive(encoded: str) -> tuple[bytes, list[dict[str, object]]]:
              archive = base64.b64decode(encoded, validate=True)
              # gzip.decompress validates stream integrity/CRC before the tar is trusted.
              tar_bytes = gzip.decompress(archive)
              members: list[dict[str, object]] = []
              names: set[str] = set()
              with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as handle:
                  for member in handle.getmembers():
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or ".." in path.parts or str(path) != member.name:
                          raise ValueError(f"unsafe archive path: {member.name}")
                      if member.name in names:
                          raise ValueError(f"duplicate archive member: {member.name}")
                      names.add(member.name)
                      if not member.isfile() or member.issym() or member.islnk():
                          raise ValueError(f"unsupported archive member type: {member.name}")
                      source = handle.extractfile(member)
                      if source is None:
                          raise ValueError(f"unreadable archive member: {member.name}")
                      body = source.read()
                      members.append({
                          "path": member.name,
                          "size": len(body),
                          "sha256": hashlib.sha256(body).hexdigest(),
                      })
              if not members:
                  raise ValueError("empty archive")
              return archive, members

          recovery: dict[str, object] = {"mode": "none"}
          selected_encoded = original_encoded
          try:
              archive, members = inspect_archive(selected_encoded)
          except Exception as original_exc:
              # The staged payload has a repair-tail shape: the final chunk repeats a
              # substantial suffix of the penultimate chunk but supplies a different
              # prefix. Never guess a splice. Enumerate every cut point and accept a
              # repair only if exactly one candidate passes strict base64, gzip CRC,
              # safe tar structure, and non-empty-member validation.
              if len(encoded_parts) < 2:
                  raise SystemExit("invalid combined payload and no repair tail") from original_exc
              penultimate = encoded_parts[-2]
              repair_tail = encoded_parts[-1]
              penultimate_body = penultimate.rstrip("=")
              terminal_padding = penultimate[len(penultimate_body):]

              overlap = 0
              for size in range(min(len(penultimate_body), len(repair_tail)), 0, -1):
                  if penultimate_body.endswith(repair_tail[-size:]):
                      overlap = size
                      break
              if overlap < 128:
                  raise SystemExit(
                      f"invalid combined payload; repair overlap too small: {overlap}"
                  ) from original_exc

              fixed_prefix = "".join(encoded_parts[:-2])
              tail_variants = [("repair-tail", repair_tail)]
              if terminal_padding and not repair_tail.endswith(terminal_padding):
                  tail_variants.append(("repair-tail-plus-original-padding", repair_tail + terminal_padding))

              valid: list[tuple[int, str, str, bytes, list[dict[str, object]]]] = []
              for cut in range(len(penultimate) + 1):
                  for variant_name, tail in tail_variants:
                      candidate = fixed_prefix + penultimate[:cut] + tail
                      if len(candidate) % 4:
                          continue
                      try:
                          candidate_archive, candidate_members = inspect_archive(candidate)
                      except Exception:
                          continue
                      valid.append((cut, variant_name, candidate, candidate_archive, candidate_members))

              if len(valid) != 1:
                  raise SystemExit(
                      "ambiguous or unrecoverable payload: "
                      f"valid_repair_candidates={len(valid)} overlap={overlap} "
                      f"chunk_lengths={chunk_lengths}"
                  ) from original_exc

              cut, variant_name, selected_encoded, archive, members = valid[0]
              recovery = {
                  "mode": "replace-penultimate-suffix-with-final-repair-tail",
                  "cut": cut,
                  "repair_variant": variant_name,
                  "repair_overlap": overlap,
                  "penultimate_length": len(penultimate),
                  "repair_tail_length": len(repair_tail),
                  "original_terminal_padding": terminal_padding,
                  "original_error": type(original_exc).__name__,
              }

          # Re-open only the uniquely selected validated archive and write regular
          # files beneath the checkout root. No links, directories or path escapes.
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as handle:
              for member in handle.getmembers():
                  path = PurePosixPath(member.name)
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"unreadable validated archive member: {member.name}")
                  destination = (root / Path(*path.parts)).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f"archive path escaped repository: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())

          encoded_sha256 = hashlib.sha256(selected_encoded.encode("ascii")).hexdigest()
          archive_sha256 = hashlib.sha256(archive).hexdigest()
          report = {
              "status": "PASS",
              "chunk_count": len(parts),
              "chunk_lengths": chunk_lengths,
              "chunk_sha256": chunk_sha256,
              "original_combined_base64_sha256": original_encoded_sha256,
              "selected_base64_sha256": encoded_sha256,
              "archive_sha256": archive_sha256,
              "archive_size": len(archive),
              "member_count": len(members),
              "members": members,
              "recovery": recovery,
          }
          Path("schema109-payload-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check ".[test,postgresql]"

      - name: Compile extracted overlay
        run: python -m compileall -q app tools tests

      - name: Run focused Schema 109 tests
        run: pytest -q tests/*v109.py

      - name: Verify migration packaging when present
        shell: bash
        run: |
          if [[ -f migrations/v109/001_remote_signer_attestation.sql ]]; then
            cmp migrations/v109/001_remote_signer_attestation.sql app/platform_assets/v109/migrations/001_remote_signer_attestation.sql
          fi

      - name: Upload diagnostic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema109-payload-report
          path: schema109-payload-report.json
          if-no-files-found: error
          retention-days: 3
