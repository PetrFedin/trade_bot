name: historical-strategy-evidence-lab

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/strategy/**'
      - 'tools/historical_portfolio_evidence.py'
      - 'tools/historical_strategy_matrix.py'
      - 'tools/fetch_bybit_klines.py'
      - 'tests/test_historical_strategy_matrix.py'
      - 'docs/HISTORICAL_STRATEGY_EVIDENCE_V1.md'
      - 'docs/STRATEGY_EVIDENCE_LEARNING_LOG.md'
      - 'docs/ASTRA_INTEGRATION_MASTER_PLAN_2026-10-01.md'
      - '.github/workflows/historical-strategy-evidence-lab.yml'

permissions:
  contents: read

concurrency:
  group: historical-strategy-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  six-major-three-year:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Unit-test historical matrix
        run: pytest -q tests/test_historical_strategy_matrix.py tests/test_historical_strategy_evidence_v1.py tests/test_historical_portfolio_evidence_tool.py

      - name: Fetch fixed three-year six-major snapshot
        run: |
          mkdir -p historical-data
          python - <<'PY'
          from datetime import UTC, datetime
          from pathlib import Path
          from tools.fetch_bybit_klines import Request, fetch, write_dataset

          symbols = ("BNBUSDT", "BTCUSDT", "DOGEUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT")
          start = datetime(2023, 10, 9, tzinfo=UTC)
          end = datetime(2026, 10, 9, tzinfo=UTC)
          out = Path("historical-data")
          for symbol in symbols:
              request = Request(symbol=symbol, interval="D", start=start, end=end)
              bars = fetch(request)
              if not bars:
                  raise SystemExit(f"empty snapshot for {symbol}")
              write_dataset(bars, request, out)
              print(symbol, len(bars), bars[0]["timestamp"], bars[-1]["timestamp"])
          PY

      - name: Run exact shipped strategy cost matrix
        run: |
          mkdir -p historical-evidence
          python -m tools.historical_strategy_matrix             --bars-dir historical-data             --symbols BNBUSDT BTCUSDT DOGEUSDT ETHUSDT SOLUSDT XRPUSDT             --opening-cash 10000             --output historical-evidence/six-major-three-year-cost-matrix.json

      - name: Print decision summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("historical-evidence/six-major-three-year-cost-matrix.json").read_text())
          for scenario_id, scenario in payload["scenarios"].items():
              s = scenario["summary"]
              print(
                  scenario_id,
                  "return=", s["total_return"],
                  "max_dd=", s["max_drawdown_fraction"],
                  "pf=", s["profit_factor"],
                  "alpha_matched=", s["alpha_vs_capital_matched_equal_weight"],
                  "alpha_btc=", s["alpha_vs_btc_buy_hold"],
                  "verdict=", s["verdict"],
              )
          PY

      - name: Verify research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("historical-evidence/six-major-three-year-cost-matrix.json").read_text())
          assert payload["research_only"] is True
          assert payload["strategy_promotion_allowed"] is False
          for scenario in payload["scenarios"].values():
              assert scenario["summary"]["verdict"] == "PROFITABILITY_NOT_PROVEN"
          PY

      - name: Upload immutable research evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-strategy-evidence-${{ github.run_id }}
          path: |
            historical-data/*.manifest.json
            historical-evidence/*.json
          if-no-files-found: error
          retention-days: 30
