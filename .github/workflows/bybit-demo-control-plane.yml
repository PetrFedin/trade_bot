name: bybit-demo-control-plane

on:
  pull_request:
    paths:
      - 'app/execution/bybit_demo_control_plane.py'
      - 'app/execution/bybit_demo_approved_runtime.py'
      - 'app/execution/bybit_demo_fixed_egress.py'
      - 'tools/control_bybit_demo_entries.py'
      - 'migrations/v121/**'
      - 'tests/test_bybit_demo_control_plane.py'
      - 'tests/test_bybit_demo_control_plane_postgres.py'
      - 'tests/test_bybit_demo_approved_runtime.py'
      - 'tests/test_bybit_demo_fixed_egress.py'
      - 'tests/test_bybit_demo_operational_artifact_git_binding.py'
      - 'docs/BYBIT_DEMO_CONTROL_PLANE.md'
      - 'docs/BYBIT_DEMO_OPERATIONAL_ZONE.md'
      - '.github/workflows/bybit-demo-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_control_plane.py'
      - 'app/execution/bybit_demo_approved_runtime.py'
      - 'app/execution/bybit_demo_fixed_egress.py'
      - 'tools/control_bybit_demo_entries.py'
      - 'migrations/v121/**'
      - 'tests/test_bybit_demo_control_plane.py'
      - 'tests/test_bybit_demo_control_plane_postgres.py'
      - 'tests/test_bybit_demo_approved_runtime.py'
      - 'tests/test_bybit_demo_fixed_egress.py'
      - 'tests/test_bybit_demo_operational_artifact_git_binding.py'
      - 'docs/BYBIT_DEMO_CONTROL_PLANE.md'
      - 'docs/BYBIT_DEMO_OPERATIONAL_ZONE.md'
      - '.github/workflows/bybit-demo-control-plane.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'status reads state; halt blocks new entries; arm requires fixed-egress connected preflight'
        required: true
        default: status
        type: choice
        options:
          - status
          - halt
          - arm
      confirmation:
        description: 'arm: ARM_BYBIT_DEMO_NEW_ENTRIES; halt: HALT_BYBIT_DEMO_NEW_ENTRIES'
        required: false
        default: ''
        type: string
      reason:
        description: 'Required operator reason for arm/halt'
        required: false
        default: ''
        type: string
      ttl_seconds:
        description: 'ARM lifetime in seconds, 1-300'
        required: false
        default: '120'
        type: string

permissions:
  contents: read

concurrency:
  group: bybit-demo-control-plane-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra_demo_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_demo_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRA_DEMO_CONTROL_TEST_DSN: postgresql://astra:astra@localhost:5432/astra_demo_control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev,postgresql]'
          python -m pip check
      - name: Control-plane unit and PostgreSQL lifecycle tests
        run: |
          pytest -q \
            tests/test_bybit_demo_control_plane.py \
            tests/test_bybit_demo_control_plane_postgres.py \
            tests/test_bybit_demo_approved_runtime.py \
            tests/test_bybit_demo_fixed_egress.py \
            tests/test_bybit_demo_operational_artifact_git_binding.py
      - name: Ruff Demo control plane
        run: |
          ruff check \
            app/execution/bybit_demo_control_plane.py \
            app/execution/bybit_demo_approved_runtime.py \
            app/execution/bybit_demo_fixed_egress.py \
            tools/control_bybit_demo_entries.py \
            tests/test_bybit_demo_control_plane.py \
            tests/test_bybit_demo_control_plane_postgres.py \
            tests/test_bybit_demo_approved_runtime.py \
            tests/test_bybit_demo_fixed_egress.py \
            tests/test_bybit_demo_operational_artifact_git_binding.py
      - name: Bandit Demo control plane
        run: |
          bandit -q \
            app/execution/bybit_demo_control_plane.py \
            app/execution/bybit_demo_approved_runtime.py \
            app/execution/bybit_demo_fixed_egress.py \
            tools/control_bybit_demo_entries.py
      - name: Compile Demo control plane
        run: |
          python -m compileall -q \
            app/execution/bybit_demo_control_plane.py \
            app/execution/bybit_demo_approved_runtime.py \
            app/execution/bybit_demo_fixed_egress.py \
            tools/control_bybit_demo_entries.py

  operational:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, bybit-demo]
    environment: bybit-demo
    timeout-minutes: 15
    env:
      BYBIT_DEMO_DATABASE_DSN: ${{ secrets.BYBIT_DEMO_DATABASE_DSN }}
      BYBIT_DEMO_READONLY_API_KEY: ${{ secrets.BYBIT_DEMO_READONLY_API_KEY }}
      BYBIT_DEMO_READONLY_API_SECRET: ${{ secrets.BYBIT_DEMO_READONLY_API_SECRET }}
      CONTROL_MODE: ${{ inputs.mode }}
      CONTROL_CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_REASON: ${{ inputs.reason }}
      CONTROL_TTL_SECONDS: ${{ inputs.ttl_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install read-only operational dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[postgresql]'
          python -m pip check
      - name: Require v119-v121 operational schema
        run: |
          mkdir -p artifacts
          python -m tools.bootstrap_bybit_demo_postgres \
            --mode verify \
            --output artifacts/bybit-demo-postgres-bootstrap.json
      - name: Read or explicitly change Demo new-entry control state
        shell: bash
        run: |
          set +e
          python -m tools.control_bybit_demo_entries \
            --mode "$CONTROL_MODE" \
            --confirmation "$CONTROL_CONFIRMATION" \
            --operator-id "$GITHUB_ACTOR" \
            --reason "$CONTROL_REASON" \
            --ttl-seconds "$CONTROL_TTL_SECONDS" \
            --git-sha "$GITHUB_SHA" \
            --output artifacts/bybit-demo-control-plane.json
          CONTROL_STATUS=$?
          set -e
          cat artifacts/bybit-demo-control-plane.json
          exit "$CONTROL_STATUS"
      - name: Bind ARM or HALT to protected operational DB and Demo account
        if: inputs.mode == 'arm' || inputs.mode == 'halt'
        env:
          BYBIT_DEMO_ZONE_BINDING_SECRET: ${{ secrets.BYBIT_DEMO_ZONE_BINDING_SECRET }}
        shell: bash
        run: |
          if [ "$CONTROL_MODE" = "arm" ]; then
            ZONE_PRODUCER="arm_control"
          else
            ZONE_PRODUCER="halt_control"
          fi
          python -m tools.probe_bybit_demo_operational_zone_binding \
            --producer "$ZONE_PRODUCER" \
            --git-sha "$GITHUB_SHA" \
            --include-demo-account \
            --output artifacts/bybit-demo-operational-zone-binding.json
      - name: Upload sanitized control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-demo-control-plane-${{ github.run_id }}
          path: |
            artifacts/bybit-demo-postgres-bootstrap.json
            artifacts/bybit-demo-control-plane.json
            artifacts/bybit-demo-operational-zone-binding.json
          if-no-files-found: error
          retention-days: 30
