name: bybit-crypto-runner-evidence-temp

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - '.github/workflows/bybit-crypto-runner-evidence-temp.yml'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-runner-evidence-temp-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked replay graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Replay seven completed Bybit UTC days
        run: |
          set -o pipefail
          mkdir -p artifacts/bybit-runner/trades
          PYTHONPATH=. python tools/replay_bybit_crypto_archive.py \
            --symbols 'BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT' \
            --lookback-days 7 \
            --opening-equity 1000 \
            --targets 15,20,25 \
            --output artifacts/bybit-runner/report-raw.json \
            --trades-dir artifacts/bybit-runner/trades

      - name: Normalize and score evidence
        run: |
          PYTHONPATH=. python tools/normalize_bybit_crypto_replay.py \
            --input artifacts/bybit-runner/report-raw.json \
            --output artifacts/bybit-runner/report.json
          PYTHONPATH=. python tools/evaluate_bybit_crypto_replay.py \
            --input artifacts/bybit-runner/report.json \
            --output artifacts/bybit-runner/evidence-scorecard.json

      - name: Assert fail-closed runner contract and print metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/bybit-runner/report.json').read_text())
          score = json.loads(Path('artifacts/bybit-runner/evidence-scorecard.json').read_text())
          runner = report['strategy_shadow_candidates']['MIN_20_NET_EDGE_OPEN_ENDED_RUNNER']
          runner_score = score['strategy_shadow_candidates']['MIN_20_NET_EDGE_OPEN_ENDED_RUNNER']
          assert runner['minimum_entry_net_profit_usd'] == 20.0
          assert runner['runner_activation_net_profit_usd'] == 20.0
          assert runner['runner_initial_protected_net_profit_usd'] == 15.0
          assert runner['profit_cap_net_profit_usd'] is None
          assert runner['fixed_take_profit_enabled'] is False
          assert runner['protected_15_is_guaranteed_realized_pnl'] is False
          assert runner['strategy_promotion_allowed'] is False
          assert runner['bybit_demo_order_writes_enabled'] is False
          assert runner['bybit_live_order_routing_allowed'] is False
          assert runner_score['strategy_promotion_allowed'] is False
          assert runner_score['demo_order_writes_allowed'] is False
          assert runner_score['live_promotion_allowed'] is False
          summary = {
              'archive_dates': report['archive_dates'],
              'symbols': report['symbols'],
              'baseline_fixed_20': report['variants']['TARGET_20_USD']['metrics'],
              'baseline_fixed_25': report['variants']['TARGET_25_USD']['metrics'],
              'open_ended_runner': {
                  'metrics': runner['metrics'],
                  'activation_events': runner['runner_activation_event_count'],
                  'accepted_trade_plan_event_count': runner['accepted_trade_plan_event_count'],
                  'protection_quality': runner['protection_quality'],
                  'evidence': runner_score,
              },
          }
          print('BYBIT_RUNNER_EVIDENCE=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload one-shot runner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-runner-evidence-${{ github.run_id }}
          path: artifacts/bybit-runner
          if-no-files-found: error
          retention-days: 30
