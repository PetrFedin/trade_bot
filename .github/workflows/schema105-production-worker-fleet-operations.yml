name: schema105-production-worker-fleet-operations

on:
  pull_request:
    branches:
      - agent/schema104-production-worker-execution-plane
    paths:
      - 'app/runtime/*v105.py'
      - 'app/platform_assets/v105/**'
      - 'migrations/v105/**'
      - 'tools/*v105.py'
      - 'tests/*v105.py'
      - 'pyproject.toml'
      - 'README.md'
      - '*V105*'
      - '.github/workflows/schema105-production-worker-fleet-operations.yml'

permissions:
  contents: read

concurrency:
  group: schema105-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'pytest>=8,<10' 'coverage>=7,<8'
      - run: python -m pytest -q tests/test_fleet_operations_v105.py tests/test_s3_evidence_adapter_v105.py tests/test_postgres_fleet_operations_v105.py tests/test_tools_v105.py
      - run: coverage run --branch -m pytest -q tests/test_fleet_operations_v105.py tests/test_s3_evidence_adapter_v105.py tests/test_postgres_fleet_operations_v105.py tests/test_tools_v105.py
      - run: coverage report --include='app/runtime/*v105.py' --fail-under=95
      - run: python -m tools.architecture_audit_v105 .
      - run: python -m tools.static_audit_v105 .
      - run: python -m compileall -q app tools tests
      - run: python -m tools.platform_v105 --root . verify-release
      - run: python -m tools.stress_v105 --iterations 1000 --workers 8
