name: external-alpaca-paper-readonly

on:
  workflow_dispatch:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths:
      - 'tools/external_paper_readonly.py'
      - '.github/workflows/external-alpaca-paper-readonly.yml'
      - 'pyproject.toml'
  schedule:
    - cron: '17 2 * * 1-5'

permissions:
  contents: read

concurrency:
  group: external-alpaca-paper-readonly
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: alpaca-paper
    env:
      ASTRA_ALPACA_PAPER_KEY_ID: ${{ secrets.ASTRA_ALPACA_PAPER_KEY_ID }}
      ASTRA_ALPACA_PAPER_SECRET_KEY: ${{ secrets.ASTRA_ALPACA_PAPER_SECRET_KEY }}
      ASTRA_EXTERNAL_PROBE_GENERATION: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Require explicit paper credentials
        shell: bash
        run: |
          test -n "$ASTRA_ALPACA_PAPER_KEY_ID"
          test -n "$ASTRA_ALPACA_PAPER_SECRET_KEY"
      - name: Install read-only external dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[test,marketdata]'
          python -m pip check
      - name: Run real Alpaca Paper REST and WebSocket probe
        run: python -m tools.external_paper_readonly | tee external-paper-readonly.json
      - name: Assert live routing stays disabled
        run: |
          python - <<'PY'
          import json
          data = json.loads(open('external-paper-readonly.json', encoding='utf-8').read())
          assert data['environment'] == 'paper'
          assert data['paper_order_writes_enabled'] is False
          assert data['external_order_routing_allowed'] is False
          assert data['live_trading_allowed'] is False
          assert data['stream_authenticated'] is True
          assert data['stream_listening'] is True
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: external-alpaca-paper-readonly-${{ github.run_id }}
          path: external-paper-readonly.json
          if-no-files-found: error
          retention-days: 14
