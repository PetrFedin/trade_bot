name: bybit-demo-post-trade-accounting-quality

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/execution/bybit_demo_account_reader.py'
      - 'app/execution/bybit_demo_account_pnl_reconciliation.py'
      - 'app/execution/bybit_demo_funding_reconciliation.py'
      - 'app/execution/bybit_demo_lifecycle_gate.py'
      - 'app/execution/bybit_demo_post_trade_accounting.py'
      - 'app/execution/bybit_demo_quality_tracker.py'
      - 'app/execution/bybit_demo_excursion_tracker.py'
      - 'app/execution/bybit_demo_profit_preservation_evidence.py'
      - 'app/execution/bybit_demo_trade_monitor.py'
      - 'tests/test_bybit_demo_account_reader.py'
      - 'tests/test_bybit_demo_account_pnl_reconciliation.py'
      - 'tests/test_bybit_demo_funding_reconciliation.py'
      - 'tests/test_bybit_demo_lifecycle_gate.py'
      - 'tests/test_bybit_demo_post_trade_accounting.py'
      - 'tests/test_bybit_demo_quality_tracker.py'
      - 'tests/test_bybit_demo_profit_preservation_tracker.py'
      - 'tests/test_bybit_demo_profit_preservation_evidence.py'
      - 'tests/test_bybit_demo_trade_monitor.py'
      - '.github/workflows/bybit-demo-post-trade-accounting-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_account_reader.py'
      - 'app/execution/bybit_demo_account_pnl_reconciliation.py'
      - 'app/execution/bybit_demo_funding_reconciliation.py'
      - 'app/execution/bybit_demo_lifecycle_gate.py'
      - 'app/execution/bybit_demo_post_trade_accounting.py'
      - 'app/execution/bybit_demo_quality_tracker.py'
      - 'app/execution/bybit_demo_excursion_tracker.py'
      - 'app/execution/bybit_demo_profit_preservation_evidence.py'
      - 'app/execution/bybit_demo_trade_monitor.py'
      - 'tests/test_bybit_demo_account_reader.py'
      - 'tests/test_bybit_demo_account_pnl_reconciliation.py'
      - 'tests/test_bybit_demo_funding_reconciliation.py'
      - 'tests/test_bybit_demo_lifecycle_gate.py'
      - 'tests/test_bybit_demo_post_trade_accounting.py'
      - 'tests/test_bybit_demo_quality_tracker.py'
      - 'tests/test_bybit_demo_profit_preservation_tracker.py'
      - 'tests/test_bybit_demo_profit_preservation_evidence.py'
      - 'tests/test_bybit_demo_trade_monitor.py'
      - '.github/workflows/bybit-demo-post-trade-accounting-quality.yml'

permissions:
  contents: read

concurrency:
  group: bybit-demo-post-trade-accounting-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  post-trade-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint post-trade accounting chain
        run: >-
          ruff check --output-format=github
          app/execution/bybit_demo_account_reader.py
          app/execution/bybit_demo_account_pnl_reconciliation.py
          app/execution/bybit_demo_funding_reconciliation.py
          app/execution/bybit_demo_lifecycle_gate.py
          app/execution/bybit_demo_post_trade_accounting.py
          app/execution/bybit_demo_quality_tracker.py
          app/execution/bybit_demo_excursion_tracker.py
          app/execution/bybit_demo_profit_preservation_evidence.py
          app/execution/bybit_demo_trade_monitor.py
          tests/test_bybit_demo_account_reader.py
          tests/test_bybit_demo_account_pnl_reconciliation.py
          tests/test_bybit_demo_funding_reconciliation.py
          tests/test_bybit_demo_lifecycle_gate.py
          tests/test_bybit_demo_post_trade_accounting.py
          tests/test_bybit_demo_quality_tracker.py
          tests/test_bybit_demo_profit_preservation_tracker.py
          tests/test_bybit_demo_profit_preservation_evidence.py
          tests/test_bybit_demo_trade_monitor.py

      - name: Test post-trade accounting chain
        run: >-
          pytest -vv
          tests/test_bybit_demo_account_reader.py
          tests/test_bybit_demo_trade_monitor.py
          tests/test_bybit_demo_account_pnl_reconciliation.py
          tests/test_bybit_demo_funding_reconciliation.py
          tests/test_bybit_demo_lifecycle_gate.py
          tests/test_bybit_demo_post_trade_accounting.py
          tests/test_bybit_demo_quality_tracker.py
          tests/test_bybit_demo_profit_preservation_tracker.py
          tests/test_bybit_demo_profit_preservation_evidence.py

      - name: Compile post-trade accounting boundary
        run: >-
          python -m compileall -q
          app/execution/bybit_demo_account_reader.py
          app/execution/bybit_demo_account_pnl_reconciliation.py
          app/execution/bybit_demo_funding_reconciliation.py
          app/execution/bybit_demo_lifecycle_gate.py
          app/execution/bybit_demo_post_trade_accounting.py
          app/execution/bybit_demo_quality_tracker.py
          app/execution/bybit_demo_excursion_tracker.py
          app/execution/bybit_demo_profit_preservation_evidence.py
          app/execution/bybit_demo_trade_monitor.py
