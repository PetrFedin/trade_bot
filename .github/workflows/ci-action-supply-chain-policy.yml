name: ci-action-supply-chain-policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/ci_action_policy.py'
      - 'tests/test_ci_action_policy.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/ci_action_policy.py'
      - 'tests/test_ci_action_policy.py'

permissions:
  contents: read

concurrency:
  group: ci-action-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'

      - name: Unit-test CI action policy
        run: python -m unittest discover -s tests -p 'test_ci_action_policy.py' -v

      - name: Audit operational workflow action policy
        run: python -m tools.ci_action_policy .
