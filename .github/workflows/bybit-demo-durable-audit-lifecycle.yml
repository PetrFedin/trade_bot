name: bybit-demo-durable-audit-lifecycle

on:
  pull_request:
    paths:
      - 'app/execution/bybit_demo_postgres_approval_lineage_store.py'
      - 'app/execution/bybit_demo_postgres_entry_provenance_store.py'
      - 'app/execution/bybit_demo_postgres_terminal_evidence_store.py'
      - 'migrations/v120/001_bybit_demo_durable_audit_lifecycle.sql'
      - 'tests/test_bybit_demo_postgres_audit_lifecycle.py'
      - 'docs/BYBIT_DEMO_DURABLE_AUDIT_LIFECYCLE.md'
      - '.github/workflows/bybit-demo-durable-audit-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_postgres_approval_lineage_store.py'
      - 'app/execution/bybit_demo_postgres_entry_provenance_store.py'
      - 'app/execution/bybit_demo_postgres_terminal_evidence_store.py'
      - 'migrations/v120/001_bybit_demo_durable_audit_lifecycle.sql'
      - 'tests/test_bybit_demo_postgres_audit_lifecycle.py'
      - 'docs/BYBIT_DEMO_DURABLE_AUDIT_LIFECYCLE.md'
      - '.github/workflows/bybit-demo-durable-audit-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-demo-durable-audit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra_demo_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_demo_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRA_DEMO_AUDIT_TEST_DSN: postgresql://astra:astra@localhost:5432/astra_demo_audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev,postgresql]'
          python -m pip check
      - name: Durable audit lifecycle PostgreSQL regression tests
        run: |
          pytest -q \
            tests/test_bybit_demo_postgres_audit_lifecycle.py \
            tests/test_bybit_demo_approval_lineage_store.py \
            tests/test_bybit_demo_entry_provenance_store.py \
            tests/test_bybit_demo_terminal_evidence_store.py \
            tests/test_bybit_demo_terminal_handoff.py \
            tests/test_bybit_demo_approved_runtime.py \
            tests/test_bybit_demo_trading_runtime.py
      - name: Ruff durable audit lifecycle
        run: |
          ruff check \
            app/execution/bybit_demo_postgres_approval_lineage_store.py \
            app/execution/bybit_demo_postgres_entry_provenance_store.py \
            app/execution/bybit_demo_postgres_terminal_evidence_store.py \
            tests/test_bybit_demo_postgres_audit_lifecycle.py
      - name: Bandit durable audit lifecycle
        run: |
          bandit -q \
            app/execution/bybit_demo_postgres_approval_lineage_store.py \
            app/execution/bybit_demo_postgres_entry_provenance_store.py \
            app/execution/bybit_demo_postgres_terminal_evidence_store.py
      - name: Compile durable audit lifecycle
        run: |
          python -m compileall -q \
            app/execution/bybit_demo_postgres_approval_lineage_store.py \
            app/execution/bybit_demo_postgres_entry_provenance_store.py \
            app/execution/bybit_demo_postgres_terminal_evidence_store.py
