name: schema108-materialize

on:
  push:
    branches:
      - agent/schema108-materialize-20260806
    paths:
      - .github/workflows/schema108-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra-ci
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/schema108-materialize-20260806
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify and extract qualified Schema 108 payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import tarfile

          root = Path.cwd().resolve()
          payload_root = root / "_schema108_payload"
          chunk_hashes = {
              "chunk-000.txt": "06bcbaeb3486d2ad5ec1ffe1d168ed03e8734a8356ce1262e73bec56f4459462",
              "chunk-001.txt": "fdd456f8466b31c8851abfc706eb22a514b688a00e9f723d0ce472fe15491d57",
              "chunk-002.txt": "6d3ce45148e419a517227a51dfd751828d424f96038c70ee7add62ff26ccdef2",
              "chunk-003.txt": "d32d950f39e369b719791cdcde7efae8e74c134aa6cf7f93f11def67e239081a",
              "chunk-004.txt": "eba102ed86f232f800486c706e9486b4b3e9509970baeb197d910e6c9d41039f",
              "chunk-005.txt": "c49384436244792f77c0cc4a0dee375b7786e894e8d4cebb2ee09127938f54c1",
              "chunk-006.txt": "751b4f39fefada13ab6766f80c48419f89fd73ae9d7de5ad67755ad8eaea128b",
              "chunk-007.txt": "f7eaa56e89963cbbf4617dc6a22c0888ab1b066a36b02a43f2ce3a8a31ac5996",
          }
          expected_base64_sha256 = "5d62fb8324de53beb6433bbc03510d98e7ca6db78e5511776857d254b9e843bf"
          expected_archive_sha256 = "f87775230d46ba0c4206e9eca0d979054ae214f58a4cd91e9509a422f54487a6"
          expected_members = {
              ".github/workflows/schema108-asymmetric-signing-authority.yml",
              "ENGINEERING_REPORT_V108.md",
              "INTEGRATION_V108.md",
              "LIVE_EXECUTION_STATUS_V108.json",
              "OPERATOR_RUNBOOK_V108.md",
              "QUALIFICATION_SUMMARY_V108.md",
              "RELEASE_IDENTITY_V107.json",
              "RELEASE_IDENTITY_V108.json",
              "RELEASE_NOTES_V108.md",
              "app/platform_assets/v108/__init__.py",
              "app/platform_assets/v108/migrations/001_asymmetric_signing_authority.sql",
              "app/runtime/postgres_signing_repository_v108.py",
              "app/runtime/rollout_crypto_bridge_v108.py",
              "app/runtime/signing_authority_v108.py",
              "migrations/v108/001_asymmetric_signing_authority.sql",
              "pyproject.toml",
              "tests/helpers_v108.py",
              "tests/test_migration_contract_v108.py",
              "tests/test_postgres_signing_repository_v108.py",
              "tests/test_rollout_crypto_bridge_v108.py",
              "tests/test_signing_authority_v108.py",
              "tests/test_tools_v108.py",
              "tools/architecture_audit_v108.py",
              "tools/platform_v108.py",
              "tools/static_audit_v108.py",
              "tools/stress_v108.py",
          }

          encoded_parts: list[bytes] = []
          for name, expected in chunk_hashes.items():
              path = payload_root / name
              if not path.is_file():
                  raise SystemExit(f"missing payload part: {name}")
              data = path.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"chunk digest mismatch for {name}: {actual}")
              encoded_parts.append(data)

          encoded = b"".join(encoded_parts)
          encoded_digest = hashlib.sha256(encoded).hexdigest()
          if encoded_digest != expected_base64_sha256:
              raise SystemExit(f"combined base64 digest mismatch: {encoded_digest}")
          archive = base64.b64decode(encoded, validate=True)
          archive_digest = hashlib.sha256(archive).hexdigest()
          if archive_digest != expected_archive_sha256:
              raise SystemExit(f"archive digest mismatch: {archive_digest}")

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate archive member")
              if set(names) != expected_members:
                  raise SystemExit(
                      f"archive member mismatch: missing={sorted(expected_members - set(names))} "
                      f"unexpected={sorted(set(names) - expected_members)}"
                  )
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or ".." in pure.parts or str(pure) != member.name:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"unsupported archive member type: {member.name}")
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"archive member cannot be read: {member.name}")
                  destination = (root / Path(*pure.parts)).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f"archive path escaped repository: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())

          identity = json.loads((root / "RELEASE_IDENTITY_V108.json").read_text(encoding="utf-8"))
          if identity.get("schema") != 108 or identity.get("version") != "7.38.0":
              raise SystemExit("Schema 108 release identity metadata mismatch")
          if len(identity.get("files", {})) != 25:
              raise SystemExit("Schema 108 release identity file-set mismatch")
          print(json.dumps({
              "status": "PASS",
              "parts": len(chunk_hashes),
              "base64_sha256": encoded_digest,
              "archive_sha256": archive_digest,
              "members": len(expected_members),
              "identity_files": len(identity["files"]),
          }, indent=2, sort_keys=True))
          PY

      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check ".[test,postgresql]"

      - name: Focused Schema 108 tests
        run: pytest -q tests/*v108.py

      - name: Complete stacked test suite
        run: pytest -q

      - name: Exact branch-aware Schema 108 coverage
        shell: bash
        run: |
          coverage erase
          coverage run --branch --include='app/runtime/*_v108.py' -m pytest -q tests/*v108.py
          coverage json -o coverage-v108.json
          python - <<'PY'
          import json
          report = json.load(open("coverage-v108.json", encoding="utf-8"))
          total = float(report["totals"]["percent_covered"])
          print(f"exact V108 branch-aware coverage: {total:.6f}%")
          if total < 98.0:
              raise SystemExit(f"coverage {total:.6f}% is below 98.0%")
          PY

      - name: Architecture, security, release and stress gates
        shell: bash
        run: |
          python tools/architecture_audit_v108.py .
          python tools/static_audit_v108.py .
          python -m compileall -q app tools tests
          python tools/platform_v107.py --root . verify-release
          python tools/platform_v108.py --root . verify-release
          python -m tools.stress_v108 --iterations 1000 --workers 8
          cmp migrations/v108/001_asymmetric_signing_authority.sql app/platform_assets/v108/migrations/001_asymmetric_signing_authority.sql
          if grep -R -n -E 'Ed25519PrivateKey|private_key_(bytes|b64)|hmac\.new' app/runtime/*_v108.py; then
            echo "forbidden private or symmetric signing material in V108 runtime" >&2
            exit 1
          fi

      - name: Apply migration twice to PostgreSQL 16
        shell: bash
        env:
          PGPASSWORD: astra-ci
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          for pass in 1 2; do
            psql --host=127.0.0.1 --port=5432 --username=astra --dbname=astra \
              --set=ON_ERROR_STOP=1 --file=migrations/v108/001_asymmetric_signing_authority.sql
          done
          psql --host=127.0.0.1 --port=5432 --username=astra --dbname=astra \
            --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.table_constraints
              WHERE table_schema = 'public'
                AND table_name = 'astra_signature_replay_v108'
                AND constraint_type = 'UNIQUE'
            ) THEN
              RAISE EXCEPTION 'signature replay uniqueness contract missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'astra_signing_keyring_v108'
                AND column_name = 'generation'
                AND is_nullable = 'NO'
            ) THEN
              RAISE EXCEPTION 'keyring generation contract missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.triggers
              WHERE event_object_schema = 'public'
                AND event_object_table = 'astra_signing_event_v108'
                AND trigger_name = 'astra_signing_event_append_only_v108'
            ) THEN
              RAISE EXCEPTION 'append-only signing event trigger missing';
            END IF;
          END
          $$;
          SQL

      - name: Commit qualified non-workflow source
        shell: bash
        run: |
          rm -f .github/workflows/schema108-asymmetric-signing-authority.yml
          rm -rf .pytest_cache build dist htmlcov
          rm -f .coverage coverage-v108.json coverage.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Materialize qualified Schema 108 non-workflow source"
          git push origin HEAD:agent/schema108-materialize-20260806
