name: schema107-production-rollout-actuator

on:
  pull_request:
    branches:
      - agent/schema106-production-fleet-deployment-qualification
    types: [opened, reopened, synchronize]
    paths:
      - app/runtime/**v107.py
      - app/platform_assets/v107/**
      - migrations/v107/**
      - tests/**v107.py
      - tools/**v107.py
      - tools/platform_v106.py
      - RELEASE_IDENTITY_V106.json
      - RELEASE_IDENTITY_V107.json
      - pyproject.toml
      - README.md
      - ENGINEERING_REPORT_V107.md
      - OPERATOR_RUNBOOK_V107.md
      - INTEGRATION_V107.md
      - LIVE_EXECUTION_STATUS_V107.json
      - QUALIFICATION_SUMMARY_V107.md
      - RELEASE_NOTES_V107.md
      - .github/workflows/schema107-production-rollout-actuator.yml

permissions:
  contents: read

concurrency:
  group: schema107-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra-ci
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"

      - name: Focused Schema 107 tests
        run: pytest -q tests/*v107.py

      - name: Complete stacked test suite
        run: pytest -q

      - name: Exact branch-aware Schema 107 coverage
        shell: bash
        run: |
          coverage erase
          coverage run --branch --include='app/runtime/*_v107.py' -m pytest -q tests/*v107.py
          coverage json -o coverage-v107.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage-v107.json").read_text(encoding="utf-8"))
          total = float(report["totals"]["percent_covered"])
          print(f"exact V107 branch-aware coverage: {total:.6f}%")
          if total < 93.0:
              raise SystemExit(f"coverage {total:.6f}% is below 93.0%")
          PY

      - name: Architecture audit
        run: python tools/architecture_audit_v107.py .

      - name: Static security audit
        run: python tools/static_audit_v107.py .

      - name: Compile all Python sources
        run: python -m compileall -q app tools tests

      - name: Verify predecessor and release identities
        run: |
          python tools/platform_v106.py --root . verify-release
          python tools/platform_v107.py --root . verify-release

      - name: Concurrent deterministic stress
        run: python -m tools.stress_v107 --iterations 1000 --workers 8

      - name: Verify canonical migration packaging
        run: cmp migrations/v107/001_production_rollout_actuator.sql app/platform_assets/v107/migrations/001_production_rollout_actuator.sql

      - name: Apply migration twice to real PostgreSQL
        shell: bash
        env:
          PGPASSWORD: astra-ci
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          for pass in 1 2; do
            psql --host=127.0.0.1 --port=5432 --username=astra --dbname=astra \
              --set=ON_ERROR_STOP=1 --file=migrations/v107/001_production_rollout_actuator.sql
          done
          psql --host=127.0.0.1 --port=5432 --username=astra --dbname=astra \
            --set=ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'astra_rollout_execution_v107'
                AND column_name = 'deployment_uid'
                AND is_nullable = 'NO'
            ) THEN
              RAISE EXCEPTION 'execution deployment_uid contract missing';
            END IF;
            IF (
              SELECT count(*) FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'astra_rollout_fence_v107'
                AND column_name = 'deployment_uid'
            ) <> 1 THEN
              RAISE EXCEPTION 'fence deployment_uid must exist exactly once';
            END IF;
          END
          $$;
          SQL

      - name: Verify production safety remains disabled
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("LIVE_EXECUTION_STATUS_V107.json").read_text(encoding="utf-8"))
          assert state["schema"] == 107
          assert state["status"] == "LOCAL_QUALIFICATION_ONLY"
          assert state["production_kubernetes_mutation_authorized"] is False
          assert state["external_order_routing_allowed"] is False
          assert state["live_trading_allowed"] is False
          PY
