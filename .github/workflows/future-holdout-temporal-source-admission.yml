name: future-holdout-temporal-source-admission

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/future_holdout_admission.py'
      - 'tests/test_future_holdout_admission.py'
      - 'docs/ASTRA_FUTURE_HOLDOUT_ADMISSION_2026-10-14.md'
      - '.github/workflows/future-holdout-temporal-source-admission.yml'

permissions:
  contents: read

concurrency:
  group: future-holdout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stale-and-fake-source-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Fail-closed UTC, data leakage, data-source spoofing tests
        run: |
          ruff check tools/future_holdout_admission.py tests/test_future_holdout_admission.py
          pytest -q tests/test_future_holdout_admission.py
      - name: Prove no actual candidate or genuine new source was admitted
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path('research/authority/real-frozen-candidate.json').exists()
          assert not Path('research/authority/verified-forward-holdout.json').exists()
          print('NO_ACTUAL_FUTURE_HOLDOUT: fixture tests only; no profitability or release claim')
          PY
