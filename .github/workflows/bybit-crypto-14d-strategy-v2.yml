name: bybit-crypto-14d-strategy-v2

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - '.github/workflows/bybit-crypto-14d-strategy-v2.yml'
      - '.ruff.toml'
      - 'tests/.ruff.toml'
      - 'requirements.lock'
      - 'app/marketdata/bybit_public_archive.py'
      - 'app/marketdata/bybit_v5.py'
      - 'app/strategy/crypto_correlation.py'
      - 'app/strategy/crypto_execution_risk.py'
      - 'app/strategy/crypto_entry_economics.py'
      - 'app/strategy/crypto_perp.py'
      - 'app/strategy/crypto_profit_runner.py'
      - 'app/strategy/crypto_runner_admission.py'
      - 'app/strategy/crypto_session_risk.py'
      - 'app/strategy/crypto_trade_management.py'
      - 'tools/replay_bybit_crypto.py'
      - 'tools/replay_bybit_crypto_runner.py'
      - 'tools/replay_bybit_crypto_archive.py'
      - 'tools/research_bybit_crypto_strategy_v2.py'
      - 'tools/normalize_bybit_crypto_replay.py'
      - 'tools/evaluate_bybit_crypto_replay.py'
      - 'tests/test_bybit_crypto_runner_replay.py'
      - 'tests/test_crypto_correlation.py'
      - 'tests/test_crypto_execution_risk.py'
      - 'tests/test_crypto_execution_risk_replay.py'
      - 'tests/test_crypto_session_risk.py'
      - 'tests/test_crypto_replay_quality.py'
      - 'tests/test_crypto_protection_quality.py'
      - 'tests/test_evaluate_bybit_crypto_replay.py'
      - 'tests/test_research_bybit_crypto_strategy_v2.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bybit-crypto-14d-strategy-v2.yml'
      - '.ruff.toml'
      - 'tests/.ruff.toml'
      - 'requirements.lock'
      - 'app/marketdata/bybit_public_archive.py'
      - 'app/marketdata/bybit_v5.py'
      - 'app/strategy/crypto_correlation.py'
      - 'app/strategy/crypto_execution_risk.py'
      - 'app/strategy/crypto_entry_economics.py'
      - 'app/strategy/crypto_perp.py'
      - 'app/strategy/crypto_profit_runner.py'
      - 'app/strategy/crypto_runner_admission.py'
      - 'app/strategy/crypto_session_risk.py'
      - 'app/strategy/crypto_trade_management.py'
      - 'tools/replay_bybit_crypto.py'
      - 'tools/replay_bybit_crypto_runner.py'
      - 'tools/replay_bybit_crypto_archive.py'
      - 'tools/research_bybit_crypto_strategy_v2.py'
      - 'tools/normalize_bybit_crypto_replay.py'
      - 'tools/evaluate_bybit_crypto_replay.py'
      - 'tests/test_bybit_crypto_runner_replay.py'
      - 'tests/test_crypto_correlation.py'
      - 'tests/test_crypto_execution_risk.py'
      - 'tests/test_crypto_execution_risk_replay.py'
      - 'tests/test_crypto_session_risk.py'
      - 'tests/test_crypto_replay_quality.py'
      - 'tests/test_crypto_protection_quality.py'
      - 'tests/test_evaluate_bybit_crypto_replay.py'
      - 'tests/test_research_bybit_crypto_strategy_v2.py'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Completed UTC Bybit archive days; minimum 14'
        required: false
        default: '14'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-14d-strategy-v2-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Verify strategy v2 contracts
        run: |
          ruff check --output-format=github \
            app/strategy/crypto_correlation.py \
            app/strategy/crypto_execution_risk.py \
            app/strategy/crypto_entry_economics.py \
            app/strategy/crypto_perp.py \
            app/strategy/crypto_profit_runner.py \
            app/strategy/crypto_runner_admission.py \
            app/strategy/crypto_session_risk.py \
            app/strategy/crypto_trade_management.py \
            tools/replay_bybit_crypto.py \
            tools/replay_bybit_crypto_runner.py \
            tools/replay_bybit_crypto_archive.py \
            tools/research_bybit_crypto_strategy_v2.py \
            tools/normalize_bybit_crypto_replay.py \
            tools/evaluate_bybit_crypto_replay.py \
            tests/test_bybit_crypto_runner_replay.py \
            tests/test_crypto_correlation.py \
            tests/test_crypto_execution_risk.py \
            tests/test_crypto_execution_risk_replay.py \
            tests/test_crypto_session_risk.py \
            tests/test_evaluate_bybit_crypto_replay.py \
            tests/test_research_bybit_crypto_strategy_v2.py
          pytest -q \
            tests/test_bybit_crypto_runner_replay.py \
            tests/test_crypto_correlation.py \
            tests/test_crypto_execution_risk.py \
            tests/test_crypto_execution_risk_replay.py \
            tests/test_crypto_session_risk.py \
            tests/test_crypto_replay_quality.py \
            tests/test_crypto_protection_quality.py \
            tests/test_evaluate_bybit_crypto_replay.py \
            tests/test_research_bybit_crypto_strategy_v2.py
          python -m compileall -q \
            app/strategy/crypto_correlation.py \
            app/strategy/crypto_execution_risk.py \
            app/strategy/crypto_entry_economics.py \
            app/strategy/crypto_perp.py \
            app/strategy/crypto_profit_runner.py \
            app/strategy/crypto_runner_admission.py \
            app/strategy/crypto_session_risk.py \
            app/strategy/crypto_trade_management.py \
            tools/replay_bybit_crypto_runner.py \
            tools/replay_bybit_crypto_archive.py \
            tools/research_bybit_crypto_strategy_v2.py

  replay-14d:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Enforce completed evidence window
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          if ! [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]]; then
            echo 'lookback_days must be an integer' >&2
            exit 1
          fi
          if [ "$LOOKBACK_DAYS" -lt 14 ]; then
            echo 'strategy-v2 evidence requires at least 14 completed UTC archive days' >&2
            exit 1
          fi

      - name: Replay official Bybit trade archives
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          mkdir -p artifacts/bybit-crypto-14d-v2/trades
          PYTHONPATH=. python tools/replay_bybit_crypto_archive.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT \
            --lookback-days "$LOOKBACK_DAYS" \
            --opening-equity 1000 \
            --targets 15,20,25 \
            --output artifacts/bybit-crypto-14d-v2/report-raw.json \
            --trades-dir artifacts/bybit-crypto-14d-v2/trades

      - name: Normalize and score
        run: |
          PYTHONPATH=. python tools/normalize_bybit_crypto_replay.py \
            --input artifacts/bybit-crypto-14d-v2/report-raw.json \
            --output artifacts/bybit-crypto-14d-v2/report.json
          PYTHONPATH=. python tools/evaluate_bybit_crypto_replay.py \
            --input artifacts/bybit-crypto-14d-v2/report.json \
            --output artifacts/bybit-crypto-14d-v2/scorecard.json

      - name: Enforce research-only candidate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/bybit-crypto-14d-v2/report.json').read_text())
          score = json.loads(Path('artifacts/bybit-crypto-14d-v2/scorecard.json').read_text())
          candidates = report['strategy_shadow_candidates']
          required = {
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_TIGHT_PROFIT_LOCK',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_SESSION_RISK',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_DIVERSIFIED',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_EXECUTION_RISK',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_COMBINED_RISK',
          }
          assert required.issubset(candidates)
          assert len(report['archive_dates']) >= 14
          assert report['archive_completed_utc_days_only'] is True
          assert report['current_incomplete_bar_excluded'] is True
          assert score['observed_days'] >= 14.0
          assert score['observation_window_basis'] == 'COMPLETED_UTC_ARCHIVE_DATES'
          assert report['strategy_promotion_allowed'] is False
          assert report['bybit_demo_order_writes_enabled'] is False
          assert report['bybit_live_order_routing_allowed'] is False
          assert score['strategy_promotion_allowed'] is False
          assert score['live_promotion_allowed'] is False

          tight_contract = report['strategy_v2_candidate_contract'][
              'tight_profit_lock_hypothesis'
          ]
          assert tight_contract['break_even_activation_r'] == 0.8
          assert tight_contract['profit_lock_activation_r'] == 1.0
          assert tight_contract['profit_lock_r'] == 0.5
          assert tight_contract['same_sample_14d_promotion_allowed'] is False
          assert tight_contract['requires_walk_forward_validation'] is True

          assert candidates['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_SESSION_RISK'][
              'session_risk'
          ]['enabled'] is True
          assert candidates['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_DIVERSIFIED'][
              'correlation_diversification'
          ]['enabled'] is True
          execution = candidates['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_EXECUTION_RISK']
          assert execution['execution_risk']['enabled'] is True
          assert execution['metrics']['risk_budget_breach_count'] == 0
          combined = candidates['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_COMBINED_RISK']
          assert combined['session_risk']['enabled'] is True
          assert combined['correlation_diversification']['enabled'] is True
          assert combined['execution_risk']['enabled'] is True
          assert combined['metrics']['risk_budget_breach_count'] == 0

          for name in required:
              candidate = candidates[name]
              assert candidate['strategy_promotion_allowed'] is False, name
              assert candidate['bybit_demo_order_writes_enabled'] is False, name
              assert candidate['bybit_live_order_routing_allowed'] is False, name
              assert score['strategy_shadow_candidates'][name]['live_promotion_allowed'] is False, name
          PY

      - name: Write comparison summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/bybit-crypto-14d-v2/report.json').read_text())
          score = json.loads(Path('artifacts/bybit-crypto-14d-v2/scorecard.json').read_text())
          candidates = report['strategy_shadow_candidates']
          names = [
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_TIGHT_PROFIT_LOCK',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_SESSION_RISK',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_DIVERSIFIED',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_EXECUTION_RISK',
              'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_COMBINED_RISK',
          ]
          comparison = {}
          for name in names:
              candidate = candidates[name]
              comparison[name] = {
                  'metrics': candidate['metrics'],
                  'accepted_trade_plan_event_count': candidate['accepted_trade_plan_event_count'],
                  'trade_plan_block_reason_counts': candidate['trade_plan_block_reason_counts'],
                  'runner_selected_trade_count': candidate['runner_selected_trade_count'],
                  'fixed_target_selected_trade_count': candidate['fixed_target_selected_trade_count'],
                  'session_risk': candidate['session_risk'],
                  'correlation_diversification': candidate['correlation_diversification'],
                  'execution_risk': candidate['execution_risk'],
                  'score': score['strategy_shadow_candidates'][name],
              }
          summary = {
              'archive_dates': report['archive_dates'],
              'observed_days': score['observed_days'],
              'observation_window_basis': score['observation_window_basis'],
              'symbols': report['symbols'],
              'strategy_v2_candidate_contract': report['strategy_v2_candidate_contract'],
              'comparison': comparison,
              'strategy_promotion_allowed': False,
              'live_promotion_allowed': False,
          }
          Path('artifacts/bybit-crypto-14d-v2/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('BYBIT_CRYPTO_14D_V2=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload strategy v2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-14d-strategy-v2-${{ github.run_id }}
          path: artifacts/bybit-crypto-14d-v2
          if-no-files-found: warn
          retention-days: 30
