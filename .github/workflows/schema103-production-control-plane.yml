name: schema103-production-control-plane

on:
  push:
    branches: [agent/schema103-production-control-plane]
  pull_request:
    paths:
      - 'app/runtime/*v103.py'
      - 'app/platform_assets/v103/**'
      - 'migrations/v103/**'
      - 'tools/*v103.py'
      - 'tests/*v103.py'
      - 'pyproject.toml'
      - '.github/workflows/schema103-production-control-plane.yml'

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'pytest>=8,<10' 'coverage>=7,<8'
      - run: python -m pytest -q tests/test_campaign_control_plane_v103.py tests/test_postgres_control_plane_v103.py tests/test_tools_v103.py
      - run: coverage run --branch -m pytest -q tests/test_campaign_control_plane_v103.py tests/test_postgres_control_plane_v103.py tests/test_tools_v103.py
      - run: coverage report --include='app/runtime/*v103.py' --fail-under=85
      - run: python -m tools.architecture_audit_v103 .
      - run: python -m tools.static_audit_v103 .
      - run: python -m tools.stress_v103 --iterations 1000 --workers 8
