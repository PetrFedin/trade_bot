name: strategy-qualification

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths:
      - 'app/strategy/**'
      - 'app/domain/**'
      - 'app/portfolio/**'
      - 'tests/test_strategy_backtest.py'
      - 'tests/test_strategy_qualification.py'
      - '.github/workflows/strategy-qualification.yml'
  pull_request:
    paths:
      - 'app/strategy/**'
      - 'app/domain/**'
      - 'app/portfolio/**'
      - 'tests/test_strategy_backtest.py'
      - 'tests/test_strategy_qualification.py'
      - '.github/workflows/strategy-qualification.yml'

permissions:
  contents: read

concurrency:
  group: strategy-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: No-lookahead backtest regression
        run: pytest -q tests/test_strategy_backtest.py
      - name: Walk-forward qualification framework
        run: pytest -q tests/test_strategy_qualification.py
      - name: Trading vertical regression
        run: pytest -q tests/test_trading_core_e2e.py
      - name: Compile strategy boundary
        run: python -m compileall -q app/strategy app/domain app/portfolio
