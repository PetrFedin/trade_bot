name: strategy-qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/strategy/**'
      - 'app/marketdata/**'
      - 'app/domain/**'
      - 'app/portfolio/**'
      - 'data/historical/**'
      - 'tools/qualify_real_historical.py'
      - 'tools/qualify_strategy_quality_shadow.py'
      - 'tests/test_strategy_backtest.py'
      - 'tests/test_strategy_benchmarks.py'
      - 'tests/test_strategy_qualification.py'
      - 'tests/test_historical_qualification.py'
      - 'tests/test_real_historical_qualification.py'
      - 'tests/test_position_management.py'
      - 'tests/test_regime_momentum.py'
      - 'tests/test_managed_strategy_backtest.py'
      - 'tests/test_strategy_quality_shadow.py'
      - 'requirements.lock'
      - '.github/workflows/strategy-qualification.yml'
  pull_request:
    paths:
      - 'app/strategy/**'
      - 'app/marketdata/**'
      - 'app/domain/**'
      - 'app/portfolio/**'
      - 'data/historical/**'
      - 'tools/qualify_real_historical.py'
      - 'tools/qualify_strategy_quality_shadow.py'
      - 'tests/test_strategy_backtest.py'
      - 'tests/test_strategy_benchmarks.py'
      - 'tests/test_strategy_qualification.py'
      - 'tests/test_historical_qualification.py'
      - 'tests/test_real_historical_qualification.py'
      - 'tests/test_position_management.py'
      - 'tests/test_regime_momentum.py'
      - 'tests/test_managed_strategy_backtest.py'
      - 'tests/test_strategy_quality_shadow.py'
      - 'requirements.lock'
      - '.github/workflows/strategy-qualification.yml'

permissions:
  contents: read

concurrency:
  group: strategy-qualification-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint historical qualification surface
        run: >-
          ruff check
          app/marketdata
          app/strategy
          tools/qualify_real_historical.py
          tools/qualify_strategy_quality_shadow.py
          tests/test_strategy_benchmarks.py
          tests/test_historical_qualification.py
          tests/test_real_historical_qualification.py
          tests/test_position_management.py
          tests/test_regime_momentum.py
          tests/test_managed_strategy_backtest.py
          tests/test_strategy_quality_shadow.py

      - name: No-lookahead, benchmark, activity, and position-management regressions
        run: >-
          pytest -q
          tests/test_strategy_backtest.py
          tests/test_strategy_benchmarks.py
          tests/test_strategy_qualification.py
          tests/test_historical_qualification.py
          tests/test_position_management.py
          tests/test_regime_momentum.py
          tests/test_managed_strategy_backtest.py

      - name: Current v1 manifested historical acceptance
        run: |
          mkdir -p strategy-qualification-evidence
          python -m tools.qualify_real_historical \
            --manifest data/historical/aapl_plotly_multiregime/manifest.json \
            --policy data/historical/aapl_plotly_multiregime/qualification.json \
            --output strategy-qualification-evidence/aapl-plotly-multiregime-v1.json
          pytest -q tests/test_real_historical_qualification.py

      - name: Validate current evidence identity and activity diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path('strategy-qualification-evidence/aapl-plotly-multiregime-v1.json')
              .read_text(encoding='utf-8')
          )
          assert evidence['qualified'] is True
          assert evidence['dataset_sha256'] == (
              '4242262f4d5d79352a43ec5cdc81f3a9d52953fd5ca2f230b3fabf890d33a256'
          )
          assert evidence['upstream_git_blob_sha'] == (
              '7b1bab3953bb5cdf47e84de1048ca04b0c991987'
          )
          assert evidence['source_classification'] == (
              'THIRD_PARTY_SAMPLE_NON_AUTHORITATIVE'
          )
          assert evidence['benchmark_mode'] == 'capital_matched_buy_hold_v1'
          assert evidence['acceptance_policy']['schema_version'] == (
              'strategy-qualification-v1'
          )
          assert evidence['acceptance_policy']['walk_forward'][
              'minimum_active_windows'
          ] == 0
          regimes = {item['name']: item for item in evidence['regimes']}
          assert regimes['rising_2015_q4']['active_windows'] == 2
          assert regimes['drawdown_2016_spring']['active_windows'] == 0
          assert regimes['range_2016_q4']['active_windows'] == 2
          assert all(
              item['benchmark_mode'] == 'capital_matched_buy_hold_v1'
              for item in regimes.values()
          )
          assert all(len(item['window_baselines']) == 2 for item in regimes.values())
          PY

      - name: Next-cycle v2 shadow activity policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from tools.qualify_real_historical import qualify

          evidence = qualify(
              Path('data/historical/aapl_plotly_multiregime/manifest.json'),
              Path('data/historical/aapl_plotly_multiregime/qualification_next_cycle.json'),
          )
          assert evidence['qualified'] is False
          assert evidence['reasons'] == [
              'REGIME_NOT_QUALIFIED:drawdown_2016_spring'
          ]
          assert evidence['acceptance_policy']['schema_version'] == (
              'strategy-qualification-v2'
          )
          assert evidence['acceptance_policy']['walk_forward'][
              'minimum_active_windows'
          ] == 1
          regimes = {item['name']: item for item in evidence['regimes']}
          drawdown = regimes['drawdown_2016_spring']
          assert drawdown['qualified'] is False
          assert drawdown['active_windows'] == 0
          assert drawdown['total_trades'] == 0
          assert drawdown['reasons'] == ['INSUFFICIENT_ACTIVE_WINDOWS']
          for name in ('rising_2015_q4', 'range_2016_q4'):
              assert regimes[name]['qualified'] is True
              assert regimes[name]['active_windows'] >= 1
              assert regimes[name]['reasons'] == []
          Path(
              'strategy-qualification-evidence/aapl-plotly-next-cycle-shadow-v2.json'
          ).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Strategy-quality shadow candidate with managed exits
        run: |
          python -m tools.qualify_strategy_quality_shadow \
            --manifest data/historical/aapl_plotly_multiregime/manifest.json \
            --policy data/historical/aapl_plotly_multiregime/qualification_strategy_quality_shadow.json \
            --output strategy-qualification-evidence/aapl-strategy-quality-shadow-v1.json
          pytest -q tests/test_strategy_quality_shadow.py

      - name: Verify shadow candidate remains non-promotable
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          evidence = json.loads(
              Path('strategy-qualification-evidence/aapl-strategy-quality-shadow-v1.json')
              .read_text(encoding='utf-8')
          )
          assert evidence['shadow_only'] is True
          assert evidence['promotion_allowed'] is False
          assert evidence['strategy_id'] == 'paper-regime-momentum-shadow-v1'
          assert evidence['source_classification'] == (
              'THIRD_PARTY_SAMPLE_NON_AUTHORITATIVE'
          )
          aggregate = evidence['aggregate']
          assert aggregate['closed_trade_count'] == 3
          assert aggregate['winning_trades'] == 2
          assert aggregate['losing_trades'] == 1
          assert Decimal(aggregate['profit_factor']) < Decimal('1')
          assert Decimal(aggregate['net_closed_trade_pnl']) < Decimal('0')
          assert aggregate['candidate_mean_return_not_worse'] is True
          assert aggregate['candidate_worst_drawdown_not_worse'] is True
          blockers = set(evidence['promotion_blockers'])
          assert 'AGGREGATE_PROFIT_FACTOR_BELOW_ONE' in blockers
          assert 'AGGREGATE_CLOSED_TRADE_PNL_NOT_POSITIVE' in blockers
          PY

      - name: Trading vertical regression
        run: pytest -q tests/test_trading_core_e2e.py

      - name: Compile strategy and historical data boundary
        run: >-
          python -m compileall -q
          app/strategy
          app/marketdata
          tools/qualify_real_historical.py
          tools/qualify_strategy_quality_shadow.py

      - name: Verify fail-closed live state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('LIVE_EXECUTION_STATUS_V109.json').read_text(encoding='utf-8'))
          assert state['external_order_routing_allowed'] is False
          assert state['live_trading_allowed'] is False
          PY

      - name: Upload strategy qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy-qualification-${{ github.run_id }}
          path: strategy-qualification-evidence/*.json
          if-no-files-found: error
          retention-days: 30
