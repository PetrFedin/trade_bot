name: strategy-qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/strategy/**'
      - 'app/marketdata/historical.py'
      - 'app/domain/**'
      - 'app/portfolio/**'
      - 'tests/test_strategy_backtest.py'
      - 'tests/test_strategy_qualification.py'
      - 'tests/test_historical_qualification.py'
      - '.github/workflows/strategy-qualification.yml'
  pull_request:
    paths:
      - 'app/strategy/**'
      - 'app/marketdata/historical.py'
      - 'app/domain/**'
      - 'app/portfolio/**'
      - 'tests/test_strategy_backtest.py'
      - 'tests/test_strategy_qualification.py'
      - 'tests/test_historical_qualification.py'
      - '.github/workflows/strategy-qualification.yml'

permissions:
  contents: read

concurrency:
  group: strategy-qualification-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: No-lookahead backtest regression
        run: pytest -q tests/test_strategy_backtest.py
      - name: Walk-forward and multi-regime dataset qualification
        run: >-
          pytest -q
          tests/test_strategy_qualification.py
          tests/test_historical_qualification.py
      - name: Trading vertical regression
        run: pytest -q tests/test_trading_core_e2e.py
      - name: Compile strategy and historical data boundary
        run: python -m compileall -q app/strategy app/marketdata app/domain app/portfolio
