name: schema101-materialize

on:
  pull_request:
    branches:
      - agent/schema100-alpaca-paper-sandbox
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/schema101-materialize.yml
      - releases/schema101/payload/**

permissions:
  contents: write

concurrency:
  group: schema101-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/schema101-external-sandbox-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Schema 101 branch
        uses: actions/checkout@v4
        with:
          ref: agent/schema101-external-sandbox-qualification
          fetch-depth: 0

      - name: Verify and materialize Schema 101
        shell: bash
        run: |
          set -euo pipefail

          parts=(
            releases/schema101/payload/chunk-000
            releases/schema101/payload/chunk-001a
            releases/schema101/payload/chunk-001b
            releases/schema101/payload/chunk-002a
            releases/schema101/payload/chunk-002b
          )

          wc -c "${parts[@]}"
          echo "cb2538136663233fa04eb2f05c61cad8b22eead6d2e92a3672fea8b6b8d98b0a  ${parts[0]}" | sha256sum -c -
          echo "022333e26aa840165e8de65f76deb4c6391040e68ca29120b97157a536d05fee  ${parts[1]}" | sha256sum -c -
          echo "441ab377d2ff58c938053c62784879b14eb20f9a06f1f38696130be851a311f0  ${parts[2]}" | sha256sum -c -
          echo "38e037c4a28eefa2581cb3e789481ee9d6ae0880bfc0be91d4d4e16b2e70bcf4  ${parts[3]}" | sha256sum -c -
          echo "a1e443ceac982c431a4b2f5a849a95b0b7eb0381b5d8796bc86d1843d2d3e27b  ${parts[4]}" | sha256sum -c -

          cat "${parts[@]}" | tr -d '\r\n\t ' > /tmp/schema101.tar.gz.b64
          echo "e4c4fef7fcf980afced783a45b259fd8e29ec4e72055b80e292ea45bf0e01cca  /tmp/schema101.tar.gz.b64" | sha256sum -c -

          base64 -d /tmp/schema101.tar.gz.b64 > /tmp/schema101.tar.gz
          echo "997ab6573466555c44fe6ff4dcc23fc5804336311220c512c56b6c173af29272  /tmp/schema101.tar.gz" | sha256sum -c -

          tar -xzf /tmp/schema101.tar.gz -C .
          rm -rf releases/schema101/payload

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Schema 101 payload already materialized"
            exit 0
          fi

          git commit -m "Materialize Schema 101 external sandbox qualification"
          git push origin HEAD:agent/schema101-external-sandbox-qualification
