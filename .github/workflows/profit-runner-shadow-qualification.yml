name: profit-runner-shadow-qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/strategy/position_management.py'
      - 'app/strategy/ohlcv_exit.py'
      - 'research/profit_runner_shadow_v1.json'
      - 'tests/test_profit_runner.py'
      - 'tests/test_profit_runner_shadow_config.py'
      - '.github/workflows/profit-runner-shadow-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'app/strategy/position_management.py'
      - 'app/strategy/ohlcv_exit.py'
      - 'research/profit_runner_shadow_v1.json'
      - 'tests/test_profit_runner.py'
      - 'tests/test_profit_runner_shadow_config.py'
      - '.github/workflows/profit-runner-shadow-qualification.yml'

permissions:
  contents: read

concurrency:
  group: profit-runner-shadow-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Validate shadow policy JSON
        run: python -m json.tool research/profit_runner_shadow_v1.json > /dev/null

      - name: Lint profit-runner surface
        run: >-
          ruff check --output-format=github
          app/strategy/position_management.py
          app/strategy/ohlcv_exit.py
          tests/test_profit_runner.py
          tests/test_profit_runner_shadow_config.py

      - name: Profit-runner safety regressions
        shell: bash
        run: |
          set -o pipefail
          pytest -vv \
            tests/test_position_management.py \
            tests/test_ohlcv_exit.py \
            tests/test_profit_runner.py \
            tests/test_profit_runner_shadow_config.py \
            2>&1 | tee profit-runner-pytest.txt

      - name: Upload profit-runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: profit-runner-shadow-${{ github.run_id }}
          path: profit-runner-pytest.txt
          if-no-files-found: warn
          retention-days: 30
