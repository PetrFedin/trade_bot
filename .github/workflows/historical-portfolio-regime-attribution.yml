name: historical-portfolio-regime-attribution

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/historical_portfolio_regime_attribution.py'
      - 'tests/test_historical_portfolio_regime_attribution.py'
      - 'docs/ASTRA_INTEGRATION_MASTER_PLAN_2026-10-01.md'
      - '.github/workflows/historical-portfolio-regime-attribution.yml'
      - 'research/snapshots/bybit_3y_2023-10-09_2026-10-08/**'

permissions:
  contents: read

concurrency:
  group: regime-attribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-regime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact research SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Check prior-bar-only classifier and portfolio conservation
        run: |
          ruff check tools/historical_portfolio_regime_attribution.py tests/test_historical_portfolio_regime_attribution.py
          python -m compileall -q tools/historical_portfolio_regime_attribution.py
          pytest -q tests/test_historical_portfolio_regime_attribution.py

      - name: Run unchanged six-major research regime attribution
        run: |
          mkdir -p regime-evidence
          python -m tools.historical_portfolio_regime_attribution \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --symbols BNBUSDT BTCUSDT DOGEUSDT ETHUSDT SOLUSDT XRPUSDT \
            --output regime-evidence/six-major.json

      - name: Run unchanged broad-21 research regime attribution
        run: |
          python -m tools.historical_portfolio_regime_attribution \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --symbols ADAUSDT APTUSDT ARBUSDT ATOMUSDT AVAXUSDT BNBUSDT BTCUSDT DOGEUSDT DOTUSDT ETHUSDT FILUSDT INJUSDT LINKUSDT LTCUSDT NEARUSDT OPUSDT SOLUSDT SUIUSDT TONUSDT TRXUSDT XRPUSDT \
            --output regime-evidence/broad-21.json

      - name: Verify research gate and negative baseline preservation
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          six = json.loads(Path("regime-evidence/six-major.json").read_text())
          broad = json.loads(Path("regime-evidence/broad-21.json").read_text())
          for payload in (six, broad):
              assert payload["research_only"] is True
              assert payload["strategy_promotion_allowed"] is False
              assert payload["live_trading_allowed"] is False
              assert payload["untouched_out_of_sample"] is False
              assert payload["funding_allocated_per_day"] is False
              assert payload["portfolio"]["marked_pnl_conserved"] is True
              assert payload["portfolio"]["closed_trades_conserved"] is True
          assert six["portfolio"]["closed_trades"] == 256
          assert broad["portfolio"]["closed_trades"] == 276
          assert Decimal(broad["portfolio"]["portfolio_return_before_funding"]) < 0
          PY

      - name: Upload pinned analytical evidence for all regimes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-regime-evidence-${{ github.run_id }}
          path: regime-evidence/*.json
          if-no-files-found: error
          retention-days: 30
