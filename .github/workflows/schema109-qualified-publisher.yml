name: schema109-qualified-publisher

on:
  push:
    branches:
      - agent/schema109-clean-materialize-20260809
    paths:
      - _schema109_final_payload/qualified-final-hashes.json
      - .github/workflows/schema109-qualified-publisher.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schema109-qualified-publisher
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/schema109-remote-signer-attestation-clean
  EXPECTED_BASE: f9d2f693437b3b8e9994fa02adeb13059ed6f7cb
  WORKFLOW_PATH: .github/workflows/schema109-remote-signer-attestation.yml

jobs:
  publish-qualified-non-workflow-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify target is still the qualified base
        run: |
          git fetch origin "$TARGET_BRANCH"
          ACTUAL_BASE="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$ACTUAL_BASE" = "$EXPECTED_BASE" || {
            echo "target branch moved: expected $EXPECTED_BASE actual $ACTUAL_BASE" >&2
            exit 1
          }

      - name: Reconstruct hash-locked source overlay
        run: |
          python tools/schema109_qualified_materializer.py extract \
            --payload-dir _schema109_final_payload \
            --overlay schema109-publish-overlay
          git worktree add --detach /tmp/schema109-publish "$EXPECTED_BASE"
          cp -a schema109-publish-overlay/. /tmp/schema109-publish/

      - name: Reproduce exact qualified normalization
        working-directory: /tmp/schema109-publish
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.1
          paths=(
            app/runtime/postgres_remote_signer_repository_v109.py
            app/runtime/remote_signer_attestation_v109.py
            tools/architecture_audit_v109.py
            tools/platform_v109.py
            tools/static_audit_v109.py
            tools/stress_v109.py
            tools/platform_v108.py
            tools/architecture_audit_v108.py
            tools/product_identity.py
            tests/test_postgres_remote_signer_repository_unit_v109.py
            tests/test_postgres_remote_signer_repository_v109.py
            tests/test_remote_signer_attestation_v109.py
            tests/test_tools_v109.py
            tests/test_product_identity.py
          )
          ruff check --fix "${paths[@]}" || true
          ruff format "${paths[@]}"
          python "$GITHUB_WORKSPACE/tools/schema109_qualified_materializer.py" normalize --root .
          python "$GITHUB_WORKSPACE/tools/schema109_qualified_materializer.py" sync-identity --root .
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('RELEASE_IDENTITY_V109.json')
          identity = json.loads(path.read_text(encoding='utf-8'))
          identity.setdefault('qualification', {})['ci_branch_aware_runtime_coverage_percent'] = 98.23321554770318
          path.write_text(json.dumps(identity, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          ruff check "${paths[@]}"
          git diff --check

      - name: Require exact 27-file qualified evidence match
        working-directory: /tmp/schema109-publish
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          evidence = json.loads((Path(os.environ['GITHUB_WORKSPACE']) / '_schema109_final_payload/qualified-final-hashes.json').read_text(encoding='utf-8'))
          assert evidence['qualified_run_id'] == 31288333337
          assert evidence['base'] == os.environ['EXPECTED_BASE']
          files = evidence['files']
          assert len(files) == 27
          for relative, expected in sorted(files.items()):
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'missing qualified file: {relative}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'qualified hash mismatch: {relative}: {actual} != {expected}')

          tracked = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['EXPECTED_BASE'], '--'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          changed = tracked | untracked
          expected_names = set(files)
          if changed != expected_names:
              raise SystemExit(json.dumps({'unexpected': sorted(changed - expected_names), 'missing': sorted(expected_names - changed)}))

          state = json.loads((root / 'LIVE_EXECUTION_STATUS_V109.json').read_text(encoding='utf-8'))
          for key in (
              'production_remote_signer_verified',
              'production_signing_authority_verified',
              'production_kubernetes_mutation_authorized',
              'external_order_routing_allowed',
              'live_trading_allowed',
              'automatic_sign_post_retry_allowed',
              'private_key_material_persisted_by_runtime',
          ):
              if state.get(key) is not False:
                  raise SystemExit(f'production safety flag must remain false: {key}')
          print('PASS exact qualified evidence: 27/27 files and all safety flags fail closed')
          PY

      - name: Publish 26 non-workflow files only
        working-directory: /tmp/schema109-publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- "$WORKFLOW_PATH"
          test -f "$WORKFLOW_PATH"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 26 || {
            printf 'unexpected staged count: %s\n' "${#staged[@]}" >&2
            printf '%s\n' "${staged[@]}" >&2
            exit 1
          }
          mapfile -t remaining < <(git ls-files --others --exclude-standard)
          test "${#remaining[@]}" -eq 1 || { printf 'unexpected remaining untracked files\n%s\n' "${remaining[@]}" >&2; exit 1; }
          test "${remaining[0]}" = "$WORKFLOW_PATH"
          git commit -m "Schema 109 remote signer attestation core"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "published_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Persist publisher evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema109-qualified-publisher-${{ github.run_id }}
          path: _schema109_final_payload/qualified-final-hashes.json
          if-no-files-found: error
          retention-days: 14
