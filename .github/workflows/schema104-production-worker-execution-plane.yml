name: schema104-production-worker-execution-plane

on:
  push:
    branches:
      - agent/schema104-production-worker-execution-plane
  pull_request:
    paths:
      - 'app/runtime/*v104.py'
      - 'app/platform_assets/v104/**'
      - 'migrations/v104/**'
      - 'tools/*v104.py'
      - 'tests/*v104.py'
      - 'pyproject.toml'
      - '.github/workflows/schema104-production-worker-execution-plane.yml'

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'pytest>=8,<10' 'coverage>=7,<8'
      - run: python -m pytest -q tests/test_worker_execution_plane_v104.py tests/test_postgres_worker_plane_v104.py tests/test_tools_v104.py
      - run: coverage run --branch -m pytest -q tests/test_worker_execution_plane_v104.py tests/test_postgres_worker_plane_v104.py tests/test_tools_v104.py
      - run: coverage report --include='app/runtime/*v104.py' --fail-under=95
      - run: python -m tools.architecture_audit_v104 .
      - run: python -m tools.static_audit_v104 .
      - run: python -m compileall -q app tools tests
      - run: python -m tools.stress_v104 --iterations 1000 --workers 8
