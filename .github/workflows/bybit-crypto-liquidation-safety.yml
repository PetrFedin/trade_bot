name: bybit-crypto-liquidation-safety

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/strategy/crypto_liquidation_safety.py'
      - 'tests/test_crypto_liquidation_safety.py'
      - '.github/workflows/bybit-crypto-liquidation-safety.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/strategy/crypto_liquidation_safety.py'
      - 'tests/test_crypto_liquidation_safety.py'
      - '.github/workflows/bybit-crypto-liquidation-safety.yml'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-liquidation-safety-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  liquidation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint liquidation safety
        run: >-
          ruff check --output-format=github
          app/strategy/crypto_liquidation_safety.py
          tests/test_crypto_liquidation_safety.py

      - name: Test liquidation buffer contract
        run: pytest -vv tests/test_crypto_liquidation_safety.py

      - name: Compile liquidation boundary
        run: python -m compileall -q app/strategy/crypto_liquidation_safety.py
