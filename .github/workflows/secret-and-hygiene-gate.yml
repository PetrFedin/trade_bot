name: secret-and-hygiene-gate

# Blocking mirror of .pre-commit-config.yaml, so the gate holds for contributors who have
# not installed the hooks locally.
#
# Scope is the working tree, not history. The full commit history of this repository was
# audited separately and carries no real secret; this gate exists to stop a new one from
# entering. Re-auditing history belongs in a scheduled job, not on every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check 'pre-commit==4.6.2'

      - name: Run the hygiene and secret gate
        run: pre-commit run --all-files --show-diff-on-failure
