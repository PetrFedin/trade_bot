name: bybit-demo-protection-reconciliation-quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_protection_client.py'
      - 'app/execution/bybit_demo_protection_reconciliation.py'
      - 'app/execution/bybit_demo_protection_quality_tracker.py'
      - 'app/execution/bybit_demo_controller.py'
      - 'app/execution/bybit_demo_cycle.py'
      - 'app/execution/bybit_demo_orchestrator.py'
      - 'tests/test_bybit_demo_protection_client.py'
      - 'tests/test_bybit_demo_protection_reconciliation.py'
      - 'tests/test_bybit_demo_emergency_flatten_reconciliation.py'
      - 'tests/test_bybit_demo_protection_quality_tracker.py'
      - '.github/workflows/bybit-demo-protection-reconciliation-quality.yml'
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/execution/bybit_demo_protection_client.py'
      - 'app/execution/bybit_demo_protection_reconciliation.py'
      - 'app/execution/bybit_demo_protection_quality_tracker.py'
      - 'app/execution/bybit_demo_controller.py'
      - 'app/execution/bybit_demo_cycle.py'
      - 'app/execution/bybit_demo_orchestrator.py'
      - 'tests/test_bybit_demo_protection_client.py'
      - 'tests/test_bybit_demo_protection_reconciliation.py'
      - 'tests/test_bybit_demo_emergency_flatten_reconciliation.py'
      - 'tests/test_bybit_demo_protection_quality_tracker.py'
      - '.github/workflows/bybit-demo-protection-reconciliation-quality.yml'

permissions:
  contents: read

concurrency:
  group: bybit-demo-protection-reconcile-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint exchange protection reconciliation
        run: >-
          ruff check --output-format=github
          app/execution/bybit_demo_protection_client.py
          app/execution/bybit_demo_protection_reconciliation.py
          app/execution/bybit_demo_protection_quality_tracker.py
          tests/test_bybit_demo_protection_client.py
          tests/test_bybit_demo_protection_reconciliation.py
          tests/test_bybit_demo_emergency_flatten_reconciliation.py
          tests/test_bybit_demo_protection_quality_tracker.py

      - name: Test protection state proof and fail-closed flatten
        run: >-
          pytest -vv
          tests/test_bybit_demo_protection_client.py
          tests/test_bybit_demo_protection_reconciliation.py
          tests/test_bybit_demo_emergency_flatten_reconciliation.py
          tests/test_bybit_demo_protection_quality_tracker.py
          tests/test_bybit_demo_controller.py
          tests/test_bybit_demo_cycle.py

      - name: Compile exchange protection reconciliation
        run: >-
          python -m compileall -q
          app/execution/bybit_demo_protection_client.py
          app/execution/bybit_demo_protection_reconciliation.py
          app/execution/bybit_demo_protection_quality_tracker.py
