name: schema106-materialize

on:
  pull_request:
    branches:
      - agent/schema105-production-worker-fleet-operations
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/schema106-materialize.yml
      - releases/schema106/payload/**

permissions:
  contents: write

concurrency:
  group: schema106-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/schema106-production-fleet-deployment-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Schema 106 branch
        uses: actions/checkout@v4
        with:
          ref: agent/schema106-production-fleet-deployment-qualification
          fetch-depth: 0

      - name: Verify and materialize Schema 106 source
        shell: bash
        run: |
          set -euo pipefail

          parts=(
            releases/schema106/payload/chunk-000
            releases/schema106/payload/chunk-001
            releases/schema106/payload/chunk-002
            releases/schema106/payload/chunk-003
            releases/schema106/payload/chunk-004
            releases/schema106/payload/chunk-005
            releases/schema106/payload/chunk-006
            releases/schema106/payload/chunk-007
            releases/schema106/payload/chunk-008
            releases/schema106/payload/chunk-021
            releases/schema106/payload/chunk-022
            releases/schema106/payload/chunk-023
            releases/schema106/payload/chunk-024
            releases/schema106/payload/chunk-025
            releases/schema106/payload/chunk-026
          )

          echo "bd361eb41a6a41bd32e9985a8f1893dcbc3b509bdb32464c59c0ed525f65b3d0  ${parts[0]}" | sha256sum -c -
          echo "365d866b8965d8774c07647393781753f272e210d6f7e4a7601be4475330e8ef  ${parts[1]}" | sha256sum -c -
          echo "978a017db1de6711844b100cff388d9c0073f309a78fbeac8ef7056d5786df08  ${parts[2]}" | sha256sum -c -
          echo "3b92f7d5507132b986fad68c4bc2bf087b156b6d44277cacd191aa70298bb80a  ${parts[3]}" | sha256sum -c -
          echo "79cfbedca29f3f5c2a26050dab11a93ffd54c138ba52f75c8cbd34dde0cd7198  ${parts[4]}" | sha256sum -c -
          echo "c05d09e9d2af718e5d48fc023f29ef8990c3387bb65b53385eb55a0488604e1f  ${parts[5]}" | sha256sum -c -
          echo "629080cb0e98e5f8c3c4e317267c8202563a66c8ec29dc205e42983063c3cd19  ${parts[6]}" | sha256sum -c -
          echo "16362d0eff88ef3eb1ebba4b5b1c6124f91f0ab156a0ccb428b677df9be3465c  ${parts[7]}" | sha256sum -c -
          echo "326309965e65feace9712b385cbfa968dde40c27e6496d05a07699d5dff41f25  ${parts[8]}" | sha256sum -c -
          echo "ff61ef262c70b72e89f14f4abeb25fb3df1d23413178fe06183cce72a7c542b1  ${parts[9]}" | sha256sum -c -
          echo "24f56c9660e1338720b026af02e7d0518012e647e951f22f0ebf1bc4961b6eae  ${parts[10]}" | sha256sum -c -
          echo "68254fad3fb06e44745b719fd99782df0231a2cfc988003ee25405c9945b8b0b  ${parts[11]}" | sha256sum -c -
          echo "ad254327ef454ef9a2424e78cc7400de229d501b56fbe706aee2fb352b2511ce  ${parts[12]}" | sha256sum -c -
          echo "31f6b0e41473d23fdc4cc79db2c69437f18db57e76212e50759a296eb9800d95  ${parts[13]}" | sha256sum -c -
          echo "7c0e135d7fbcd97a813e4ea917a018b1cf5140e7ef9d583b81ba7349c66e4b34  ${parts[14]}" | sha256sum -c -

          cat "${parts[@]}" | tr -d '\r\n\t ' > /tmp/schema106.tar.gz.b64
          echo "e9cb607166c38fbf89da6e84bea0a1cd68de83cce9b86b8ab98889a2c1db5e0b  /tmp/schema106.tar.gz.b64" | sha256sum -c -

          base64 -d /tmp/schema106.tar.gz.b64 > /tmp/schema106.tar.gz
          echo "d73bdc1e8a9335a38eb3450ca0bb2b90ba0ff71ebfaf1557e6f0cc7b9b8ad0ca  /tmp/schema106.tar.gz" | sha256sum -c -

          tar -xzf /tmp/schema106.tar.gz -C .
          rm -rf releases/schema106/payload

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Schema 106 source already materialized"
            exit 0
          fi

          git commit -m "Materialize Schema 106 production fleet deployment qualification"
          git push origin HEAD:agent/schema106-production-fleet-deployment-qualification
