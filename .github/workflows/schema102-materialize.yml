name: schema102-materialize

on:
  pull_request:
    branches:
      - agent/schema101-external-sandbox-qualification
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/schema102-materialize.yml
      - releases/schema102/payload/**

permissions:
  contents: write

concurrency:
  group: schema102-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/schema102-sandbox-soak-orchestrator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Schema 102 branch
        uses: actions/checkout@v4
        with:
          ref: agent/schema102-sandbox-soak-orchestrator
          fetch-depth: 0

      - name: Verify and materialize Schema 102 source
        shell: bash
        run: |
          set -euo pipefail

          parts=(
            releases/schema102/payload/chunk-000
            releases/schema102/payload/chunk-001
            releases/schema102/payload/chunk-002
            releases/schema102/payload/chunk-003
            releases/schema102/payload/chunk-004
            releases/schema102/payload/chunk-005
            releases/schema102/payload/chunk-006
          )

          echo "190b43b3e7c0c527ba739cf65ec885cb4a2c8fd28ff061a44c764ad76af67a49  ${parts[0]}" | sha256sum -c -
          echo "c98a1712294b5eecc344fa03d20093a4962477d473f0de77c55fa390d22c04e0  ${parts[1]}" | sha256sum -c -
          echo "fa58dea97ab64fcb6eeafa02a9bdc045543d903568873c8056d16fe36ca4aabc  ${parts[2]}" | sha256sum -c -
          echo "b40eb801e88efb9af23b6d9e07f7b4b239b216e6f778a1d8da2fd9b2cf4c9d36  ${parts[3]}" | sha256sum -c -
          echo "46fcedc8257ff7b887a792ac6e1209d60d516c0a648616f45472e24089f6ac33  ${parts[4]}" | sha256sum -c -
          echo "aef3c441b5a0cbc459f6ab3daeef1bf3f52338177dc577109fa89d720ef09c3d  ${parts[5]}" | sha256sum -c -
          echo "6bfecaa767fd3821b8eb1063b001072700f17b38ce7311cd4bee444bc9f0571b  ${parts[6]}" | sha256sum -c -

          cat "${parts[@]}" | tr -d '\r\n\t ' > /tmp/schema102.tar.gz.b64
          echo "67bb14f65a546d8ea6b4d0143f409e53925d5fe7ce12261b1ef89d285b97eeb8  /tmp/schema102.tar.gz.b64" | sha256sum -c -

          base64 -d /tmp/schema102.tar.gz.b64 > /tmp/schema102.tar.gz
          echo "c69b7246a9d2eefb60d699d192f12c57fda8ca3a4c3b55685740cde408cb2ed6  /tmp/schema102.tar.gz" | sha256sum -c -

          tar -xzf /tmp/schema102.tar.gz -C .
          rm -rf releases/schema102/payload
          rm -f .github/workflows/schema102-sandbox-soak-orchestrator.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Schema 102 source already materialized"
            exit 0
          fi

          git commit -m "Materialize Schema 102 durable sandbox soak orchestrator"
          git push origin HEAD:agent/schema102-sandbox-soak-orchestrator
