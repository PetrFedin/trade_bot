name: canonical-deployment-regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/runtime/*v105.py
      - app/runtime/*v106.py
      - app/platform_assets/v105/**
      - app/platform_assets/v106/**
      - migrations/v105/**
      - migrations/v106/**
      - tests/*v105.py
      - tests/*v106.py
      - tests/test_postgres_fleet_deployment_integration_v105_v106.py
      - tools/*v105.py
      - tools/*v106.py
      - RELEASE_IDENTITY_V105.json
      - RELEASE_IDENTITY_V106.json
      - RELEASE_IDENTITY_V109.json
      - LIVE_EXECUTION_STATUS_V105.json
      - LIVE_EXECUTION_STATUS_V106.json
      - pyproject.toml
      - .github/workflows/schema105-production-worker-fleet-operations.yml
      - .github/workflows/schema106-production-fleet-deployment-qualification.yml
      - .github/workflows/canonical-deployment-regression.yml
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - app/runtime/*v105.py
      - app/runtime/*v106.py
      - app/platform_assets/v105/**
      - app/platform_assets/v106/**
      - migrations/v105/**
      - migrations/v106/**
      - tests/*v105.py
      - tests/*v106.py
      - tests/test_postgres_fleet_deployment_integration_v105_v106.py
      - tools/*v105.py
      - tools/*v106.py
      - RELEASE_IDENTITY_V105.json
      - RELEASE_IDENTITY_V106.json
      - RELEASE_IDENTITY_V109.json
      - LIVE_EXECUTION_STATUS_V105.json
      - LIVE_EXECUTION_STATUS_V106.json
      - pyproject.toml
      - .github/workflows/schema105-production-worker-fleet-operations.yml
      - .github/workflows/schema106-production-fleet-deployment-qualification.yml
      - .github/workflows/canonical-deployment-regression.yml

permissions:
  contents: read

concurrency:
  group: canonical-deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fleet-deployment-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra-ci
          POSTGRES_DB: astra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASTRA_TEST_FLEET_DEPLOYMENT_DSN: postgresql://astra:astra-ci@127.0.0.1:5432/astra
      PGPASSWORD: astra-ci
    steps:
      - name: Checkout exact branch or PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check ".[test,postgresql,dev]"
          python -m pip check
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Verify and apply V105-V106 migrations twice
        run: |
          set -euo pipefail
          cmp migrations/v105/001_production_worker_fleet_operations.sql app/platform_assets/v105/migrations/001_production_worker_fleet_operations.sql
          cmp migrations/v106/001_production_fleet_deployment_qualification.sql app/platform_assets/v106/migrations/001_production_fleet_deployment_qualification.sql
          migrations=(
            migrations/v105/001_production_worker_fleet_operations.sql
            migrations/v106/001_production_fleet_deployment_qualification.sql
          )
          for pass in 1 2; do
            for migration in "${migrations[@]}"; do
              psql -h 127.0.0.1 -p 5432 -U astra -d astra -v ON_ERROR_STOP=1 -f "$migration"
            done
          done

      - name: Real PostgreSQL repository integration
        run: pytest -q tests/test_postgres_fleet_deployment_integration_v105_v106.py

      - name: Focused V105-V106 and complete regression suites
        run: |
          pytest -q tests/*v105.py tests/*v106.py tests/test_postgres_fleet_deployment_integration_v105_v106.py
          pytest -q

      - name: Enforce historical branch-aware coverage floors
        shell: bash
        run: |
          set -euo pipefail
          coverage erase
          coverage run --branch --include='app/runtime/*v105.py' -m pytest -q tests/*v105.py tests/test_postgres_fleet_deployment_integration_v105_v106.py
          coverage json -o coverage-v105.json
          coverage erase
          coverage run --branch --include='app/runtime/*v106.py' -m pytest -q tests/*v106.py tests/test_postgres_fleet_deployment_integration_v105_v106.py
          coverage json -o coverage-v106.json
          python - <<'PY'
          import json
          from pathlib import Path
          floors = {105: 95.0, 106: 98.0}
          for schema, floor in floors.items():
              total = float(json.loads(Path(f"coverage-v{schema}.json").read_text())["totals"]["percent_covered"])
              print(f"V{schema} branch-aware coverage: {total:.6f}%")
              if total < floor:
                  raise SystemExit(f"V{schema} coverage {total:.6f}% < {floor:.1f}%")
          PY

      - name: Audit, compile, frozen critical digests, current identity and stress
        run: |
          set -euo pipefail
          python -m tools.architecture_audit_v105 .
          python -m tools.static_audit_v105 .
          python -m tools.architecture_audit_v106 .
          python -m tools.static_audit_v106 .
          python -m compileall -q app tools tests
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          for schema in (105, 106):
              identity = json.loads(Path(f"RELEASE_IDENTITY_V{schema}.json").read_text(encoding="utf-8"))
              workflow = f".github/workflows/schema{schema}-"
              prefixes = ("app/runtime/", f"app/platform_assets/v{schema}/", f"migrations/v{schema}/")
              critical = {
                  path: digest
                  for path, digest in identity["files"].items()
                  if path.startswith(prefixes)
                  or path == f"LIVE_EXECUTION_STATUS_V{schema}.json"
                  or path.startswith(workflow)
              }
              if not critical:
                  raise SystemExit(f"V{schema} critical identity set is empty")
              mismatches = []
              for relative, expected in sorted(critical.items()):
                  path = Path(relative)
                  actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
                  if actual != expected:
                      mismatches.append(f"{relative}: {actual} != {expected}")
              if mismatches:
                  raise SystemExit(
                      f"V{schema} frozen critical artifact drift:\n" + "\n".join(mismatches)
                  )
              print(f"PASS V{schema} frozen critical artifacts: {len(critical)} files")
          PY
          python -m tools.platform_v109 --root . verify-release
          python -m tools.stress_v105 --iterations 1000 --workers 8
          python -m tools.stress_v106 --iterations 1000 --workers 8

      - name: Verify durable PostgreSQL contracts
        run: |
          psql -h 127.0.0.1 -p 5432 -U astra -d astra -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v105_triggers integer;
            v105_events text[];
            v106_triggers integer;
            v106_events text[];
          BEGIN
            SELECT count(DISTINCT trigger_name),
                   array_agg(DISTINCT event_manipulation::text ORDER BY event_manipulation::text)
              INTO v105_triggers, v105_events
              FROM information_schema.triggers
             WHERE trigger_schema = 'astra_v105'
               AND trigger_name LIKE '%_append_only';
            IF v105_triggers <> 8 OR v105_events <> ARRAY['DELETE','UPDATE']::text[] THEN
              RAISE EXCEPTION 'V105 append-only trigger contract mismatch: triggers=% events=%',
                v105_triggers, v105_events;
            END IF;

            SELECT count(DISTINCT trigger_name),
                   array_agg(DISTINCT event_manipulation::text ORDER BY event_manipulation::text)
              INTO v106_triggers, v106_events
              FROM information_schema.triggers
             WHERE trigger_schema = 'astra_v106'
               AND trigger_name LIKE '%_append_only';
            IF v106_triggers <> 9 OR v106_events <> ARRAY['DELETE','UPDATE']::text[] THEN
              RAISE EXCEPTION 'V106 append-only trigger contract mismatch: triggers=% events=%',
                v106_triggers, v106_events;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'astra_v105' AND p.proname = 'claim_fleet_task' AND p.prosecdef
            ) THEN RAISE EXCEPTION 'V105 claim function SECURITY DEFINER contract missing'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'astra_v106' AND p.proname = 'claim_rollout_action' AND p.prosecdef
            ) THEN RAISE EXCEPTION 'V106 claim function SECURITY DEFINER contract missing'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.table_constraints
              WHERE constraint_schema = 'astra_v106'
                AND table_name = 'rollout_action_outbox'
                AND constraint_type = 'UNIQUE'
            ) THEN RAISE EXCEPTION 'V106 rollout idempotency uniqueness missing'; END IF;
          END
          $$;
          SQL

      - name: Verify local-only fail-closed deployment state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v105 = json.loads(Path("LIVE_EXECUTION_STATUS_V105.json").read_text(encoding="utf-8"))
          v106 = json.loads(Path("LIVE_EXECUTION_STATUS_V106.json").read_text(encoding="utf-8"))
          assert v105["status"] == "LOCAL_QUALIFICATION_ONLY"
          for key in (
              "external_kubernetes_fleet_verified",
              "external_s3_compatible_storage_verified",
              "external_postgresql_fleet_repository_verified",
              "production_autoscaling_actuator_verified",
              "production_identity_authority_verified",
              "external_order_routing_allowed",
              "live_trading_allowed",
          ):
              assert v105[key] is False, key
          assert v106["status"] == "LOCAL_QUALIFICATION_ONLY"
          for key in (
              "external_kubernetes_cluster_verified",
              "external_postgresql_repository_verified",
              "external_s3_compatible_storage_verified",
              "external_certificate_authority_verified",
              "external_disaster_recovery_restore_verified",
              "external_read_only_fleet_soak_verified",
              "kubernetes_mutations_allowed",
              "external_order_routing_allowed",
              "live_trading_allowed",
          ):
              assert v106[key] is False, key
          PY
