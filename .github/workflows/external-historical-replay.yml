name: external-historical-replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/replay_historical_signals.py'
      - 'tests/test_historical_signal_replay.py'
      - 'research/multisymbol_ohlcv_selection_v1.json'
      - 'research/cross_sectional_trading_quality_shadow_v2.json'
      - 'research/entry_quality_filter_shadow_v1.json'
      - 'research/selection_exit_confirmation_shadow_v1.json'
      - 'research/profit_runner_shadow_v1.json'
      - '.github/workflows/external-historical-replay.yml'
  workflow_run:
    workflows: ['external-multisymbol-ohlcv-selection']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: external-historical-replay-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Validate replay contract
        run: |
          ruff check --output-format=github \
            tools/replay_historical_signals.py \
            tests/test_historical_signal_replay.py
          pytest -q tests/test_historical_signal_replay.py
          python -m compileall -q tools/replay_historical_signals.py

      - name: Verify completed-session acquisition cutoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path('research/multisymbol_ohlcv_selection_v1.json').read_text(encoding='utf-8')
          )
          assert config['research_only'] is True
          assert config['strategy_promotion_allowed'] is False
          assert config['end'] == '2026-08-11T23:59:59Z'
          assert config['feed'] == 'iex'
          assert config['timeframe'] == '1Day'
          PY

      - name: Verify fail-closed execution state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('LIVE_EXECUTION_STATUS_V109.json').read_text(encoding='utf-8'))
          assert state['external_order_routing_allowed'] is False
          assert state['live_trading_allowed'] is False
          PY

  replay:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact upstream revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Download exact upstream acquisition artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-multisymbol-evidence
          gh run download "$UPSTREAM_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "external-multisymbol-ohlcv-${UPSTREAM_RUN_ID}" \
            --dir upstream-multisymbol-evidence
          test -f upstream-multisymbol-evidence/report.json

      - name: Classify upstream data readiness
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p historical-replay-evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          upstream = Path('upstream-multisymbol-evidence')
          report = json.loads((upstream / 'report.json').read_text(encoding='utf-8'))
          ready = report.get('qualification') == 'PASS_RESEARCH_DATA' and (upstream / 'bars.csv').is_file()
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
          if not ready:
              blocked = {
                  'schema_version': 'historical-signal-replay-evidence-v1',
                  'qualification': 'BLOCKED_UPSTREAM_MARKET_DATA',
                  'evidence_scope': 'OBSERVED_MARKET_HISTORY_REPLAY',
                  'upstream_run_id': os.environ['UPSTREAM_RUN_ID'],
                  'upstream_head_sha': os.environ['UPSTREAM_HEAD_SHA'],
                  'upstream_qualification': report.get('qualification'),
                  'shadow_only': True,
                  'strategy_promotion_allowed': False,
                  'paper_order_writes_enabled': False,
                  'external_order_routing_allowed': False,
                  'live_trading_allowed': False,
                  'real_paper_fills': False,
                  'reason_codes': ['UPSTREAM_ACQUISITION_DID_NOT_PRODUCE_BARS'],
              }
              Path('historical-replay-evidence/historical-replay-report.json').write_text(
                  json.dumps(blocked, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Install hash-locked replay graph
        if: steps.upstream.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Replay signal to fill to managed exit on exact acquired bars
        if: steps.upstream.outputs.ready == 'true'
        run: |
          python -m tools.replay_historical_signals \
            --csv upstream-multisymbol-evidence/bars.csv \
            --trading-quality-config research/cross_sectional_trading_quality_shadow_v2.json \
            --entry-quality-policy research/entry_quality_filter_shadow_v1.json \
            --selection-exit-policy research/selection_exit_confirmation_shadow_v1.json \
            --profit-runner-policy research/profit_runner_shadow_v1.json \
            --completed-through 2026-08-11 \
            --source-label ALPACA_IEX_READONLY \
            --output historical-replay-evidence/historical-replay-report.json \
            --trades-output historical-replay-evidence/historical-replay-trades.csv \
            --decisions-output historical-replay-evidence/historical-replay-decisions.csv

      - name: Enforce exact-source and fail-closed replay semantics
        if: steps.upstream.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          upstream_dir = Path('upstream-multisymbol-evidence')
          output_dir = Path('historical-replay-evidence')
          acquisition = json.loads((upstream_dir / 'report.json').read_text(encoding='utf-8'))
          replay = json.loads((output_dir / 'historical-replay-report.json').read_text(encoding='utf-8'))
          csv_sha = hashlib.sha256((upstream_dir / 'bars.csv').read_bytes()).hexdigest()

          assert acquisition['qualification'] == 'PASS_RESEARCH_DATA'
          assert acquisition['csv_sha256'] == csv_sha
          assert replay['qualification'] == 'PASS_HISTORICAL_REPLAY'
          assert replay['source_label'] == 'ALPACA_IEX_READONLY'
          assert replay['source_csv_sha256'] == csv_sha
          assert replay['symbols'] == acquisition['symbols']
          assert replay['completed_through'] == '2026-08-11'
          assert datetime.fromisoformat(replay['last_timestamp']).date().isoformat() <= '2026-08-11'
          assert replay['shadow_only'] is True
          assert replay['strategy_promotion_allowed'] is False
          assert replay['paper_order_writes_enabled'] is False
          assert replay['external_order_routing_allowed'] is False
          assert replay['live_trading_allowed'] is False
          assert replay['real_paper_fills'] is False
          assert replay['counterfactual_candidates_promoted'] is False
          assert set(replay['variants']) == {
              'CURRENT_COMBINED_SHADOW',
              'ENTRY_QUALITY_CANDIDATE',
              'SELECTION_EXIT_CONFIRMATION_CANDIDATE',
              'PROFIT_RUNNER_CANDIDATE',
          }
          for variant in replay['variants'].values():
              assert variant['no_lookahead_verified'] is True
              assert variant['trade_timestamps_verified'] is True
          assert (output_dir / 'historical-replay-trades.csv').is_file()
          assert (output_dir / 'historical-replay-decisions.csv').is_file()
          assert os.environ['UPSTREAM_HEAD_SHA']
          PY

      - name: Upload historical replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-historical-replay-${{ github.run_id }}
          path: historical-replay-evidence/*
          if-no-files-found: error
          retention-days: 30
