name: stable-core-quality

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
  pull_request:
    paths:
      - 'app/domain/**'
      - 'app/marketdata/**'
      - 'app/strategy/**'
      - 'app/risk/**'
      - 'app/portfolio/**'
      - 'app/oms/**'
      - 'app/application/**'
      - 'app/execution/**'
      - 'pyproject.toml'
      - '.github/workflows/stable-core-quality.yml'

permissions:
  contents: read

concurrency:
  group: stable-core-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install quality dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: Ruff stable product core
        run: ruff check app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution
      - name: Bandit stable product core
        run: bandit -q -r app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution
      - name: Audit third-party Python dependencies
        run: |
          python -m pip freeze --exclude astra-schema108-asymmetric-signing-authority > audit-requirements.txt
          pip-audit --strict -r audit-requirements.txt
      - name: Compile stable product core
        run: python -m compileall -q app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution
