name: stable-core-quality

on:
  push:
    branches: [main]
    paths:
      - 'app/domain/**'
      - 'app/marketdata/**'
      - 'app/strategy/**'
      - 'app/risk/**'
      - 'app/portfolio/**'
      - 'app/oms/**'
      - 'app/application/**'
      - 'app/execution/**'
      - 'app/observability/**'
      - 'pyproject.toml'
      - '.github/workflows/stable-core-quality.yml'
  pull_request:
    paths:
      - 'app/domain/**'
      - 'app/marketdata/**'
      - 'app/strategy/**'
      - 'app/risk/**'
      - 'app/portfolio/**'
      - 'app/oms/**'
      - 'app/application/**'
      - 'app/execution/**'
      - 'app/observability/**'
      - 'pyproject.toml'
      - '.github/workflows/stable-core-quality.yml'

permissions:
  contents: read

concurrency:
  group: stable-core-quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Install quality dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: Ruff stable product core
        run: ruff check app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution app/observability
      - name: Bandit stable product core
        run: bandit -q -r app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution app/observability
      - name: Audit third-party Python dependencies
        run: |
          python -m pip freeze --exclude astra-trade-bot > audit-requirements.txt
          pip-audit --strict -r audit-requirements.txt
      - name: Compile stable product core
        run: python -m compileall -q app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution app/observability
