name: release-integrity

on:
  push:
    branches: [agent/schema108-paper-core-foundation, main]
    paths:
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'tools/release_integrity.py'
      - 'tools/verify_lock_freshness.py'
      - 'tests/test_release_integrity.py'
      - 'tests/test_lock_freshness.py'
      - '.github/workflows/release-integrity.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'tools/release_integrity.py'
      - 'tools/verify_lock_freshness.py'
      - 'tests/test_release_integrity.py'
      - 'tests/test_lock_freshness.py'
      - '.github/workflows/release-integrity.yml'

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact hash-locked dependency graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Prove lock matches pyproject inputs
        run: |
          # pip-compile reads an existing output file as constraints. Seed the
          # generated lock from the qualified lock so this check detects stale
          # pyproject inputs without opportunistically upgrading transitive deps.
          cp requirements.lock requirements.generated.lock
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --no-header \
            --strip-extras \
            --extra test \
            --extra postgresql \
            --extra marketdata \
            --extra dev \
            pyproject.toml \
            --output-file requirements.generated.lock
          python -m tools.verify_lock_freshness \
            requirements.lock requirements.generated.lock
      - name: Audit locked dependencies
        run: pip-audit --strict -r requirements.lock
      - name: Release evidence and lock freshness unit tests
        run: pytest -q tests/test_release_integrity.py tests/test_lock_freshness.py
      - name: Full deterministic regression
        run: pytest -q
      - name: Build wheel and source distribution from locked toolchain
        run: python -m build --no-isolation --wheel --sdist
      - name: Generate SPDX SBOM and release manifest
        shell: bash
        run: |
          CREATED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          python -m tools.release_integrity \
            --root . \
            --lock requirements.lock \
            --dist dist \
            --output release-evidence \
            --commit-sha "$GITHUB_SHA" \
            --created-at "$CREATED_AT"
      - name: Validate release evidence safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('release-evidence/release-manifest.json').read_text())
          sbom = json.loads(Path('release-evidence/sbom.spdx.json').read_text())
          assert manifest['package']['name'] == 'astra-trade-bot'
          assert manifest['commit_sha'] == '${{ github.sha }}'
          assert manifest['external_order_routing_allowed'] is False
          assert manifest['live_trading_allowed'] is False
          assert manifest['locked_dependency_count'] > 0
          assert manifest['artifacts']
          assert sbom['spdxVersion'] == 'SPDX-2.3'
          assert sbom['packages']
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: release-integrity-${{ github.run_id }}
          path: |
            dist/*
            requirements.lock
            release-evidence/release-manifest.json
            release-evidence/sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
