name: per-asset-conditions-research

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/per_asset_conditions_lab.py'
      - 'tests/test_per_asset_conditions_lab.py'
      - '.github/workflows/per-asset-conditions-research.yml'
      - 'docs/ASTRA_INTEGRATION_MASTER_PLAN_2026-10-01.md'
      - 'docs/STRATEGY_EVIDENCE_LEARNING_LOG.md'

permissions:
  contents: read

jobs:
  all-arms-with-unchanged-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Ruff and negative regression
        run: |
          ruff check tools/per_asset_conditions_lab.py tests/test_per_asset_conditions_lab.py
          pytest -q tests/test_per_asset_conditions_lab.py
      - name: Run all arms on inspected data
        run: |
          mkdir -p per-asset-evidence
          python -m tools.per_asset_conditions_lab \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --output per-asset-evidence/all-arms.json
      - name: Fail closed on missing/control or alleged promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("per-asset-evidence/all-arms.json").read_text())
          assert len(p["experiments"]) == 12
          assert p["control"]["closed_trades"] == 256
          assert p["strategy_promotion_allowed"] is False
          assert p["live_trading_allowed"] is False
          assert p["untouched_holdout"] is False
          assert p["funding_modelled"] is False
          assert p["winner_selected"] is False
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: per-asset-conditions-${{ github.run_id }}
          path: per-asset-evidence/all-arms.json
          retention-days: 30
          if-no-files-found: error
