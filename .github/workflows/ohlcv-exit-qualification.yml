name: ohlcv-exit-qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/marketdata/ohlcv.py'
      - 'app/strategy/ohlcv_exit.py'
      - 'app/strategy/ohlcv_managed_backtest.py'
      - 'research/ohlcv_exit_contract_v1.json'
      - 'tools/qualify_ohlcv_exit_contract.py'
      - 'tests/test_ohlcv_exit.py'
      - 'tests/test_ohlcv_managed_backtest.py'
      - 'tests/test_ohlcv_exit_contract.py'
      - 'requirements.lock'
      - 'LIVE_EXECUTION_STATUS_V109.json'
      - '.github/workflows/ohlcv-exit-qualification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/marketdata/ohlcv.py'
      - 'app/strategy/ohlcv_exit.py'
      - 'app/strategy/ohlcv_managed_backtest.py'
      - 'research/ohlcv_exit_contract_v1.json'
      - 'tools/qualify_ohlcv_exit_contract.py'
      - 'tests/test_ohlcv_exit.py'
      - 'tests/test_ohlcv_managed_backtest.py'
      - 'tests/test_ohlcv_exit_contract.py'
      - 'requirements.lock'
      - 'LIVE_EXECUTION_STATUS_V109.json'
      - '.github/workflows/ohlcv-exit-qualification.yml'

permissions:
  contents: read

concurrency:
  group: ohlcv-exit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint OHLCV exit boundary
        run: >-
          ruff check --output-format=github
          app/strategy/ohlcv_exit.py
          app/strategy/ohlcv_managed_backtest.py
          tools/qualify_ohlcv_exit_contract.py
          tests/test_ohlcv_exit.py
          tests/test_ohlcv_managed_backtest.py
          tests/test_ohlcv_exit_contract.py

      - name: OHLCV intrabar and managed-backtest regressions
        run: >-
          pytest -q
          tests/test_ohlcv.py
          tests/test_ohlcv_exit.py
          tests/test_ohlcv_managed_backtest.py
          tests/test_ohlcv_exit_contract.py
          tests/test_position_management.py
          tests/test_regime_momentum.py
          tests/test_reentry_confirmation.py

      - name: Generate OHLCV exit contract evidence
        run: |
          mkdir -p ohlcv-exit-evidence
          python -m tools.qualify_ohlcv_exit_contract \
            --contract research/ohlcv_exit_contract_v1.json \
            --output ohlcv-exit-evidence/ohlcv-exit-contract-v1.json

      - name: Verify synthetic evidence cannot imply strategy promotion
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          evidence = json.loads(
              Path('ohlcv-exit-evidence/ohlcv-exit-contract-v1.json')
              .read_text(encoding='utf-8')
          )
          assert evidence['qualification'] == 'PASS_SYNTHETIC_CONTRACT'
          assert evidence['shadow_only'] is True
          assert evidence['strategy_promotion_allowed'] is False
          assert evidence['real_ohlcv_evidence'] is False
          assert evidence['multisymbol_portfolio_evidence'] is False
          blockers = set(evidence['promotion_blockers'])
          assert 'NO_REAL_OHLCV_EVIDENCE' in blockers
          assert 'NO_MULTISYMBOL_PORTFOLIO_BACKTEST' in blockers
          take = evidence['scenarios']['INTRABAR_TAKE_PROFIT']
          assert Decimal(take['net_pnl']) > 0
          ambiguous = evidence['scenarios'][
              'AMBIGUOUS_STOP_AND_TAKE_PROTECTIVE_FIRST'
          ]
          assert ambiguous['exit_reason'] == 'INTRABAR_HARD_STOP'
          assert ambiguous['ambiguous_intrabar_exit'] is True
          PY

      - name: Compile OHLCV exit boundary
        run: >-
          python -m compileall -q
          app/strategy/ohlcv_exit.py
          app/strategy/ohlcv_managed_backtest.py
          tools/qualify_ohlcv_exit_contract.py

      - name: Verify fail-closed live state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('LIVE_EXECUTION_STATUS_V109.json').read_text(encoding='utf-8'))
          assert state['external_order_routing_allowed'] is False
          assert state['live_trading_allowed'] is False
          PY

      - name: Upload OHLCV exit qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ohlcv-exit-${{ github.run_id }}
          path: ohlcv-exit-evidence/*.json
          if-no-files-found: error
          retention-days: 30
