name: schema100-alpaca-paper-sandbox

on:
  push:
    branches: ["agent/schema100-alpaca-paper-sandbox"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'pytest>=8,<10' 'coverage>=7,<8'
      - run: python -m pytest -q tests/test_alpaca_paper_adapter_v100.py tests/test_tools_v100.py
      - run: coverage run --branch -m pytest -q tests/test_alpaca_paper_adapter_v100.py tests/test_tools_v100.py
      - run: coverage report --include='app/runtime/alpaca_paper_adapter_v100.py' --fail-under=80
      - run: python -m tools.architecture_audit_v100 .
      - run: python -m tools.static_audit_v100 .
      - run: python -m tools.stress_v100 --iterations 1000 --workers 8
