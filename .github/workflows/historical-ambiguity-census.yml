name: historical-ambiguity-census

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/historical_ambiguity_census.py'
      - 'tests/test_historical_ambiguity_census.py'
      - 'docs/ASTRA_INTEGRATION_MASTER_PLAN_2026-10-01.md'
      - '.github/workflows/historical-ambiguity-census.yml'
      - 'research/snapshots/bybit_3y_2023-10-09_2026-10-08/**'

permissions:
  contents: read

concurrency:
  group: historical-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-collision-population:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact research SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked research dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Conservation tests and Ruff
        run: |
          ruff check tools/historical_ambiguity_census.py tests/test_historical_ambiguity_census.py
          pytest -q tests/test_historical_ambiguity_census.py
      - name: Enumerate all six-major ambiguity candidates
        run: |
          mkdir -p ambiguity-evidence
          python -m tools.historical_ambiguity_census \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --hourly-dir research/snapshots/bybit_intraday_trade_cases_60m \
            --universe six \
            --output ambiguity-evidence/six-major.json
      - name: Enumerate all broad-21 ambiguity candidates
        run: |
          python -m tools.historical_ambiguity_census \
            --bars-dir research/snapshots/bybit_3y_2023-10-09_2026-10-08 \
            --hourly-dir research/snapshots/bybit_intraday_trade_cases_60m \
            --universe broad \
            --output ambiguity-evidence/broad-21.json
      - name: Ensure full population and non-promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name, n in (("six-major", 17), ("broad-21", 24)):
              r = json.loads(Path(f"ambiguity-evidence/{name}.json").read_text())
              assert r["research_only"] is True
              assert r["intraday_replay_performed"] is False
              assert r["strategy_promotion_allowed"] is False
              assert r["live_trading_allowed"] is False
              assert r["ambiguity_sample"]["cases"] == n
              assert len(r["cases"]) == n
              assert r["original_portfolio"]["all_ambiguous_closed_trades"] == n
          PY
      - name: Upload entire six and broad historical collision census
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ambiguity-full-census-${{ github.run_id }}
          path: ambiguity-evidence/*.json
          if-no-files-found: error
          retention-days: 30
