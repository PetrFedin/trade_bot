name: research-operations-console

on:
  push:
    branches: [feat/research-ops-console-20261022]
    paths:
      - 'tools/research_analytics.py'
      - 'tools/research_ops_console.py'
      - 'tools/research_ops_console.template.html'
      - 'tests/test_research_analytics.py'
      - 'tests/test_research_ops_console.py'
      - 'tests/research_ops_console_browser.test.cjs'
      - 'docs/research-ops-console.html'
      - 'research/competitive_capability_register_v1.json'
      - '.github/workflows/research-operations-console.yml'
  pull_request:
    branches: [research/signed-signal-capability-gates-20261020]
    paths:
      - 'tools/research_analytics.py'
      - 'tools/research_ops_console.py'
      - 'tools/research_ops_console.template.html'
      - 'tests/test_research_analytics.py'
      - 'tests/test_research_ops_console.py'
      - 'tests/research_ops_console_browser.test.cjs'
      - 'docs/research-ops-console.html'
      - 'research/competitive_capability_register_v1.json'
      - '.github/workflows/research-operations-console.yml'

permissions:
  contents: read

concurrency:
  group: research-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-analytics-and-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Static and behavioral verification
        run: |
          set -euo pipefail
          ruff check tools/research_analytics.py tools/research_ops_console.py tests/test_research_analytics.py tests/test_research_ops_console.py
          pytest -q tests/test_research_analytics.py tests/test_research_ops_console.py tests/test_research_signal_gate.py tests/test_research_capability_register.py tests/test_status_dashboard.py
          node --version
          node --test tests/research_ops_console_browser.test.cjs
      - name: Immutable source-to-screen qualification
        run: |
          set -euo pipefail
          python -m tools.research_capability_register --check
          python -m tools.research_ops_console --check
          mkdir -p research-console-evidence
          python -m tools.research_ops_console --write --output research-console-evidence/index.html
          sha256sum research-console-evidence/index.html > research-console-evidence/index.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.research_analytics import calculate_research_overview
          status=json.loads(Path("CURRENT_SYSTEM_STATUS.json").read_text())
          registry=json.loads(Path("research/competitive_capability_register_v1.json").read_text())
          overview=calculate_research_overview(status,registry,evidence_root=Path("."))
          assert overview["trading_authority_allowed"] is False
          assert overview["profitability_proven"] is False
          assert overview["net_pnl_usdt"] == "-176.67"
          assert overview["capability_summary"]["feature_count"] == 12
          print("ASTRA_EVIDENCE_BOUND_UI", overview["schema_version"], overview["authority"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-research-console-${{ github.run_id }}
          path: research-console-evidence/
          if-no-files-found: warn
          retention-days: 30
