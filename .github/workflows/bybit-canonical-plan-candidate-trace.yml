name: bybit-canonical-plan-candidate-trace

on:
  pull_request:
    paths:
      - 'app/strategy/crypto_position_selection.py'
      - 'app/strategy/crypto_plan_candidate_trace.py'
      - 'tests/test_crypto_plan_candidate_trace.py'
      - '.github/workflows/bybit-canonical-plan-candidate-trace.yml'
  push:
    branches:
      - agent/bybit-canonical-plan-candidate-trace
    paths:
      - 'app/strategy/crypto_position_selection.py'
      - 'app/strategy/crypto_plan_candidate_trace.py'
      - 'tests/test_crypto_plan_candidate_trace.py'
      - '.github/workflows/bybit-canonical-plan-candidate-trace.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Test immutable candidate trace
        run: pytest -q tests/test_crypto_plan_candidate_trace.py

      - name: Lint candidate trace boundary
        run: >-
          ruff check --output-format=github
          app/strategy/crypto_position_selection.py
          app/strategy/crypto_plan_candidate_trace.py
          tests/test_crypto_plan_candidate_trace.py

      - name: Security scan candidate trace boundary
        run: >-
          bandit -q
          app/strategy/crypto_plan_candidate_trace.py

      - name: Compile candidate trace boundary
        run: >-
          python -m compileall -q
          app/strategy/crypto_position_selection.py
          app/strategy/crypto_plan_candidate_trace.py
