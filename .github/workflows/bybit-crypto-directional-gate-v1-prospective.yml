name: bybit-crypto-directional-gate-v1-prospective

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/strategy/crypto_perp.py'
      - 'research/bybit_crypto_directional_gate_v1_policy.json'
      - 'tools/qualify_bybit_crypto_directional_gate_v1.py'
      - 'tests/test_crypto_entry_side_policy.py'
      - 'tests/test_bybit_crypto_directional_gate_v1.py'
      - '.github/workflows/bybit-crypto-directional-gate-v1-prospective.yml'
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/strategy/crypto_perp.py'
      - 'research/bybit_crypto_directional_gate_v1_policy.json'
      - 'tools/qualify_bybit_crypto_directional_gate_v1.py'
      - 'tests/test_crypto_entry_side_policy.py'
      - 'tests/test_bybit_crypto_directional_gate_v1.py'
      - '.github/workflows/bybit-crypto-directional-gate-v1-prospective.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-crypto-directional-gate-v1-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint prospective directional surface
        run: >-
          ruff check --output-format=github
          app/strategy/crypto_perp.py
          tools/qualify_bybit_crypto_directional_gate_v1.py
          tests/test_crypto_entry_side_policy.py
          tests/test_bybit_crypto_directional_gate_v1.py

      - name: Test prospective directional contract
        run: >-
          pytest -vv
          tests/test_crypto_entry_side_policy.py
          tests/test_bybit_crypto_directional_gate_v1.py

      - name: Compile prospective directional boundary
        run: >-
          python -m compileall -q
          app/strategy/crypto_perp.py
          tools/qualify_bybit_crypto_directional_gate_v1.py

  evidence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Evaluate fixed prospective window
        run: |
          mkdir -p artifacts/bybit-directional-gate-v1
          PYTHONPATH=. python tools/qualify_bybit_crypto_directional_gate_v1.py \
            --output artifacts/bybit-directional-gate-v1/report.json

      - name: Enforce no same-sample activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('artifacts/bybit-directional-gate-v1/report.json').read_text()
          )
          assert report['discovery_evidence_may_validate_candidate'] is False
          assert report['automatic_strategy_activation_allowed'] is False
          assert report['strategy_promotion_allowed'] is False
          assert report['demo_observation_automatic_activation_allowed'] is False
          assert report['bybit_live_order_routing_allowed'] is False
          if report['qualification'] == 'HOLD_INSUFFICIENT_PROSPECTIVE_DAYS':
              assert report['available_completed_utc_days'] < report['required_completed_utc_days']
              assert report['source'] == 'NO_MARKET_ACQUISITION_BEFORE_FIXED_WINDOW_IS_COMPLETE'
          else:
              assert report['qualification'] == 'CRYPTO_DIRECTIONAL_GATE_V1_PROSPECTIVE_WALK_FORWARD'
              assert report['fixed_prospective_window'] is True
              assert report['validation_dates'][0] == '2026-08-17'
              assert report['validation_dates'][-1] == '2026-09-13'
              decision = report['directional_gate_decision']
              assert decision['automatic_strategy_activation_allowed'] is False
              assert decision['strategy_promotion_allowed'] is False
              assert report['candidate_change_contract']['only_directional_entry_filter_differs'] is True
          print('BYBIT_DIRECTIONAL_GATE_V1_BOUNDARY=' + json.dumps(report, sort_keys=True))
          PY

      - name: Upload prospective directional evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-directional-gate-v1-${{ github.run_id }}
          path: artifacts/bybit-directional-gate-v1
          if-no-files-found: error
          retention-days: 45
