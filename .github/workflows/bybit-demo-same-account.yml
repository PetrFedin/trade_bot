name: bybit-demo-same-account

on:
  pull_request:
    paths:
      - 'app/execution/bybit_demo_same_account.py'
      - 'app/execution/bybit_demo_activation_readiness.py'
      - 'app/execution/bybit_demo_operational_release_account_binding.py'
      - 'tools/probe_bybit_demo_same_account.py'
      - 'tools/assemble_bybit_demo_activation_readiness.py'
      - 'tools/assemble_bybit_demo_operational_release_evidence.py'
      - 'tools/run_bybit_demo_operator_approved_entry.py'
      - 'tools/run_bybit_demo_persistent_supervisor.py'
      - 'tests/test_bybit_demo_same_account.py'
      - 'tests/test_probe_bybit_demo_same_account.py'
      - 'tests/test_bybit_demo_same_account_operational_wiring.py'
      - 'tests/test_bybit_demo_activation_readiness.py'
      - 'tests/test_bybit_demo_operational_release_account_binding.py'
      - 'tests/test_bybit_demo_operational_entry_cli.py'
      - 'tests/test_bybit_demo_persistent_supervisor_cli.py'
      - 'docs/BYBIT_DEMO_SAME_ACCOUNT_GATE.md'
      - 'docs/BYBIT_DEMO_ACTIVATION_READINESS.md'
      - '.github/workflows/bybit-demo-same-account.yml'
      - '.github/workflows/bybit-demo-activation-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_same_account.py'
      - 'app/execution/bybit_demo_activation_readiness.py'
      - 'app/execution/bybit_demo_operational_release_account_binding.py'
      - 'tools/probe_bybit_demo_same_account.py'
      - 'tools/assemble_bybit_demo_activation_readiness.py'
      - 'tools/assemble_bybit_demo_operational_release_evidence.py'
      - 'tools/run_bybit_demo_operator_approved_entry.py'
      - 'tools/run_bybit_demo_persistent_supervisor.py'
      - 'tests/test_bybit_demo_same_account.py'
      - 'tests/test_probe_bybit_demo_same_account.py'
      - 'tests/test_bybit_demo_same_account_operational_wiring.py'
      - 'tests/test_bybit_demo_activation_readiness.py'
      - 'tests/test_bybit_demo_operational_release_account_binding.py'
      - 'tests/test_bybit_demo_operational_entry_cli.py'
      - 'tests/test_bybit_demo_persistent_supervisor_cli.py'
      - 'docs/BYBIT_DEMO_SAME_ACCOUNT_GATE.md'
      - 'docs/BYBIT_DEMO_ACTIVATION_READINESS.md'
      - '.github/workflows/bybit-demo-same-account.yml'
      - '.github/workflows/bybit-demo-activation-readiness.yml'

permissions:
  contents: read

concurrency:
  group: bybit-demo-same-account-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: Same-account safety and operational wiring proof
        run: |
          pytest -q \
            tests/test_bybit_demo_same_account.py \
            tests/test_probe_bybit_demo_same_account.py \
            tests/test_bybit_demo_same_account_operational_wiring.py \
            tests/test_bybit_demo_activation_readiness.py \
            tests/test_bybit_demo_operational_release_account_binding.py \
            tests/test_bybit_demo_operational_entry_cli.py \
            tests/test_bybit_demo_persistent_supervisor_cli.py
      - name: Full deterministic regression
        run: pytest -q
      - name: Ruff same-account operational boundary
        run: |
          ruff check \
            app/execution/bybit_demo_same_account.py \
            app/execution/bybit_demo_activation_readiness.py \
            app/execution/bybit_demo_operational_release_account_binding.py \
            tools/probe_bybit_demo_same_account.py \
            tools/assemble_bybit_demo_activation_readiness.py \
            tools/assemble_bybit_demo_operational_release_evidence.py \
            tools/run_bybit_demo_operator_approved_entry.py \
            tools/run_bybit_demo_persistent_supervisor.py \
            tests/test_bybit_demo_same_account.py \
            tests/test_probe_bybit_demo_same_account.py \
            tests/test_bybit_demo_same_account_operational_wiring.py \
            tests/test_bybit_demo_activation_readiness.py \
            tests/test_bybit_demo_operational_release_account_binding.py
      - name: Bandit same-account operational boundary
        run: |
          bandit -q \
            app/execution/bybit_demo_same_account.py \
            app/execution/bybit_demo_activation_readiness.py \
            app/execution/bybit_demo_operational_release_account_binding.py \
            tools/probe_bybit_demo_same_account.py \
            tools/assemble_bybit_demo_activation_readiness.py \
            tools/assemble_bybit_demo_operational_release_evidence.py \
            tools/run_bybit_demo_operator_approved_entry.py \
            tools/run_bybit_demo_persistent_supervisor.py
      - name: Compile same-account operational boundary
        run: |
          python -m compileall -q \
            app/execution/bybit_demo_same_account.py \
            app/execution/bybit_demo_activation_readiness.py \
            app/execution/bybit_demo_operational_release_account_binding.py \
            tools/probe_bybit_demo_same_account.py \
            tools/assemble_bybit_demo_activation_readiness.py \
            tools/assemble_bybit_demo_operational_release_evidence.py \
            tools/run_bybit_demo_operator_approved_entry.py \
            tools/run_bybit_demo_persistent_supervisor.py
