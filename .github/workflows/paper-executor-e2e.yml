name: paper-executor-e2e

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths:
      - 'app/execution/**'
      - 'app/oms/**'
      - 'app/application/order_lifecycle.py'
      - 'tests/test_paper_executor_e2e.py'
      - '.github/workflows/paper-executor-e2e.yml'
  pull_request:
    paths:
      - 'app/execution/**'
      - 'app/oms/**'
      - 'app/application/order_lifecycle.py'
      - 'tests/test_paper_executor_e2e.py'
      - '.github/workflows/paper-executor-e2e.yml'

permissions:
  contents: read

concurrency:
  group: paper-executor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: At-most-once paper executor E2E
        run: pytest -q tests/test_paper_executor_e2e.py
      - name: Durable OMS regression
        run: pytest -q tests/test_durable_oms_e2e.py
      - name: Full regression
        run: pytest -q
      - name: Compile execution boundary
        run: python -m compileall -q app/execution app/oms app/application
