name: bybit-mainnet-readonly-ranking-context

on:
  pull_request:
    paths:
      - 'app/strategy/crypto_readonly_account_context.py'
      - 'app/strategy/crypto_readonly_account_postgres.py'
      - 'tools/refresh_bybit_mainnet_readonly_evidence_registry.py'
      - 'migrations/v115/001_bybit_mainnet_readonly_ranking_context.sql'
      - 'tests/test_crypto_readonly_account_context.py'
      - 'tests/test_crypto_readonly_account_postgres.py'
      - 'tests/test_refresh_bybit_mainnet_readonly_evidence_registry.py'
      - 'docs/BYBIT_MAINNET_READONLY_RANKING_CONTEXT.md'
      - '.github/workflows/bybit-mainnet-readonly-ranking-context.yml'
  push:
    branches: [main]
    paths:
      - 'app/strategy/crypto_readonly_account_context.py'
      - 'app/strategy/crypto_readonly_account_postgres.py'
      - 'tools/refresh_bybit_mainnet_readonly_evidence_registry.py'
      - 'migrations/v115/001_bybit_mainnet_readonly_ranking_context.sql'
      - 'tests/test_crypto_readonly_account_context.py'
      - 'tests/test_crypto_readonly_account_postgres.py'
      - 'tests/test_refresh_bybit_mainnet_readonly_evidence_registry.py'
      - 'docs/BYBIT_MAINNET_READONLY_RANKING_CONTEXT.md'
      - '.github/workflows/bybit-mainnet-readonly-ranking-context.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-mainnet-readonly-ranking-context-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: Mainnet read-only account-aware ranking tests
        run: |
          pytest -q \
            tests/test_crypto_readonly_account_context.py \
            tests/test_crypto_readonly_account_postgres.py \
            tests/test_refresh_bybit_mainnet_readonly_evidence_registry.py \
            tests/test_bybit_mainnet_readonly.py \
            tests/test_bybit_mainnet_readonly_config_isolation.py \
            tests/test_bybit_mainnet_readonly_identity_fail_closed.py \
            tests/test_bybit_mainnet_readonly_ip_binding.py \
            tests/test_crypto_live_evidence_ranking.py \
            tests/test_refresh_bybit_live_evidence_registry.py
      - name: Ruff mainnet read-only account-aware ranking
        run: |
          ruff check \
            app/strategy/crypto_readonly_account_context.py \
            app/strategy/crypto_readonly_account_postgres.py \
            tools/refresh_bybit_mainnet_readonly_evidence_registry.py \
            tests/test_crypto_readonly_account_context.py \
            tests/test_crypto_readonly_account_postgres.py \
            tests/test_refresh_bybit_mainnet_readonly_evidence_registry.py
      - name: Bandit mainnet read-only account-aware ranking
        run: |
          bandit -q \
            app/strategy/crypto_readonly_account_context.py \
            app/strategy/crypto_readonly_account_postgres.py \
            tools/refresh_bybit_mainnet_readonly_evidence_registry.py
      - name: Compile mainnet read-only account-aware ranking
        run: |
          python -m compileall -q \
            app/strategy/crypto_readonly_account_context.py \
            app/strategy/crypto_readonly_account_postgres.py \
            tools/refresh_bybit_mainnet_readonly_evidence_registry.py
