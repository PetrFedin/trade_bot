name: operational-readiness

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths:
      - 'app/observability/**'
      - 'app/risk/**'
      - 'app/oms/**'
      - 'app/portfolio/**'
      - 'tests/test_operational_readiness.py'
      - '.github/workflows/operational-readiness.yml'
  pull_request:
    paths:
      - 'app/observability/**'
      - 'app/risk/**'
      - 'app/oms/**'
      - 'app/portfolio/**'
      - 'tests/test_operational_readiness.py'
      - '.github/workflows/operational-readiness.yml'

permissions:
  contents: read

concurrency:
  group: operational-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Operational health and SLO gate
        run: pytest -q tests/test_operational_readiness.py
      - name: Risk and reconciliation regression
        run: pytest -q tests/test_risk_marketdata.py tests/test_durable_oms_e2e.py
      - name: Compile operational boundary
        run: python -m compileall -q app/observability app/risk app/oms app/portfolio
