name: operational-readiness

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths:
      - 'app/observability/**'
      - 'app/execution/bybit_demo_session_risk_ledger.py'
      - 'app/risk/**'
      - 'app/oms/**'
      - 'app/portfolio/**'
      - 'tests/test_operational_readiness.py'
      - 'tests/test_bybit_runtime_health.py'
      - 'tests/test_bybit_demo_session_risk_ledger.py'
      - '.github/workflows/operational-readiness.yml'
  pull_request:
    paths:
      - 'app/observability/**'
      - 'app/execution/bybit_demo_session_risk_ledger.py'
      - 'app/risk/**'
      - 'app/oms/**'
      - 'app/portfolio/**'
      - 'tests/test_operational_readiness.py'
      - 'tests/test_bybit_runtime_health.py'
      - 'tests/test_bybit_demo_session_risk_ledger.py'
      - '.github/workflows/operational-readiness.yml'

permissions:
  contents: read

concurrency:
  group: operational-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Operational health and Bybit accounting SLO gate
        run: >-
          pytest -q
          tests/test_operational_readiness.py
          tests/test_bybit_runtime_health.py
          tests/test_bybit_demo_session_risk_ledger.py
      - name: Risk and reconciliation regression
        run: pytest -q tests/test_risk_marketdata.py tests/test_durable_oms_e2e.py
      - name: Compile operational boundary
        run: python -m compileall -q app/observability app/risk app/oms app/portfolio app/execution/bybit_demo_session_risk_ledger.py
