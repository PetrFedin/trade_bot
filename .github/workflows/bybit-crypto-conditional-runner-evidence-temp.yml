name: bybit-crypto-conditional-runner-evidence-temp

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - '.github/workflows/bybit-crypto-conditional-runner-evidence-temp.yml'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-conditional-runner-evidence-temp-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked replay graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Replay seven completed Bybit UTC days
        run: |
          set -o pipefail
          mkdir -p artifacts/bybit-conditional-runner/trades
          PYTHONPATH=. python tools/replay_bybit_crypto_archive.py \
            --symbols 'BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT' \
            --lookback-days 7 \
            --opening-equity 1000 \
            --targets 15,20,25 \
            --output artifacts/bybit-conditional-runner/report-raw.json \
            --trades-dir artifacts/bybit-conditional-runner/trades

      - name: Normalize and score evidence
        run: |
          PYTHONPATH=. python tools/normalize_bybit_crypto_replay.py \
            --input artifacts/bybit-conditional-runner/report-raw.json \
            --output artifacts/bybit-conditional-runner/report.json
          PYTHONPATH=. python tools/evaluate_bybit_crypto_replay.py \
            --input artifacts/bybit-conditional-runner/report.json \
            --output artifacts/bybit-conditional-runner/evidence-scorecard.json

      - name: Assert safety contract and print comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/bybit-conditional-runner/report.json').read_text())
          score = json.loads(Path('artifacts/bybit-conditional-runner/evidence-scorecard.json').read_text())
          unconditional = report['strategy_shadow_candidates']['MIN_20_NET_EDGE_OPEN_ENDED_RUNNER']
          conditional = report['strategy_shadow_candidates']['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X']
          conditional_score = score['strategy_shadow_candidates']['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X']
          assert conditional['minimum_entry_net_profit_usd'] == 20.0
          assert conditional['runner_activation_net_profit_usd'] == 20.0
          assert conditional['runner_initial_protected_net_profit_usd'] == 15.0
          assert conditional['runner_minimum_expected_edge_multiple'] == 1.5
          assert conditional['profit_cap_net_profit_usd'] == 'CONDITIONAL_BY_TRADE'
          assert conditional['fixed_take_profit_enabled'] is True
          assert conditional['protected_15_is_guaranteed_realized_pnl'] is False
          assert conditional['strategy_promotion_allowed'] is False
          assert conditional['bybit_demo_order_writes_enabled'] is False
          assert conditional['bybit_live_order_routing_allowed'] is False
          assert conditional_score['strategy_promotion_allowed'] is False
          assert conditional_score['demo_order_writes_allowed'] is False
          assert conditional_score['live_promotion_allowed'] is False
          summary = {
              'archive_dates': report['archive_dates'],
              'symbols': report['symbols'],
              'fixed_20': report['variants']['TARGET_20_USD']['metrics'],
              'fixed_25': report['variants']['TARGET_25_USD']['metrics'],
              'unconditional_runner': {
                  'metrics': unconditional['metrics'],
                  'runner_selected_trade_count': unconditional['runner_selected_trade_count'],
                  'runner_activation_event_count': unconditional['runner_activation_event_count'],
              },
              'conditional_runner_1_5x': {
                  'metrics': conditional['metrics'],
                  'runner_selected_trade_count': conditional['runner_selected_trade_count'],
                  'fixed_target_selected_trade_count': conditional['fixed_target_selected_trade_count'],
                  'runner_activation_event_count': conditional['runner_activation_event_count'],
                  'protection_quality': conditional['protection_quality'],
                  'evidence': conditional_score,
              },
          }
          print('BYBIT_CONDITIONAL_RUNNER_EVIDENCE=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload one-shot conditional runner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-conditional-runner-evidence-${{ github.run_id }}
          path: artifacts/bybit-conditional-runner
          if-no-files-found: error
          retention-days: 30
