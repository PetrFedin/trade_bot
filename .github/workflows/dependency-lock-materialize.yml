name: dependency-lock-materialize

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/dependency-lock-materialize.yml'

permissions:
  contents: write

concurrency:
  group: dependency-lock-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/schema108-paper-core-foundation
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Generate deterministic hash-locked dependency graph
        run: |
          python -m pip install --disable-pip-version-check 'pip-tools>=7.5,<8'
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --no-header \
            --strip-extras \
            --extra test \
            --extra postgresql \
            --extra marketdata \
            --extra dev \
            pyproject.toml \
            --output-file requirements.lock
      - name: Verify lock installs exactly
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Audit locked dependency graph
        run: pip-audit --strict -r requirements.lock
      - name: Regression under locked graph
        run: pytest -q
      - name: Commit qualified lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.lock
          if git diff --cached --quiet; then
            echo 'Dependency lock already current'
            exit 0
          fi
          git commit -m 'Lock audited product dependencies'
          git push origin HEAD:agent/schema108-paper-core-foundation
