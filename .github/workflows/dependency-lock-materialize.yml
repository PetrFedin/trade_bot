name: dependency-lock-materialize

on:
  push:
    branches: [fix/p0-pip-pysec-2026-3721]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/dependency-lock-materialize.yml'

permissions:
  contents: write

concurrency:
  group: dependency-lock-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Generate selective compatibility lock update
        run: |
          cp requirements.lock requirements.before.lock
          python -m pip install --disable-pip-version-check 'pip-tools==7.6.1'
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --no-header \
            --strip-extras \
            --upgrade-package pip \
            --upgrade-package pip-tools \
            --extra test \
            --extra postgresql \
            --extra marketdata \
            --extra dev \
            pyproject.toml \
            --output-file requirements.lock
      - name: Prove only pip compatibility pins changed
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def pins(path: str) -> dict[str, str]:
              result: dict[str, str] = {}
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  match = re.match(r'^([A-Za-z0-9_.-]+)==([^ \\]+)', line)
                  if match:
                      result[match.group(1).lower()] = match.group(2)
              return result

          before = pins('requirements.before.lock')
          after = pins('requirements.lock')
          assert set(before) == set(after), (set(before) ^ set(after))
          changed = {name: (before[name], after[name]) for name in before if before[name] != after[name]}
          assert changed == {
              'pip': ('26.1.2', '26.2.1'),
              'pip-tools': ('7.6.0', '7.6.1'),
          }, changed
          PY
      - name: Verify lock installs exactly
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Prove selective lock is stable
        run: |
          cp requirements.lock requirements.recompiled.lock
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --no-header \
            --strip-extras \
            --extra test \
            --extra postgresql \
            --extra marketdata \
            --extra dev \
            pyproject.toml \
            --output-file requirements.recompiled.lock
          python -m tools.verify_lock_freshness requirements.lock requirements.recompiled.lock
      - name: Audit locked dependency graph
        run: pip-audit --strict -r requirements.lock
      - name: Regression under locked graph
        run: pytest -q
      - name: Commit qualified lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.lock
          if git diff --cached --quiet; then
            echo 'Dependency lock already current'
            exit 0
          fi
          git commit -m 'Lock fixed pip toolchain'
          git push origin HEAD:${{ github.ref_name }}
