name: stable-core-security-fix

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
    paths:
      - '.github/workflows/stable-core-security-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/schema108-paper-core-foundation
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Replace runtime asserts with explicit invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path('app/oms/store.py')
          text = store.read_text(encoding='utf-8')
          text = text.replace(
              '        assert created is not None\n        return created\n',
              '        if created is None:\n'
              '            raise RuntimeError("OMS persistence invariant violated")\n'
              '        return created\n',
          )
          text = text.replace(
              '        assert result is not None\n        return result\n',
              '        if result is None:\n'
              '            raise RuntimeError("OMS persistence invariant violated")\n'
              '        return result\n',
          )
          store.write_text(text, encoding='utf-8')

          postgres = Path('app/oms/postgres.py')
          text = postgres.read_text(encoding='utf-8')
          text = text.replace(
              '        assert psycopg is not None and dict_row is not None\n'
              '        return psycopg.connect(self.dsn, row_factory=dict_row, autocommit=False)\n',
              '        if psycopg is None or dict_row is None:\n'
              '            raise RuntimeError("PostgreSQL dependency is unavailable")\n'
              '        return psycopg.connect(self.dsn, row_factory=dict_row, autocommit=False)\n',
          )
          postgres.write_text(text, encoding='utf-8')
          PY
      - name: Install audited dependency set
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: Ruff
        run: ruff check app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution app/observability
      - name: Bandit
        run: bandit -q -r app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution app/observability
      - name: Dependency vulnerability audit
        run: |
          python -m pip freeze --exclude astra-schema108-asymmetric-signing-authority > audit-requirements.txt
          pip-audit --strict -r audit-requirements.txt
      - name: Full regression
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app/domain app/marketdata app/strategy app/risk app/portfolio app/oms app/application app/execution app/observability
      - name: Commit qualified OMS invariants
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/oms/store.py app/oms/postgres.py
          if git diff --cached --quiet; then
            echo 'No OMS invariant patch required'
            exit 0
          fi
          git commit -m 'Replace OMS runtime asserts with fail-closed checks'
          git push origin HEAD:agent/schema108-paper-core-foundation
