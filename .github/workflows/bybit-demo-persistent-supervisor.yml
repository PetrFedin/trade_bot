name: bybit-demo-persistent-supervisor

on:
  pull_request:
    paths:
      - 'app/execution/bybit_demo_approved_runtime.py'
      - 'app/execution/bybit_demo_managed_trade_poll.py'
      - 'app/execution/bybit_demo_persistent_supervisor.py'
      - 'app/execution/bybit_demo_session_risk_flatten.py'
      - 'app/execution/bybit_demo_session_risk_runtime.py'
      - 'app/marketdata/bybit_demo_instruments.py'
      - 'tools/run_bybit_demo_persistent_supervisor.py'
      - 'tests/test_bybit_demo_instruments.py'
      - 'tests/test_bybit_demo_managed_trade_session_risk.py'
      - 'tests/test_bybit_demo_persistent_supervisor.py'
      - 'tests/test_bybit_demo_persistent_supervisor_cli.py'
      - 'tests/test_bybit_demo_session_risk_flatten.py'
      - 'tests/test_bybit_demo_session_risk_runtime_postgres.py'
      - 'docs/BYBIT_DEMO_PERSISTENT_SUPERVISOR.md'
      - '.github/workflows/bybit-demo-persistent-supervisor.yml'
  push:
    branches:
      - main
      - agent/bybit-demo-persistent-worker
    paths:
      - 'app/execution/bybit_demo_approved_runtime.py'
      - 'app/execution/bybit_demo_managed_trade_poll.py'
      - 'app/execution/bybit_demo_persistent_supervisor.py'
      - 'app/execution/bybit_demo_session_risk_flatten.py'
      - 'app/execution/bybit_demo_session_risk_runtime.py'
      - 'app/marketdata/bybit_demo_instruments.py'
      - 'tools/run_bybit_demo_persistent_supervisor.py'
      - 'tests/test_bybit_demo_instruments.py'
      - 'tests/test_bybit_demo_managed_trade_session_risk.py'
      - 'tests/test_bybit_demo_persistent_supervisor.py'
      - 'tests/test_bybit_demo_persistent_supervisor_cli.py'
      - 'tests/test_bybit_demo_session_risk_flatten.py'
      - 'tests/test_bybit_demo_session_risk_runtime_postgres.py'
      - 'docs/BYBIT_DEMO_PERSISTENT_SUPERVISOR.md'
      - '.github/workflows/bybit-demo-persistent-supervisor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-demo-persistent-supervisor-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra_demo_persistent_supervisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_demo_persistent_supervisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev,postgresql]'
          python -m pip check
      - name: Persistent supervisor and session-risk proof
        env:
          ASTRA_DEMO_RUNTIME_SESSION_RISK_TEST_DSN: postgresql://astra:astra@localhost:5432/astra_demo_persistent_supervisor
        run: |
          pytest -q \
            tests/test_bybit_demo_instruments.py \
            tests/test_bybit_demo_managed_trade_session_risk.py \
            tests/test_bybit_demo_persistent_supervisor.py \
            tests/test_bybit_demo_persistent_supervisor_cli.py \
            tests/test_bybit_demo_session_risk_flatten.py \
            tests/test_bybit_demo_session_risk_runtime_postgres.py \
            tests/test_bybit_demo_approved_runtime.py \
            tests/test_bybit_demo_trading_runtime.py \
            tests/test_bybit_demo_terminal_handoff.py
      - name: Full regression without PostgreSQL singleton test variables
        run: pytest -q
      - name: Ruff persistent supervisor and execution boundary
        run: |
          ruff check app/execution app/marketdata \
            tools/run_bybit_demo_persistent_supervisor.py \
            tests/test_bybit_demo_instruments.py \
            tests/test_bybit_demo_managed_trade_session_risk.py \
            tests/test_bybit_demo_persistent_supervisor.py \
            tests/test_bybit_demo_persistent_supervisor_cli.py \
            tests/test_bybit_demo_session_risk_flatten.py \
            tests/test_bybit_demo_session_risk_runtime_postgres.py
      - name: Bandit persistent supervisor and execution boundary
        run: bandit -q -r app/execution app/marketdata tools/run_bybit_demo_persistent_supervisor.py
      - name: Compile persistent supervisor and execution boundary
        run: |
          python -m compileall -q app/execution app/marketdata \
            tools/run_bybit_demo_persistent_supervisor.py

  operational-one-cycle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, bybit-demo]
    environment: bybit-demo
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install operational dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[postgresql]'
          python -m pip check
      - name: Run one protected persistent-management cycle
        env:
          BYBIT_DEMO_DATABASE_DSN: ${{ secrets.BYBIT_DEMO_DATABASE_DSN }}
          BYBIT_DEMO_TRADING_API_KEY: ${{ secrets.BYBIT_DEMO_TRADING_API_KEY }}
          BYBIT_DEMO_TRADING_API_SECRET: ${{ secrets.BYBIT_DEMO_TRADING_API_SECRET }}
          BYBIT_DEMO_READONLY_API_KEY: ${{ secrets.BYBIT_DEMO_READONLY_API_KEY }}
          BYBIT_DEMO_READONLY_API_SECRET: ${{ secrets.BYBIT_DEMO_READONLY_API_SECRET }}
          BYBIT_MAINNET_READONLY_API_KEY_SHA256: ${{ secrets.BYBIT_MAINNET_READONLY_API_KEY_SHA256 }}
        run: |
          mkdir -p artifacts
          python -m tools.run_bybit_demo_persistent_supervisor \
            --mode once \
            --output artifacts/bybit-demo-persistent-supervisor.json
      - name: Bind supervisor to protected operational DB and Demo account
        env:
          BYBIT_DEMO_ZONE_BINDING_SECRET: ${{ secrets.BYBIT_DEMO_ZONE_BINDING_SECRET }}
          BYBIT_DEMO_DATABASE_DSN: ${{ secrets.BYBIT_DEMO_DATABASE_DSN }}
          BYBIT_DEMO_READONLY_API_KEY: ${{ secrets.BYBIT_DEMO_READONLY_API_KEY }}
          BYBIT_DEMO_READONLY_API_SECRET: ${{ secrets.BYBIT_DEMO_READONLY_API_SECRET }}
        run: |
          python -m tools.probe_bybit_demo_operational_zone_binding \
            --producer supervisor \
            --git-sha "$GITHUB_SHA" \
            --include-demo-account \
            --output artifacts/bybit-demo-operational-zone-binding.json
      - name: Upload sanitized supervisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-demo-persistent-supervisor-${{ github.run_id }}
          path: |
            artifacts/bybit-demo-persistent-supervisor.json
            artifacts/bybit-demo-operational-zone-binding.json
          if-no-files-found: error
          retention-days: 30
