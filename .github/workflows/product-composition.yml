name: product-composition

on:
  push:
    branches: [main]
    paths:
      - 'app/application/**'
      - 'app/execution/**'
      - 'app/oms/**'
      - 'app/risk/**'
      - 'app/portfolio/**'
      - 'app/observability/**'
      - 'app/strategy/**'
      - 'tests/test_composition_root.py'
      - 'tests/test_postgres_composition_root.py'
      - 'tests/test_trade_fill_accounting.py'
      - 'tests/test_trade_update_processor.py'
      - 'tests/test_portfolio_event_conflicts.py'
      - 'tests/test_postgres_portfolio_event_conflicts.py'
      - '.github/workflows/product-composition.yml'
  pull_request:
    paths:
      - 'app/application/**'
      - 'app/execution/**'
      - 'app/oms/**'
      - 'app/risk/**'
      - 'app/portfolio/**'
      - 'app/observability/**'
      - 'app/strategy/**'
      - 'tests/test_composition_root.py'
      - 'tests/test_postgres_composition_root.py'
      - 'tests/test_trade_fill_accounting.py'
      - 'tests/test_trade_update_processor.py'
      - 'tests/test_portfolio_event_conflicts.py'
      - 'tests/test_postgres_portfolio_event_conflicts.py'
      - '.github/workflows/product-composition.yml'

permissions:
  contents: read

concurrency:
  group: product-composition-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRA_TEST_POSTGRES_DSN: postgresql://astra:astra@127.0.0.1:5432/astra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install product dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[test,postgresql]'
          python -m pip check
      - name: Local composition root and exact fill accounting
        run: >-
          pytest -q
          tests/test_composition_root.py
          tests/test_trade_fill_accounting.py
          tests/test_trade_update_processor.py
          tests/test_portfolio_event_conflicts.py
      - name: PostgreSQL composition root, restart, and idempotency conflicts
        run: >-
          pytest -q
          tests/test_postgres_composition_root.py
          tests/test_postgres_portfolio_event_conflicts.py
      - name: Core persistence parity regression
        run: >-
          pytest -q
          tests/test_durable_oms_e2e.py
          tests/test_risk_evidence.py
          tests/test_portfolio_durability.py
      - name: Compile product graph
        run: >-
          python -m compileall -q
          app/application app/execution app/oms app/risk app/portfolio
          app/observability app/strategy
