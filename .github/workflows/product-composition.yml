name: product-composition

on:
  push:
    branches: [main]
    paths:
      - 'app/application/**'
      - 'app/execution/**'
      - 'app/oms/**'
      - 'app/risk/**'
      - 'app/portfolio/**'
      - 'app/observability/**'
      - 'app/strategy/**'
      - 'app/runtime/bybit_product_service.py'
      - 'tools/bybit_product.py'
      - 'migrations/product/**'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'tests/test_composition_root.py'
      - 'tests/test_postgres_composition_root.py'
      - 'tests/test_trade_fill_accounting.py'
      - 'tests/test_trade_update_processor.py'
      - 'tests/test_fill_backfill.py'
      - 'tests/test_portfolio_event_conflicts.py'
      - 'tests/test_postgres_portfolio_event_conflicts.py'
      - 'tests/test_paper_cycle_e2e.py'
      - 'tests/test_bybit_product_service.py'
      - 'tests/test_bybit_product_stream_gate.py'
      - 'tests/test_bybit_product_composition.py'
      - 'tests/test_bybit_product_cli.py'
      - 'tests/test_bybit_cash_cli.py'
      - 'tests/test_bybit_demo_account_reader.py'
      - 'tests/test_bybit_demo_cash_reconciliation.py'
      - '.github/workflows/product-composition.yml'
  pull_request:
    paths:
      - 'app/application/**'
      - 'app/execution/**'
      - 'app/oms/**'
      - 'app/risk/**'
      - 'app/portfolio/**'
      - 'app/observability/**'
      - 'app/strategy/**'
      - 'app/runtime/bybit_product_service.py'
      - 'tools/bybit_product.py'
      - 'migrations/product/**'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'tests/test_composition_root.py'
      - 'tests/test_postgres_composition_root.py'
      - 'tests/test_trade_fill_accounting.py'
      - 'tests/test_trade_update_processor.py'
      - 'tests/test_fill_backfill.py'
      - 'tests/test_portfolio_event_conflicts.py'
      - 'tests/test_postgres_portfolio_event_conflicts.py'
      - 'tests/test_paper_cycle_e2e.py'
      - 'tests/test_bybit_product_service.py'
      - 'tests/test_bybit_product_stream_gate.py'
      - 'tests/test_bybit_product_composition.py'
      - 'tests/test_bybit_product_cli.py'
      - 'tests/test_bybit_cash_cli.py'
      - 'tests/test_bybit_demo_account_reader.py'
      - 'tests/test_bybit_demo_cash_reconciliation.py'
      - '.github/workflows/product-composition.yml'

permissions:
  contents: read

concurrency:
  group: product-composition-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRA_TEST_POSTGRES_DSN: postgresql://astra:astra@127.0.0.1:5432/astra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked product dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Local composition, Bybit controls/accounting, and bounded paper cycle
        run: >-
          pytest -q
          tests/test_composition_root.py
          tests/test_trade_fill_accounting.py
          tests/test_trade_update_processor.py
          tests/test_fill_backfill.py
          tests/test_portfolio_event_conflicts.py
          tests/test_paper_cycle_e2e.py
          tests/test_bybit_product_service.py
          tests/test_bybit_product_stream_gate.py
          tests/test_bybit_product_composition.py
          tests/test_bybit_product_cli.py
          tests/test_bybit_cash_cli.py
          tests/test_bybit_demo_account_reader.py
          tests/test_bybit_demo_cash_reconciliation.py
      - name: PostgreSQL composition, mutation journal, restart, and idempotency conflicts
        run: >-
          pytest -q
          tests/test_postgres_composition_root.py
          tests/test_postgres_portfolio_event_conflicts.py
      - name: Core persistence and risk parity regression
        run: >-
          pytest -q
          tests/test_durable_oms_e2e.py
          tests/test_risk_evidence.py
          tests/test_portfolio_durability.py
          tests/test_risk_marketdata.py
      - name: Compile product graph
        run: >-
          python -m compileall -q
          app/application app/execution app/oms app/risk app/portfolio
          app/observability app/strategy app/runtime/bybit_product_service.py tools/bybit_product.py
