name: status-source-of-truth

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

concurrency:
  group: status-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }} # v7.0.1, Node 24

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"

      - name: Verify generated status artifacts
        run: python tools/system_status.py --check

      - name: Verify status contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v tests/test_system_status.py

      # system_status.py validates the status surface against sources that all live in
      # this repository, so a gate stays advertised as "next" after its issue is closed.
      # This step is the only one that consults the tracker.
      - name: Verify the declared vertical gate is still open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/status_tracker_sync.py

      # The operator console is generated from the same status surface, so it cannot
      # drift from what it reports. A hand edit fails here.
      - name: Verify the generated operator console
        run: |
          python tools/status_dashboard.py --write
          git diff --exit-code -- docs/status-console.html
