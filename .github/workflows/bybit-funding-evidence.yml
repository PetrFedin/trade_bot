name: bybit-funding-evidence

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/marketdata/bybit_funding.py'
      - 'app/strategy/crypto_funding_impact.py'
      - 'tools/acquire_bybit_funding_history.py'
      - 'tests/test_bybit_funding.py'
      - 'tests/test_crypto_funding_impact.py'
      - 'tests/test_acquire_bybit_funding_history.py'
      - '.github/workflows/bybit-funding-evidence.yml'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Completed UTC days of funding history'
        required: false
        default: '14'

permissions:
  contents: read

concurrency:
  group: bybit-funding-evidence-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint funding evidence surface
        run: >-
          ruff check --output-format=github
          app/marketdata/bybit_funding.py
          app/strategy/crypto_funding_impact.py
          tools/acquire_bybit_funding_history.py
          tests/test_bybit_funding.py
          tests/test_crypto_funding_impact.py
          tests/test_acquire_bybit_funding_history.py

      - name: Test funding evidence contract
        run: >-
          pytest -vv
          tests/test_bybit_funding.py
          tests/test_crypto_funding_impact.py
          tests/test_acquire_bybit_funding_history.py

      - name: Compile funding evidence boundary
        run: >-
          python -m compileall -q
          app/marketdata/bybit_funding.py
          app/strategy/crypto_funding_impact.py
          tools/acquire_bybit_funding_history.py

  external-read:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Acquire public funding history
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          mkdir -p artifacts/bybit-funding
          PYTHONPATH=. python tools/acquire_bybit_funding_history.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT \
            --lookback-days "$LOOKBACK_DAYS" \
            --output artifacts/bybit-funding/funding-history.json

      - name: Enforce funding evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/bybit-funding/funding-history.json').read_text())
          assert report['qualification'] in {
              'PASS_BYBIT_FUNDING_HISTORY_ACQUISITION',
              'BLOCKED_BYBIT_FUNDING_EXTERNAL_ACCESS',
          }
          assert report['mark_price_evidence_included'] is False
          assert report['funding_usdt_impact_calculated'] is False
          assert report['strategy_promotion_allowed'] is False
          assert report['demo_activation_allowed'] is False
          assert report['live_activation_allowed'] is False
          assert report['bybit_live_order_routing_allowed'] is False
          PY

      - name: Upload funding evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-funding-evidence-${{ github.run_id }}
          path: artifacts/bybit-funding
          if-no-files-found: warn
          retention-days: 30
