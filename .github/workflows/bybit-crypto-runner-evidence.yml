name: bybit-crypto-runner-evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/strategy/crypto_correlation.py'
      - 'app/strategy/crypto_execution_risk.py'
      - 'app/strategy/crypto_profit_runner.py'
      - 'app/strategy/crypto_runner_admission.py'
      - 'app/strategy/crypto_session_risk.py'
      - 'app/strategy/crypto_trade_management.py'
      - 'tools/replay_bybit_crypto_runner.py'
      - 'tools/replay_bybit_crypto_archive.py'
      - 'tools/normalize_bybit_crypto_replay.py'
      - 'tools/evaluate_bybit_crypto_replay.py'
      - 'tools/audit_bybit_crypto_runner_opportunity.py'
      - 'tests/test_bybit_crypto_runner_replay.py'
      - 'tests/test_audit_bybit_crypto_runner_opportunity.py'
      - 'tests/test_crypto_correlation.py'
      - 'tests/test_crypto_execution_risk.py'
      - 'tests/test_crypto_execution_risk_replay.py'
      - '.github/workflows/bybit-crypto-runner-evidence.yml'
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/strategy/crypto_correlation.py'
      - 'app/strategy/crypto_execution_risk.py'
      - 'app/strategy/crypto_profit_runner.py'
      - 'app/strategy/crypto_runner_admission.py'
      - 'app/strategy/crypto_session_risk.py'
      - 'app/strategy/crypto_trade_management.py'
      - 'tools/replay_bybit_crypto_runner.py'
      - 'tools/replay_bybit_crypto_archive.py'
      - 'tools/normalize_bybit_crypto_replay.py'
      - 'tools/evaluate_bybit_crypto_replay.py'
      - 'tools/audit_bybit_crypto_runner_opportunity.py'
      - 'tests/test_bybit_crypto_runner_replay.py'
      - 'tests/test_audit_bybit_crypto_runner_opportunity.py'
      - 'tests/test_crypto_correlation.py'
      - 'tests/test_crypto_execution_risk.py'
      - 'tests/test_crypto_execution_risk_replay.py'
      - '.github/workflows/bybit-crypto-runner-evidence.yml'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Completed Bybit UTC archive days'
        required: false
        default: '7'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-runner-evidence-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint runner evidence surface
        run: >-
          ruff check --output-format=github
          app/strategy/crypto_correlation.py
          app/strategy/crypto_execution_risk.py
          app/strategy/crypto_profit_runner.py
          app/strategy/crypto_runner_admission.py
          app/strategy/crypto_session_risk.py
          app/strategy/crypto_trade_management.py
          tools/replay_bybit_crypto_runner.py
          tools/replay_bybit_crypto_archive.py
          tools/normalize_bybit_crypto_replay.py
          tools/evaluate_bybit_crypto_replay.py
          tools/audit_bybit_crypto_runner_opportunity.py
          tests/test_bybit_crypto_runner_replay.py
          tests/test_audit_bybit_crypto_runner_opportunity.py
          tests/test_crypto_correlation.py
          tests/test_crypto_execution_risk.py
          tests/test_crypto_execution_risk_replay.py

      - name: Test runner replay contract
        run: >-
          pytest -vv
          tests/test_bybit_crypto_runner_replay.py
          tests/test_audit_bybit_crypto_runner_opportunity.py
          tests/test_crypto_correlation.py
          tests/test_crypto_execution_risk.py
          tests/test_crypto_execution_risk_replay.py
          tests/test_crypto_replay_quality.py
          tests/test_crypto_protection_quality.py
          tests/test_evaluate_bybit_crypto_replay.py

      - name: Compile runner boundary
        run: >-
          python -m compileall -q
          app/strategy/crypto_correlation.py
          app/strategy/crypto_execution_risk.py
          app/strategy/crypto_profit_runner.py
          app/strategy/crypto_runner_admission.py
          app/strategy/crypto_session_risk.py
          app/strategy/crypto_trade_management.py
          tools/replay_bybit_crypto_runner.py
          tools/replay_bybit_crypto_archive.py
          tools/normalize_bybit_crypto_replay.py
          tools/evaluate_bybit_crypto_replay.py
          tools/audit_bybit_crypto_runner_opportunity.py

  archive-replay:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Replay official Bybit archive
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: |
          mkdir -p artifacts/bybit-runner/trades
          PYTHONPATH=. python tools/replay_bybit_crypto_archive.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT \
            --lookback-days "$LOOKBACK_DAYS" \
            --opening-equity 1000 \
            --targets 15,20,25 \
            --output artifacts/bybit-runner/report-raw.json \
            --trades-dir artifacts/bybit-runner/trades

      - name: Normalize replay evidence
        run: |
          PYTHONPATH=. python tools/normalize_bybit_crypto_replay.py \
            --input artifacts/bybit-runner/report-raw.json \
            --output artifacts/bybit-runner/report.json

      - name: Score replay evidence
        run: |
          PYTHONPATH=. python tools/evaluate_bybit_crypto_replay.py \
            --input artifacts/bybit-runner/report.json \
            --output artifacts/bybit-runner/evidence-scorecard.json

      - name: Audit frozen runner admission opportunity
        run: |
          PYTHONPATH=. python tools/audit_bybit_crypto_runner_opportunity.py \
            --input artifacts/bybit-runner/report.json \
            --output artifacts/bybit-runner/runner-opportunity.json

      - name: Enforce runner research boundary and print comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/bybit-runner/report.json').read_text())
          score = json.loads(Path('artifacts/bybit-runner/evidence-scorecard.json').read_text())
          opportunity = json.loads(
              Path('artifacts/bybit-runner/runner-opportunity.json').read_text()
          )
          candidates = report['strategy_shadow_candidates']
          score_candidates = score['strategy_shadow_candidates']
          runner = candidates['MIN_20_NET_EDGE_OPEN_ENDED_RUNNER']
          conditional = candidates['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_1_5X']
          session_risk = candidates['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_SESSION_RISK']
          diversified = candidates['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_DIVERSIFIED']
          execution_risk = candidates['MIN_20_NET_EDGE_CONDITIONAL_RUNNER_EXECUTION_RISK']
          combined_name = 'MIN_20_NET_EDGE_CONDITIONAL_RUNNER_COMBINED_RISK'
          combined_opportunity = opportunity['candidates'][combined_name]

          assert runner['minimum_entry_net_profit_usd'] == 20.0
          assert runner['runner_activation_net_profit_usd'] == 20.0
          assert runner['runner_initial_protected_net_profit_usd'] == 15.0
          assert runner['profit_cap_net_profit_usd'] is None
          assert runner['fixed_take_profit_enabled'] is False
          assert runner['unconditional_runner_shadow_explicitly_enabled'] is True
          assert runner['protected_15_is_guaranteed_realized_pnl'] is False

          assert conditional['runner_minimum_expected_edge_multiple'] == 1.5
          assert conditional['unconditional_runner_shadow_explicitly_enabled'] is False
          assert session_risk['session_risk']['enabled'] is True
          assert diversified['correlation_diversification']['enabled'] is True
          assert execution_risk['execution_risk']['enabled'] is True
          assert execution_risk['metrics']['risk_budget_breach_count'] == 0

          assert opportunity['runner_threshold_retuning_allowed'] is False
          assert opportunity['automatic_runner_activation_allowed'] is False
          assert opportunity['strategy_promotion_allowed'] is False
          assert opportunity['live_promotion_allowed'] is False
          assert combined_opportunity['fixed_target_post_exit_path_is_censored'] is True
          assert combined_opportunity['fixed_target_mfe_may_validate_runner_counterfactual'] is False
          assert combined_opportunity['runner_threshold_retuning_allowed'] is False
          assert combined_opportunity['automatic_runner_activation_allowed'] is False

          for name, candidate in candidates.items():
              assert candidate['strategy_promotion_allowed'] is False, name
              assert candidate['bybit_demo_order_writes_enabled'] is False, name
              assert candidate['bybit_live_order_routing_allowed'] is False, name
              assert score_candidates[name]['live_promotion_allowed'] is False, name

          summary = {
              'archive_dates': report['archive_dates'],
              'symbols': report['symbols'],
              'fixed_20': report['variants']['TARGET_20_USD']['metrics'],
              'fixed_25': report['variants']['TARGET_25_USD']['metrics'],
              'unconditional_runner': runner['metrics'],
              'conditional_runner': conditional['metrics'],
              'session_risk_runner': {
                  'metrics': session_risk['metrics'],
                  'session_risk': session_risk['session_risk'],
              },
              'diversified_runner': {
                  'metrics': diversified['metrics'],
                  'correlation_diversification': diversified['correlation_diversification'],
              },
              'execution_risk_runner': {
                  'metrics': execution_risk['metrics'],
                  'execution_risk': execution_risk['execution_risk'],
              },
              'combined_runner_opportunity': combined_opportunity,
          }
          print('BYBIT_RUNNER_COMPARISON=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload runner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-open-ended-runner-${{ github.run_id }}
          path: artifacts/bybit-runner
          if-no-files-found: error
          retention-days: 30
