name: cross-sectional-portfolio-qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/strategy/cross_sectional_portfolio.py'
      - 'app/strategy/cross_sectional_selection.py'
      - 'app/strategy/ohlcv_exit.py'
      - 'research/cross_sectional_portfolio_shadow_v1.json'
      - 'tools/qualify_cross_sectional_portfolio_shadow.py'
      - 'tests/test_cross_sectional_portfolio.py'
      - 'tests/test_cross_sectional_portfolio_contract.py'
      - 'requirements.lock'
      - 'LIVE_EXECUTION_STATUS_V109.json'
      - '.github/workflows/cross-sectional-portfolio-qualification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/strategy/cross_sectional_portfolio.py'
      - 'app/strategy/cross_sectional_selection.py'
      - 'app/strategy/ohlcv_exit.py'
      - 'research/cross_sectional_portfolio_shadow_v1.json'
      - 'tools/qualify_cross_sectional_portfolio_shadow.py'
      - 'tests/test_cross_sectional_portfolio.py'
      - 'tests/test_cross_sectional_portfolio_contract.py'
      - 'requirements.lock'
      - 'LIVE_EXECUTION_STATUS_V109.json'
      - '.github/workflows/cross-sectional-portfolio-qualification.yml'

permissions:
  contents: read

concurrency:
  group: cross-sectional-portfolio-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint cross-sectional portfolio surface
        run: >-
          ruff check --output-format=github
          app/strategy/cross_sectional_portfolio.py
          tools/qualify_cross_sectional_portfolio_shadow.py
          tests/test_cross_sectional_portfolio.py
          tests/test_cross_sectional_portfolio_contract.py

      - name: Portfolio selection, exit, and re-entry regressions
        run: >-
          pytest -q
          tests/test_cross_sectional_selection.py
          tests/test_cross_sectional_portfolio.py
          tests/test_cross_sectional_portfolio_contract.py
          tests/test_ohlcv_exit.py
          tests/test_position_management.py
          tests/test_reentry_confirmation.py

      - name: Generate synthetic portfolio contract evidence
        run: |
          mkdir -p cross-sectional-portfolio-evidence
          python -m tools.qualify_cross_sectional_portfolio_shadow \
            --policy research/cross_sectional_portfolio_shadow_v1.json \
            --output cross-sectional-portfolio-evidence/portfolio-shadow-v1.json

      - name: Verify portfolio evidence cannot imply strategy promotion
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          evidence = json.loads(
              Path('cross-sectional-portfolio-evidence/portfolio-shadow-v1.json')
              .read_text(encoding='utf-8')
          )
          assert evidence['qualification'] == 'PASS_SYNTHETIC_PORTFOLIO_CONTRACT'
          assert evidence['shadow_only'] is True
          assert evidence['strategy_promotion_allowed'] is False
          assert evidence['real_multisymbol_ohlcv_evidence'] is False
          assert evidence['walk_forward_portfolio_benchmark_evidence'] is False
          assert evidence['external_paper_portfolio_evidence'] is False
          blockers = set(evidence['promotion_blockers'])
          assert 'NO_REAL_MULTISYMBOL_OHLCV_EVIDENCE' in blockers
          assert 'NO_WALK_FORWARD_PORTFOLIO_BENCHMARK' in blockers
          bounded = evidence['scenarios']['TOP_K_BOUNDED_EXPOSURE']
          assert bounded['maximum_concurrent_positions'] <= 2
          assert Decimal(
              bounded['maximum_gross_exposure_fraction_observed']
          ) <= Decimal('0.60')
          stopped = evidence['scenarios'][
              'SYMBOL_SPECIFIC_INTRABAR_STOP_REENTRY_DELAY'
          ]
          assert stopped['one_bar_reentry_count'] == 0
          rotated = evidence['scenarios']['NEXT_OPEN_SELECTION_ROTATION']
          assert rotated['decision_trace'][1]['selected_symbols'] == ['MSFT', 'NVDA']
          PY

      - name: Compile portfolio research boundary
        run: >-
          python -m compileall -q
          app/strategy/cross_sectional_portfolio.py
          tools/qualify_cross_sectional_portfolio_shadow.py

      - name: Verify fail-closed live state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('LIVE_EXECUTION_STATUS_V109.json').read_text(encoding='utf-8'))
          assert state['external_order_routing_allowed'] is False
          assert state['live_trading_allowed'] is False
          PY

      - name: Upload portfolio qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-sectional-portfolio-${{ github.run_id }}
          path: cross-sectional-portfolio-evidence/*.json
          if-no-files-found: error
          retention-days: 30
