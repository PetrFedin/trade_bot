name: bybit-signal-first-touch-pattern-audit

on:
  pull_request:
    paths:
      - 'app/strategy/crypto_signal_first_touch_audit.py'
      - 'tools/audit_bybit_crypto_signal_first_touch.py'
      - 'tests/test_crypto_signal_first_touch_audit.py'
      - '.github/workflows/bybit-signal-first-touch-pattern-audit.yml'
  push:
    branches:
      - agent/bybit-signal-first-touch-pattern-audit
    paths:
      - 'app/strategy/crypto_signal_first_touch_audit.py'
      - 'tools/audit_bybit_crypto_signal_first_touch.py'
      - 'tests/test_crypto_signal_first_touch_audit.py'
      - '.github/workflows/bybit-signal-first-touch-pattern-audit.yml'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Completed Bybit UTC archive days'
        required: false
        default: '14'
      symbols:
        description: 'Frozen comma-separated USDT perpetual symbols'
        required: false
        default: 'BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT'

permissions:
  contents: read

concurrency:
  group: bybit-signal-first-touch-pattern-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Test signal first-touch audit
        run: pytest -q tests/test_crypto_signal_first_touch_audit.py

      - name: Lint signal first-touch boundary
        run: >-
          ruff check --output-format=github --ignore E501
          app/strategy/crypto_signal_first_touch_audit.py
          tools/audit_bybit_crypto_signal_first_touch.py
          tests/test_crypto_signal_first_touch_audit.py

      - name: Security scan signal first-touch boundary
        run: >-
          bandit -q
          app/strategy/crypto_signal_first_touch_audit.py
          tools/audit_bybit_crypto_signal_first_touch.py

      - name: Compile signal first-touch boundary
        run: >-
          python -m compileall -q
          app/strategy/crypto_signal_first_touch_audit.py
          tools/audit_bybit_crypto_signal_first_touch.py

  real-market-first-touch:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Audit first target/stop touch on completed Bybit archives
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
          SYMBOLS: ${{ inputs.symbols || 'BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT' }}
        run: |
          set -o pipefail
          mkdir -p artifacts/bybit-signal-first-touch
          PYTHONPATH=. python tools/audit_bybit_crypto_signal_first_touch.py \
            --symbols "$SYMBOLS" \
            --lookback-days "$LOOKBACK_DAYS" \
            --reference-equity 1000 \
            --horizon-minutes 240 \
            --minimum-pattern-observations 5 \
            --sample-sufficient-observations 30 \
            --minimum-cross-symbol-count 2 \
            --archive-workers 4 \
            --output artifacts/bybit-signal-first-touch/report.json \
            2>&1 | tee artifacts/bybit-signal-first-touch/run.log

      - name: Upload signal first-touch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-signal-first-touch-14d-${{ github.run_id }}
          path: artifacts/bybit-signal-first-touch
          if-no-files-found: error
          retention-days: 30
