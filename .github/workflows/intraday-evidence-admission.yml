name: intraday-evidence-admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/intraday_evidence_admission.py'
      - 'tests/test_intraday_evidence_admission.py'
      - '.github/workflows/intraday-evidence-admission.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - run: |
          ruff check tools/intraday_evidence_admission.py tests/test_intraday_evidence_admission.py
          pytest -q tests/test_intraday_evidence_admission.py
