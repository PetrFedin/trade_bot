name: paper-candidate-shadow-qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/application/paper_candidate_shadow.py'
      - 'app/application/paper_quality_cycle.py'
      - 'app/strategy/entry_quality.py'
      - 'app/strategy/selection_exit_confirmation.py'
      - 'tests/test_paper_candidate_shadow.py'
      - 'tests/test_paper_candidate_shadow_cycle.py'
      - '.github/workflows/paper-candidate-shadow-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'app/application/paper_candidate_shadow.py'
      - 'app/application/paper_quality_cycle.py'
      - 'app/strategy/entry_quality.py'
      - 'app/strategy/selection_exit_confirmation.py'
      - 'tests/test_paper_candidate_shadow.py'
      - 'tests/test_paper_candidate_shadow_cycle.py'
      - '.github/workflows/paper-candidate-shadow-qualification.yml'

permissions:
  contents: read

concurrency:
  group: paper-candidate-shadow-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint paper candidate shadow surface
        run: >-
          ruff check --output-format=github
          app/application/paper_candidate_shadow.py
          app/application/paper_quality_cycle.py
          tests/test_paper_candidate_shadow.py
          tests/test_paper_candidate_shadow_cycle.py

      - name: Paper candidate shadow regressions
        shell: bash
        run: |
          set -o pipefail
          pytest -vv \
            tests/test_paper_candidate_shadow.py \
            tests/test_paper_candidate_shadow_cycle.py \
            tests/test_paper_quality_cycle.py \
            2>&1 | tee paper-candidate-shadow-pytest.txt

      - name: Upload paper candidate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paper-candidate-shadow-${{ github.run_id }}
          path: paper-candidate-shadow-pytest.txt
          if-no-files-found: warn
          retention-days: 30
