name: bybit-crypto-position-selection-audit

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/strategy/crypto_position_selection.py'
      - 'tools/audit_bybit_crypto_position_selection.py'
      - 'tests/test_crypto_position_selection.py'
      - 'tests/test_audit_bybit_crypto_position_selection.py'
      - '.github/workflows/bybit-crypto-position-selection-audit.yml'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Completed UTC Bybit archive days; minimum 14'
        required: false
        default: '14'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-position-selection-audit-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint position-selection audit
        run: >-
          ruff check --output-format=github
          app/strategy/crypto_position_selection.py
          tools/audit_bybit_crypto_position_selection.py
          tests/test_crypto_position_selection.py
          tests/test_audit_bybit_crypto_position_selection.py

      - name: Test position-selection ranking contracts
        run: >-
          pytest -vv
          tests/test_crypto_position_selection.py
          tests/test_audit_bybit_crypto_position_selection.py

      - name: Compile position-selection boundary
        run: >-
          python -m compileall -q
          app/strategy/crypto_position_selection.py
          tools/audit_bybit_crypto_position_selection.py

  archive-audit-14d:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Enforce audit window
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          if ! [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]] || [ "$LOOKBACK_DAYS" -lt 14 ]; then
            echo 'position-selection audit requires at least 14 completed UTC days' >&2
            exit 1
          fi

      - name: Audit official Bybit archive snapshots
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          mkdir -p artifacts/bybit-position-selection
          PYTHONPATH=. python tools/audit_bybit_crypto_position_selection.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT \
            --lookback-days "$LOOKBACK_DAYS" \
            --equity 1000 \
            --output artifacts/bybit-position-selection/audit.json

      - name: Enforce audit-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('artifacts/bybit-position-selection/audit.json').read_text())
          assert audit['qualification'] == 'BYBIT_CRYPTO_POSITION_SELECTION_AUDIT'
          assert len(audit['archive_dates']) >= 14
          assert audit['archive_completed_utc_days_only'] is True
          assert audit['realized_pnl_compared'] is False
          assert audit['strategy_selection_allowed'] is False
          assert audit['strategy_promotion_allowed'] is False
          assert audit['demo_activation_allowed'] is False
          assert audit['live_activation_allowed'] is False
          PY

      - name: Upload selection audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-position-selection-${{ github.run_id }}
          path: artifacts/bybit-position-selection
          if-no-files-found: warn
          retention-days: 30
