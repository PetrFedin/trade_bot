name: schema109-qualified-materializer-v2

on:
  push:
    branches:
      - agent/schema109-clean-materialize-20260809
    paths:
      - tools/schema109_qualified_materializer.py
      - .github/workflows/schema109-qualified-materializer-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schema109-qualified-materializer-v2
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/schema109-remote-signer-attestation-clean
  EXPECTED_BASE: f9d2f693437b3b8e9994fa02adeb13059ed6f7cb
  ASTRA_TEST_POSTGRES_DSN: postgresql://astra:astra-ci@127.0.0.1:5432/astra
  PGPASSWORD: astra-ci

jobs:
  qualify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra-ci
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Compile staging materializer helper
        run: python -m py_compile tools/schema109_qualified_materializer.py

      - name: Verify and extract hash-locked source payload
        run: |
          python tools/schema109_qualified_materializer.py extract \
            --payload-dir _schema109_final_payload \
            --overlay schema109-qualified-overlay

      - name: Verify clean target base and create isolated worktree
        run: |
          git fetch origin "$TARGET_BRANCH"
          ACTUAL_BASE="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$ACTUAL_BASE" = "$EXPECTED_BASE" || {
            echo "target branch moved: expected $EXPECTED_BASE actual $ACTUAL_BASE" >&2
            exit 1
          }
          git worktree add --detach /tmp/schema109-qualified-target "$EXPECTED_BASE"
          cp -a schema109-qualified-overlay/. /tmp/schema109-qualified-target/

      - name: Install exact qualification surface
        working-directory: /tmp/schema109-qualified-target
        run: |
          python -m pip install --disable-pip-version-check ".[test,postgresql,dev]"
          python -m pip check

      - name: Apply deterministic Ruff normalization and approved refactors
        working-directory: /tmp/schema109-qualified-target
        run: |
          paths=(
            app/runtime/postgres_remote_signer_repository_v109.py
            app/runtime/remote_signer_attestation_v109.py
            tools/architecture_audit_v109.py
            tools/platform_v109.py
            tools/static_audit_v109.py
            tools/stress_v109.py
            tools/platform_v108.py
            tools/architecture_audit_v108.py
            tools/product_identity.py
            tests/test_postgres_remote_signer_repository_unit_v109.py
            tests/test_postgres_remote_signer_repository_v109.py
            tests/test_remote_signer_attestation_v109.py
            tests/test_tools_v109.py
            tests/test_product_identity.py
          )
          ruff check --fix "${paths[@]}" || true
          ruff format "${paths[@]}"
          python "$GITHUB_WORKSPACE/tools/schema109_qualified_materializer.py" normalize --root .
          python "$GITHUB_WORKSPACE/tools/schema109_qualified_materializer.py" sync-identity --root .
          ruff check "${paths[@]}"
          git diff --check

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Apply Schema 109 migration twice
        working-directory: /tmp/schema109-qualified-target
        run: |
          for pass in 1 2; do
            psql --host=127.0.0.1 --port=5432 --username=astra --dbname=astra \
              --set=ON_ERROR_STOP=1 --file=migrations/v109/001_remote_signer_attestation.sql
          done

      - name: Focused Schema 109 tests with PostgreSQL
        working-directory: /tmp/schema109-qualified-target
        run: pytest -q tests/*v109.py tests/test_product_identity.py

      - name: Complete stacked regression
        working-directory: /tmp/schema109-qualified-target
        run: pytest -q

      - name: Exact branch-aware Schema 109 coverage
        working-directory: /tmp/schema109-qualified-target
        run: |
          coverage erase
          coverage run --branch --include='app/runtime/*_v109.py' -m pytest -q tests/*v109.py
          coverage json -o "$GITHUB_WORKSPACE/coverage-v109.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path(os.environ['GITHUB_WORKSPACE']) / 'coverage-v109.json'
          report = json.loads(report_path.read_text(encoding='utf-8'))
          total = float(report['totals']['percent_covered'])
          print(f'exact V109 branch-aware coverage: {total:.6f}%')
          if total < 90.0:
              raise SystemExit(f'coverage {total:.6f}% is below 90.0%')
          PY
          python "$GITHUB_WORKSPACE/tools/schema109_qualified_materializer.py" record-coverage \
            --root . --coverage-json "$GITHUB_WORKSPACE/coverage-v109.json"

      - name: Architecture, static, predecessor and release verification
        working-directory: /tmp/schema109-qualified-target
        run: |
          python -m tools.architecture_audit_v109 .
          python -m tools.static_audit_v109 .
          python -m tools.platform_v108 --root . verify-release
          python -m tools.platform_v109 --root . verify-release
          python -m compileall -q app tools tests

      - name: Concurrent claim, replay and policy-equivocation stress
        working-directory: /tmp/schema109-qualified-target
        run: python -m tools.stress_v109 --iterations 1000 --workers 8

      - name: Verify migration packaging and PostgreSQL contract
        working-directory: /tmp/schema109-qualified-target
        run: |
          cmp migrations/v109/001_remote_signer_attestation.sql app/platform_assets/v109/migrations/001_remote_signer_attestation.sql
          psql --host=127.0.0.1 --port=5432 --username=astra --dbname=astra \
            --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            policy_fk integer;
            append_trigger integer;
            append_events text[];
          BEGIN
            SELECT count(*) INTO policy_fk
            FROM information_schema.table_constraints
            WHERE table_schema = 'public'
              AND table_name = 'astra_remote_sign_request_v109'
              AND constraint_name = 'astra_remote_sign_request_policy_fk_v109'
              AND constraint_type = 'FOREIGN KEY';
            IF policy_fk <> 1 THEN
              RAISE EXCEPTION 'request policy foreign-key contract mismatch: %', policy_fk;
            END IF;

            SELECT
              count(DISTINCT trigger_name),
              array_agg(DISTINCT event_manipulation::text ORDER BY event_manipulation::text)
            INTO append_trigger, append_events
            FROM information_schema.triggers
            WHERE event_object_schema = 'public'
              AND event_object_table = 'astra_remote_sign_event_v109'
              AND trigger_name = 'astra_remote_sign_event_append_only_v109';
            IF append_trigger <> 1 OR append_events <> ARRAY['DELETE', 'UPDATE']::text[] THEN
              RAISE EXCEPTION
                'append-only audit trigger contract mismatch: triggers=% events=%',
                append_trigger,
                append_events;
            END IF;
          END
          $$;
          SQL

      - name: Verify exact final diff, source immutability and production safety
        working-directory: /tmp/schema109-qualified-target
        run: |
          python "$GITHUB_WORKSPACE/tools/schema109_qualified_materializer.py" verify-final \
            --root . \
            --base "$EXPECTED_BASE" \
            --source-manifest "$GITHUB_WORKSPACE/_schema109_final_payload/manifest.json" \
            --output "$GITHUB_WORKSPACE/schema109-final-hashes.json"

      - name: Commit qualified Schema 109 overlay to clean branch
        working-directory: /tmp/schema109-qualified-target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Schema 109 remote signer attestation"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "materialized_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Persist final qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema109-qualified-materialization-${{ github.run_id }}
          path: |
            _schema109_final_payload/manifest.json
            schema109-final-hashes.json
            coverage-v109.json
          if-no-files-found: warn
          retention-days: 14
