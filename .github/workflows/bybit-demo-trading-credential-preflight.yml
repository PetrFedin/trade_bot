name: bybit-demo-trading-credential-preflight

on:
  pull_request:
    paths:
      - 'app/execution/bybit_demo_trading_credential_preflight.py'
      - 'tools/probe_bybit_demo_trading_credential_preflight.py'
      - 'tests/test_bybit_demo_trading_credential_preflight.py'
      - 'docs/BYBIT_DEMO_TRADING_CREDENTIAL_PREFLIGHT.md'
      - '.github/workflows/bybit-demo-trading-credential-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_trading_credential_preflight.py'
      - 'tools/probe_bybit_demo_trading_credential_preflight.py'
      - 'tests/test_bybit_demo_trading_credential_preflight.py'
      - 'docs/BYBIT_DEMO_TRADING_CREDENTIAL_PREFLIGHT.md'
      - '.github/workflows/bybit-demo-trading-credential-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-demo-trading-credential-preflight-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: GET-only Demo trading credential tests
        run: |
          pytest -q tests/test_bybit_demo_trading_credential_preflight.py
      - name: Ruff Demo trading credential gate
        run: |
          ruff check \
            app/execution/bybit_demo_trading_credential_preflight.py \
            tools/probe_bybit_demo_trading_credential_preflight.py \
            tests/test_bybit_demo_trading_credential_preflight.py
      - name: Bandit Demo trading credential gate
        run: |
          bandit -q \
            app/execution/bybit_demo_trading_credential_preflight.py \
            tools/probe_bybit_demo_trading_credential_preflight.py
      - name: Compile Demo trading credential gate
        run: |
          python -m compileall -q \
            app/execution/bybit_demo_trading_credential_preflight.py \
            tools/probe_bybit_demo_trading_credential_preflight.py

  operational:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, bybit-demo]
    environment: bybit-demo
    timeout-minutes: 10
    env:
      BYBIT_DEMO_TRADING_API_KEY: ${{ secrets.BYBIT_DEMO_TRADING_API_KEY }}
      BYBIT_DEMO_TRADING_API_SECRET: ${{ secrets.BYBIT_DEMO_TRADING_API_SECRET }}
      BYBIT_DEMO_READONLY_API_KEY_SHA256: ${{ vars.BYBIT_DEMO_READONLY_API_KEY_SHA256 }}
      BYBIT_MAINNET_READONLY_API_KEY_SHA256: ${{ vars.BYBIT_MAINNET_READONLY_API_KEY_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install GET-only probe dependencies
        run: |
          python -m pip install --disable-pip-version-check .
          python -m pip check
      - name: Verify Demo trading credential without order mutation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python -m tools.probe_bybit_demo_trading_credential_preflight \
            --output artifacts/bybit-demo-trading-credential-preflight.json
          PREFLIGHT_STATUS=$?
          set -e
          cat artifacts/bybit-demo-trading-credential-preflight.json
          exit "$PREFLIGHT_STATUS"
      - name: Upload sanitized credential evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-demo-trading-credential-preflight-${{ github.run_id }}
          path: artifacts/bybit-demo-trading-credential-preflight.json
          if-no-files-found: warn
          retention-days: 7
