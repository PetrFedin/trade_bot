name: bybit-mainnet-readonly-preflight

on:
  push:
    branches: [main]
    paths:
      - 'app/execution/bybit_mainnet_clock_preflight.py'
      - 'app/observability/bybit_mainnet_readonly_health.py'
      - 'app/runtime/bybit_mainnet_readonly_operational_probe.py'
      - 'tests/test_bybit_mainnet_clock_preflight.py'
      - 'tests/test_bybit_mainnet_readonly_operational_health.py'
      - 'docs/BYBIT_MAINNET_READONLY_PREFLIGHT.md'
      - '.github/workflows/bybit-mainnet-readonly-preflight.yml'
  pull_request:
    paths:
      - 'app/execution/bybit_mainnet_clock_preflight.py'
      - 'app/observability/bybit_mainnet_readonly_health.py'
      - 'app/runtime/bybit_mainnet_readonly_operational_probe.py'
      - 'tests/test_bybit_mainnet_clock_preflight.py'
      - 'tests/test_bybit_mainnet_readonly_operational_health.py'
      - 'docs/BYBIT_MAINNET_READONLY_PREFLIGHT.md'
      - '.github/workflows/bybit-mainnet-readonly-preflight.yml'

permissions:
  contents: read

concurrency:
  group: bybit-mainnet-readonly-preflight-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]'
          python -m pip check
      - name: Clock preflight and operational health tests
        run: |
          pytest -q \
            tests/test_bybit_mainnet_clock_preflight.py \
            tests/test_bybit_mainnet_readonly_operational_health.py
      - name: Ruff preflight boundary
        run: |
          ruff check \
            app/execution/bybit_mainnet_clock_preflight.py \
            app/observability/bybit_mainnet_readonly_health.py \
            app/runtime/bybit_mainnet_readonly_operational_probe.py \
            tests/test_bybit_mainnet_clock_preflight.py \
            tests/test_bybit_mainnet_readonly_operational_health.py
      - name: Bandit preflight boundary
        run: |
          bandit -q \
            app/execution/bybit_mainnet_clock_preflight.py \
            app/observability/bybit_mainnet_readonly_health.py \
            app/runtime/bybit_mainnet_readonly_operational_probe.py
      - name: Compile preflight boundary
        run: |
          python -m compileall -q \
            app/execution/bybit_mainnet_clock_preflight.py \
            app/observability/bybit_mainnet_readonly_health.py \
            app/runtime/bybit_mainnet_readonly_operational_probe.py
