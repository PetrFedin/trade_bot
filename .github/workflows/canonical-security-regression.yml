name: canonical-security-regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/runtime/**
      - app/platform_assets/v107/**
      - app/platform_assets/v108/**
      - app/platform_assets/v109/**
      - migrations/v107/**
      - migrations/v108/**
      - migrations/v109/**
      - tests/**
      - tools/**
      - RELEASE_IDENTITY_V10*.json
      - LIVE_EXECUTION_STATUS_V10*.json
      - pyproject.toml
      - .github/workflows/schema107-production-rollout-actuator.yml
      - .github/workflows/schema108-asymmetric-signing-authority.yml
      - .github/workflows/schema109-remote-signer-attestation.yml
      - .github/workflows/canonical-security-regression.yml
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - app/runtime/**
      - app/platform_assets/v107/**
      - app/platform_assets/v108/**
      - app/platform_assets/v109/**
      - migrations/v107/**
      - migrations/v108/**
      - migrations/v109/**
      - tests/**
      - tools/**
      - RELEASE_IDENTITY_V10*.json
      - LIVE_EXECUTION_STATUS_V10*.json
      - pyproject.toml
      - .github/workflows/schema107-production-rollout-actuator.yml
      - .github/workflows/schema108-asymmetric-signing-authority.yml
      - .github/workflows/schema109-remote-signer-attestation.yml
      - .github/workflows/canonical-security-regression.yml

permissions:
  contents: read

concurrency:
  group: canonical-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra-ci
          POSTGRES_DB: astra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASTRA_TEST_POSTGRES_DSN: postgresql://astra:astra-ci@127.0.0.1:5432/astra
      PGPASSWORD: astra-ci
    steps:
      - name: Checkout exact branch or PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check ".[test,postgresql,dev]"
          python -m pip check
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Verify and apply security migrations twice in lineage order
        run: |
          set -euo pipefail
          cmp migrations/v107/001_production_rollout_actuator.sql app/platform_assets/v107/migrations/001_production_rollout_actuator.sql
          cmp migrations/v108/001_asymmetric_signing_authority.sql app/platform_assets/v108/migrations/001_asymmetric_signing_authority.sql
          cmp migrations/v109/001_remote_signer_attestation.sql app/platform_assets/v109/migrations/001_remote_signer_attestation.sql
          migrations=(
            migrations/v107/001_production_rollout_actuator.sql
            migrations/v108/001_asymmetric_signing_authority.sql
            migrations/v109/001_remote_signer_attestation.sql
          )
          for pass in 1 2; do
            for migration in "${migrations[@]}"; do
              psql -h 127.0.0.1 -p 5432 -U astra -d astra -v ON_ERROR_STOP=1 -f "$migration"
            done
          done

      - name: Lint qualified Schema 109 surface and run lineage regressions
        run: |
          ruff check app/runtime/*_v109.py tools/*v109.py tools/platform_v108.py tools/architecture_audit_v108.py tools/product_identity.py tests/*v109.py tests/test_product_identity.py
          pytest -q tests/*v107.py tests/*v108.py tests/*v109.py tests/test_product_identity.py
          pytest -q

      - name: Enforce branch-aware coverage floors
        shell: bash
        run: |
          set -euo pipefail
          check_coverage() {
            local schema="$1" threshold="$2"
            coverage erase
            coverage run --branch --include="app/runtime/*_v${schema}.py" -m pytest -q "tests/"*"v${schema}.py"
            coverage json -o "coverage-v${schema}.json"
            python - "$schema" "$threshold" <<'PY'
          import json, sys
          from pathlib import Path
          schema, threshold = sys.argv[1], float(sys.argv[2])
          total = float(json.loads(Path(f"coverage-v{schema}.json").read_text())["totals"]["percent_covered"])
          print(f"V{schema} branch-aware coverage: {total:.6f}%")
          if total < threshold:
              raise SystemExit(f"V{schema} coverage {total:.6f}% < {threshold:.1f}%")
          PY
          }
          check_coverage 107 93.0
          check_coverage 108 98.0
          check_coverage 109 90.0

      - name: Audit, compile, verify release lineage and stress
        run: |
          set -euo pipefail
          python tools/architecture_audit_v107.py .
          python tools/static_audit_v107.py .
          python tools/architecture_audit_v108.py .
          python tools/static_audit_v108.py .
          python -m tools.architecture_audit_v109 .
          python -m tools.static_audit_v109 .
          python -m compileall -q app tools tests
          python - <<'PYV107'
          import hashlib, json
          from pathlib import Path
          identity = json.loads(Path("RELEASE_IDENTITY_V107.json").read_text(encoding="utf-8"))
          prefixes = ("app/runtime/", "app/platform_assets/v107/", "migrations/v107/")
          critical = {
              path: digest
              for path, digest in identity["files"].items()
              if path.startswith(prefixes) or path == "LIVE_EXECUTION_STATUS_V107.json"
          }
          if not critical:
              raise SystemExit("V107 critical identity set is empty")
          mismatches = []
          for relative, expected in sorted(critical.items()):
              path = Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else "missing"
              if actual != expected:
                  mismatches.append(f"{relative}: {actual} != {expected}")
          if mismatches:
              raise SystemExit("V107 frozen critical artifact drift:\n" + "\n".join(mismatches))
          print(f"PASS V107 frozen critical artifacts: {len(critical)} files")
          PYV107
          python tools/platform_v108.py --root . verify-release
          python -m tools.platform_v109 --root . verify-release
          python -m tools.stress_v107 --iterations 1000 --workers 8
          python -m tools.stress_v108 --iterations 1000 --workers 8
          python -m tools.stress_v109 --iterations 1000 --workers 8

      - name: Verify durable database contracts
        run: |
          psql -h 127.0.0.1 -p 5432 -U astra -d astra -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v107_triggers integer; v107_events text[];
            v108_triggers integer; v108_events text[];
            v109_policy_fk integer; v109_triggers integer; v109_events text[];
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='astra_rollout_execution_v107'
                AND column_name='deployment_uid' AND is_nullable='NO'
            ) THEN RAISE EXCEPTION 'V107 execution deployment_uid contract missing'; END IF;
            IF (SELECT count(*) FROM information_schema.columns
                WHERE table_schema='public' AND table_name='astra_rollout_fence_v107'
                  AND column_name='deployment_uid') <> 1
            THEN RAISE EXCEPTION 'V107 fence deployment_uid contract mismatch'; END IF;
            SELECT count(DISTINCT trigger_name),
                   array_agg(DISTINCT event_manipulation::text ORDER BY event_manipulation::text)
              INTO v107_triggers, v107_events
              FROM information_schema.triggers
             WHERE event_object_schema='public' AND event_object_table='astra_rollout_event_v107'
               AND trigger_name='astra_rollout_event_append_only_v107';
            IF v107_triggers <> 1 OR v107_events <> ARRAY['DELETE','UPDATE']::text[]
            THEN RAISE EXCEPTION 'V107 append-only trigger mismatch'; END IF;

            IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints
              WHERE table_schema='public' AND table_name='astra_signature_replay_v108'
                AND constraint_type='UNIQUE')
            THEN RAISE EXCEPTION 'V108 replay uniqueness missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='astra_signing_keyring_v108'
                AND column_name='generation' AND is_nullable='NO')
            THEN RAISE EXCEPTION 'V108 generation contract missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints
              WHERE table_schema='public' AND table_name='astra_receipt_authorization_v108'
                AND constraint_type='FOREIGN KEY')
            THEN RAISE EXCEPTION 'V108 receipt authorization binding missing'; END IF;
            SELECT count(DISTINCT trigger_name),
                   array_agg(DISTINCT event_manipulation::text ORDER BY event_manipulation::text)
              INTO v108_triggers, v108_events
              FROM information_schema.triggers
             WHERE event_object_schema='public' AND event_object_table='astra_signing_event_v108'
               AND trigger_name='astra_signing_event_append_only_v108';
            IF v108_triggers <> 1 OR v108_events <> ARRAY['DELETE','UPDATE']::text[]
            THEN RAISE EXCEPTION 'V108 append-only trigger mismatch'; END IF;

            SELECT count(*) INTO v109_policy_fk FROM information_schema.table_constraints
             WHERE table_schema='public' AND table_name='astra_remote_sign_request_v109'
               AND constraint_name='astra_remote_sign_request_policy_fk_v109'
               AND constraint_type='FOREIGN KEY';
            IF v109_policy_fk <> 1 THEN RAISE EXCEPTION 'V109 policy FK mismatch'; END IF;
            SELECT count(DISTINCT trigger_name),
                   array_agg(DISTINCT event_manipulation::text ORDER BY event_manipulation::text)
              INTO v109_triggers, v109_events
              FROM information_schema.triggers
             WHERE event_object_schema='public' AND event_object_table='astra_remote_sign_event_v109'
               AND trigger_name='astra_remote_sign_event_append_only_v109';
            IF v109_triggers <> 1 OR v109_events <> ARRAY['DELETE','UPDATE']::text[]
            THEN RAISE EXCEPTION 'V109 append-only trigger mismatch'; END IF;
          END
          $$;
          SQL

      - name: Verify signing boundary and fail-closed production state
        run: |
          set -euo pipefail
          if grep -R -n -E 'Ed25519PrivateKey|private_key_(bytes|b64)|hmac\.new' app/runtime/*_v108.py app/runtime/*_v109.py; then
            echo "forbidden private or symmetric signing material in V108/V109 runtime" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          states = {s: json.loads(Path(f"LIVE_EXECUTION_STATUS_V{s}.json").read_text()) for s in (107,108,109)}
          assert states[107]["status"] == "LOCAL_QUALIFICATION_ONLY"
          for key in ("production_kubernetes_mutation_authorized","external_order_routing_allowed","live_trading_allowed"):
              assert states[107][key] is False, key
          for key in ("production_signing_authority_verified","production_kubernetes_mutation_authorized","external_order_routing_allowed","live_trading_allowed","private_key_material_persisted_by_runtime"):
              assert states[108][key] is False, key
          for key in ("production_remote_signer_verified","production_signing_authority_verified","production_kubernetes_mutation_authorized","external_order_routing_allowed","live_trading_allowed","automatic_sign_post_retry_allowed","private_key_material_persisted_by_runtime"):
              assert states[109][key] is False, key
          PY
