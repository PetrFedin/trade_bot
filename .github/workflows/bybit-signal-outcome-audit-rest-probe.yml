name: bybit-signal-outcome-audit-rest-probe

on:
  push:
    branches:
      - agent/bybit-signal-outcome-audit-rest-probe
    paths:
      - 'app/strategy/crypto_signal_outcome_audit.py'
      - 'tools/audit_bybit_crypto_signal_outcomes_rest.py'
      - '.github/workflows/bybit-signal-outcome-audit-rest-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-signal-outcome-audit-rest-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regional-rest-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint and compile REST audit probe
        run: |
          ruff check --output-format=github tools/audit_bybit_crypto_signal_outcomes_rest.py
          python -m compileall -q tools/audit_bybit_crypto_signal_outcomes_rest.py

      - name: Audit frozen signals from regional public V5
        run: |
          set -o pipefail
          mkdir -p artifacts/bybit-signal-rest-audit
          PYTHONPATH=. python tools/audit_bybit_crypto_signal_outcomes_rest.py \
            --host api.bybit.eu \
            --lookback-days 7 \
            --opening-equity 1000 \
            --target 20 \
            --output artifacts/bybit-signal-rest-audit/report.json \
            2>&1 | tee artifacts/bybit-signal-rest-audit/run.log

      - name: Print compact REST audit summary
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('artifacts/bybit-signal-rest-audit/report.json').read_text()
          )
          summary = {
              'host': report['host'],
              'symbols': report['symbols'],
              'trade_count': report['trade_count'],
              'aggregate': report['aggregate'],
              'by_symbol': report['by_symbol'],
              'by_side': report['by_side'],
              'perfect_positive': report[
                  'retrospective_perfect_positive_cross_symbol_patterns'
              ],
              'perfect_planned_profit': report[
                  'retrospective_perfect_planned_profit_cross_symbol_patterns'
              ],
          }
          print('BYBIT_SIGNAL_REST_SUMMARY=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload regional REST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-signal-rest-audit-${{ github.run_id }}
          path: artifacts/bybit-signal-rest-audit
          if-no-files-found: error
          retention-days: 30
