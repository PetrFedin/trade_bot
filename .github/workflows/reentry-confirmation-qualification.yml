name: reentry-confirmation-qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/strategy/managed_backtest.py'
      - 'app/strategy/reentry_confirmation.py'
      - 'data/historical/aapl_plotly_multiregime/qualification_reentry_confirmation_shadow.json'
      - 'tools/qualify_reentry_confirmation_shadow.py'
      - 'tests/test_reentry_confirmation.py'
      - 'tests/test_managed_reentry_confirmation.py'
      - 'tests/test_reentry_confirmation_shadow.py'
      - 'requirements.lock'
      - 'LIVE_EXECUTION_STATUS_V109.json'
      - '.github/workflows/reentry-confirmation-qualification.yml'
  pull_request:
    paths:
      - 'app/strategy/managed_backtest.py'
      - 'app/strategy/reentry_confirmation.py'
      - 'data/historical/aapl_plotly_multiregime/qualification_reentry_confirmation_shadow.json'
      - 'tools/qualify_reentry_confirmation_shadow.py'
      - 'tests/test_reentry_confirmation.py'
      - 'tests/test_managed_reentry_confirmation.py'
      - 'tests/test_reentry_confirmation_shadow.py'
      - 'requirements.lock'
      - 'LIVE_EXECUTION_STATUS_V109.json'
      - '.github/workflows/reentry-confirmation-qualification.yml'

permissions:
  contents: read

concurrency:
  group: reentry-confirmation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked qualification graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint re-entry qualification surface
        run: >-
          ruff check --output-format=github
          app/strategy/managed_backtest.py
          app/strategy/reentry_confirmation.py
          tools/qualify_reentry_confirmation_shadow.py
          tests/test_reentry_confirmation.py
          tests/test_managed_reentry_confirmation.py
          tests/test_reentry_confirmation_shadow.py

      - name: Re-entry state machine and managed-backtest regressions
        run: >-
          pytest -q
          tests/test_reentry_confirmation.py
          tests/test_managed_reentry_confirmation.py
          tests/test_position_management.py
          tests/test_regime_momentum.py
          tests/test_managed_strategy_backtest.py
          tests/test_exit_quality_trace.py
          tests/test_exit_quality_shadow.py

      - name: Generate predeclared re-entry shadow evidence
        run: |
          mkdir -p reentry-confirmation-evidence
          python -m tools.qualify_reentry_confirmation_shadow \
            --manifest data/historical/aapl_plotly_multiregime/manifest.json \
            --policy data/historical/aapl_plotly_multiregime/qualification_reentry_confirmation_shadow.json \
            --output reentry-confirmation-evidence/aapl-reentry-confirmation-shadow-v1.json
          pytest -q tests/test_reentry_confirmation_shadow.py

      - name: Verify candidate remains non-promotable
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          evidence = json.loads(
              Path(
                  'reentry-confirmation-evidence/aapl-reentry-confirmation-shadow-v1.json'
              ).read_text(encoding='utf-8')
          )
          assert evidence['schema_version'] == 'reentry-confirmation-evidence-v1'
          assert evidence['shadow_only'] is True
          assert evidence['promotion_allowed'] is False
          aggregate = evidence['aggregate']
          assert aggregate['baseline_one_bar_reentry_count'] == 1
          assert aggregate['candidate_one_bar_reentry_count'] == 0
          assert aggregate['candidate_pending_reentry_blocks'] == 1
          assert aggregate['one_bar_reentry_reduced'] is True
          baseline = aggregate['baseline']
          candidate = aggregate['candidate']
          assert Decimal(candidate['net_closed_trade_pnl']) > Decimal(
              baseline['net_closed_trade_pnl']
          )
          assert Decimal(candidate['profit_factor']) > Decimal(
              baseline['profit_factor']
          )
          assert Decimal(candidate['profit_factor']) < Decimal('1')
          assert Decimal(candidate['net_closed_trade_pnl']) < Decimal('0')
          blockers = set(evidence['promotion_blockers'])
          assert 'CANDIDATE_AGGREGATE_PROFIT_FACTOR_BELOW_ONE' in blockers
          assert 'CANDIDATE_CLOSED_TRADE_PNL_NOT_POSITIVE' in blockers
          PY

      - name: Compile re-entry qualification boundary
        run: >-
          python -m compileall -q
          app/strategy/managed_backtest.py
          app/strategy/reentry_confirmation.py
          tools/qualify_reentry_confirmation_shadow.py

      - name: Verify fail-closed live state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('LIVE_EXECUTION_STATUS_V109.json').read_text(encoding='utf-8'))
          assert state['external_order_routing_allowed'] is False
          assert state['live_trading_allowed'] is False
          PY

      - name: Upload re-entry qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reentry-confirmation-${{ github.run_id }}
          path: reentry-confirmation-evidence/*.json
          if-no-files-found: error
          retention-days: 30
