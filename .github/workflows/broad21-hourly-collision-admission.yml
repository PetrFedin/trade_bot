name: broad21-hourly-collision-admission

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/full_broad21_hourly_ambiguity.py'
      - 'tests/test_full_broad21_hourly_ambiguity.py'
      - '.github/workflows/broad21-hourly-collision-admission.yml'
      - 'research/snapshots/bybit_ambiguous_broad_hourly_20261013/**'

permissions:
  contents: read

jobs:
  fail-closed-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check
      - name: Lint and fully source-verified 24-case historical replay
        run: |
          ruff check tools/full_broad21_hourly_ambiguity.py tests/test_full_broad21_hourly_ambiguity.py
          pytest -q tests/test_full_broad21_hourly_ambiguity.py
      - name: Preserve complete hourly threshold evidence without fill certification
        run: |
          mkdir -p broad21-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.full_broad21_hourly_ambiguity import reconstruct_broad21
          r = reconstruct_broad21(
              bars_dir=Path("research/snapshots/bybit_3y_2023-10-09_2026-10-08"),
              previously_pinned_hourly_dir=Path("research/snapshots/bybit_intraday_trade_cases_60m"),
              six_major_additional_dir=Path("research/snapshots/bybit_ambiguous_six_hourly_20261013"),
              broad_additional_dir=Path("research/snapshots/bybit_ambiguous_broad_hourly_20261013"),
          )
          Path("broad21-evidence/coverage.json").write_text(json.dumps(r, indent=2, sort_keys=True))
          assert r["strategy_promotion_allowed"] is False
          assert r["live_trading_allowed"] is False
          assert r["summary"]["preselected_cases"] == 24
          assert r["complete_case_coverage"] is True
          assert r["summary"]["hourly_source_verified_cases"] == 24
          assert r["summary"]["missing_hourly_source_cases"] == 0
          assert r["summary"]["hourly_candles"] == 576
          assert sum(r["summary"]["first_touch_counts"].values()) == 24
          assert r["counterfactual_portfolio_replayed"] is False
          assert r["actual_exchange_fills_verified"] is False
          print("BROAD21_HOURLY", json.dumps(r["summary"], sort_keys=True))
          for case in r["cases"]:
              print("BROAD21_CASE", case["symbol"], case["exit_day"],
                    case["observed_hourly_threshold_order"]["ordering"])
          print("BROAD21_EVIDENCE_SHA256", r["evidence_sha256"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: broad21-hourly-evidence-${{ github.run_id }}
          path: broad21-evidence/coverage.json
          if-no-files-found: error
          retention-days: 30
