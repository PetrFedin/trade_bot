name: bybit-demo-session-risk-store-quality

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'app/execution/bybit_demo_session_risk_ledger.py'
      - 'app/execution/bybit_demo_session_risk_store.py'
      - 'tests/test_bybit_demo_session_risk_ledger.py'
      - 'tests/test_bybit_demo_session_risk_store.py'
      - '.github/workflows/bybit-demo-session-risk-store-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/execution/bybit_demo_session_risk_ledger.py'
      - 'app/execution/bybit_demo_session_risk_store.py'
      - 'tests/test_bybit_demo_session_risk_ledger.py'
      - 'tests/test_bybit_demo_session_risk_store.py'
      - '.github/workflows/bybit-demo-session-risk-store-quality.yml'

permissions:
  contents: read

concurrency:
  group: bybit-demo-session-risk-store-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint durable demo session risk store
        run: >-
          ruff check --output-format=github
          app/execution/bybit_demo_session_risk_ledger.py
          app/execution/bybit_demo_session_risk_store.py
          tests/test_bybit_demo_session_risk_ledger.py
          tests/test_bybit_demo_session_risk_store.py

      - name: Test durable demo session risk store
        run: >-
          pytest -vv
          tests/test_bybit_demo_session_risk_ledger.py
          tests/test_bybit_demo_session_risk_store.py

      - name: Compile durable demo session risk store
        run: >-
          python -m compileall -q
          app/execution/bybit_demo_session_risk_ledger.py
          app/execution/bybit_demo_session_risk_store.py
