name: bybit-crypto-next-open-quality-audit

on:
  push:
    branches:
      - agent/trading-quality-profit-protection
    paths:
      - 'tools/audit_bybit_crypto_next_open_quality.py'
      - 'tests/test_audit_bybit_crypto_next_open_quality.py'
      - 'app/strategy/crypto_execution_risk.py'
      - '.github/workflows/bybit-crypto-next-open-quality-audit.yml'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Completed UTC Bybit archive days; minimum 14'
        required: false
        default: '14'

permissions:
  contents: read

concurrency:
  group: bybit-crypto-next-open-quality-audit-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Lint next-open audit
        run: >-
          ruff check --output-format=github
          tools/audit_bybit_crypto_next_open_quality.py
          tests/test_audit_bybit_crypto_next_open_quality.py

      - name: Test next-open audit contract
        run: pytest -vv tests/test_audit_bybit_crypto_next_open_quality.py

      - name: Compile next-open audit
        run: python -m compileall -q tools/audit_bybit_crypto_next_open_quality.py

  archive-audit-14d:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked graph
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip check

      - name: Enforce audit window
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          if ! [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]] || [ "$LOOKBACK_DAYS" -lt 14 ]; then
            echo 'next-open quality audit requires at least 14 completed UTC days' >&2
            exit 1
          fi

      - name: Audit official Bybit next-open gaps
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        shell: bash
        run: |
          mkdir -p artifacts/bybit-next-open-quality
          PYTHONPATH=. python tools/audit_bybit_crypto_next_open_quality.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,LINKUSDT,ADAUSDT \
            --lookback-days "$LOOKBACK_DAYS" \
            --equity 1000 \
            --output artifacts/bybit-next-open-quality/audit.json

      - name: Enforce audit-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('artifacts/bybit-next-open-quality/audit.json').read_text())
          assert audit['qualification'] == 'BYBIT_CRYPTO_NEXT_OPEN_QUALITY_AUDIT'
          assert len(audit['archive_dates']) >= 14
          assert audit['archive_completed_utc_days_only'] is True
          assert audit['gap_threshold_selected'] is False
          assert audit['automatic_execution_gate_activation_allowed'] is False
          assert audit['strategy_promotion_allowed'] is False
          assert audit['demo_activation_allowed'] is False
          assert audit['live_activation_allowed'] is False
          PY

      - name: Upload next-open quality audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bybit-crypto-next-open-quality-${{ github.run_id }}
          path: artifacts/bybit-next-open-quality
          if-no-files-found: warn
          retention-days: 30
