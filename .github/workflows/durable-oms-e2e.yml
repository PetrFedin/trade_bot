name: durable-oms-e2e

on:
  push:
    branches: [agent/schema108-paper-core-foundation]
  pull_request:
    paths:
      - 'app/domain/**'
      - 'app/portfolio/**'
      - 'app/oms/**'
      - 'app/application/order_lifecycle.py'
      - 'tests/test_durable_oms_e2e.py'
      - '.github/workflows/durable-oms-e2e.yml'

permissions:
  contents: read

concurrency:
  group: durable-oms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Durable OMS and reconciliation E2E
        run: pytest -q tests/test_durable_oms_e2e.py
      - name: Trading core E2E regression
        run: pytest -q tests/test_trading_core_e2e.py
      - name: Full stacked regression
        run: pytest -q
      - name: Compile stable product core
        run: python -m compileall -q app/domain app/portfolio app/oms app/application app/risk app/strategy
