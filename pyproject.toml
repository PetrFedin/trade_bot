[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-schema91-durable-paper-service"
version = "7.21.0"
description = "ASTRA schema 91 durable market capture, supervised paper service and qualification controls"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "coverage>=7,<8"]

[project.scripts]
astra-platform-v91 = "tools.platform_v91:main"
astra-architecture-audit-v91 = "tools.architecture_audit_v91:main"

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
