[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-schema99-external-paper-roundtrip"
version = "7.29.0"
description = "ASTRA paper-only broker round trip, recovery and supervised deployment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "coverage>=7,<8"]

[project.scripts]
astra-platform-v99 = "tools.platform_v99:main"

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
