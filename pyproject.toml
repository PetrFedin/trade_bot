[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-trade-bot"
version = "7.39.0"
description = "ASTRA paper-trading product with Schema 109 remote signer attestation compatibility"
requires-python = ">=3.11"
dependencies = ["cryptography>=50,<51"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "coverage>=7,<8"]
postgresql = ["psycopg[binary]>=3.2,<4"]
marketdata = ["websockets>=15,<17"]
dev = [
    "pytest>=8,<10",
    "coverage>=7,<8",
    "build>=1.2,<2",
    "hypothesis>=6,<7",
    "ruff==0.16.1",
    "mypy>=1.17,<2",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
    "pip>=26.0,<26.2",
    "pip-tools==7.6.0",
    "websockets>=15,<17",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
astra-bybit-product = "tools.bybit_product:main"
astra-external-paper-readonly = "tools.external_paper_readonly:main"
astra-platform-v105 = "tools.platform_v105:main"
astra-architecture-audit-v105 = "tools.architecture_audit_v105:main"
astra-static-audit-v105 = "tools.static_audit_v105:main"
astra-stress-v105 = "tools.stress_v105:main"
astra-platform-v106 = "tools.platform_v106:main"
astra-architecture-audit-v106 = "tools.architecture_audit_v106:main"
astra-static-audit-v106 = "tools.static_audit_v106:main"
astra-stress-v106 = "tools.stress_v106:main"
astra-platform-v107 = "tools.platform_v107:main"
astra-architecture-audit-v107 = "tools.architecture_audit_v107:main"
astra-static-audit-v107 = "tools.static_audit_v107:main"
astra-stress-v107 = "tools.stress_v107:main"
astra-platform-v108 = "tools.platform_v108:main"
astra-architecture-audit-v108 = "tools.architecture_audit_v108:main"
astra-static-audit-v108 = "tools.static_audit_v108:main"
astra-stress-v108 = "tools.stress_v108:main"
astra-platform-v109 = "tools.platform_v109:main"
astra-architecture-audit-v109 = "tools.architecture_audit_v109:main"
astra-static-audit-v109 = "tools.static_audit_v109:main"
astra-stress-v109 = "tools.stress_v109:main"

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.setuptools.package-data]
"app.platform_assets.v105" = ["migrations/*.sql"]
"app.platform_assets.v106" = ["migrations/*.sql"]
"app.platform_assets.v107" = ["migrations/*.sql"]
"app.platform_assets.v108" = ["migrations/*.sql"]
"app.platform_assets.v109" = ["migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
